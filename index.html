// Real incident, Sept 2026: Allan deleted the (apparently unused) "Grading
// Winter 2026" season and worried he'd lost that season's evaluations.
// Turned out nothing was lost — the Android app's evaluation screens save
// `season_name` as EITHER one season's name OR several season names joined
// with ", " (sorted) when one evaluation covers multiple seasons, e.g.
// "Grading Winter 2026, Winter 2026" for a player evaluated once across
// both. The web hub's evaluation screens originally queried with a plain
// `.eq("season_name", seasonName)`, which can never match a compound value
// — so any evaluation spanning more than one season was invisible here
// even though the row was completely intact. Fix: never filter this table
// by exact season_name match; always fetch and check whether the target
// season is one of the comma-separated components instead.
function evaluationCoversSeason(evaluationSeasonName, targetSeasonName) {
  return (evaluationSeasonName || "").split(",").map(s => s.trim()).includes(targetSeasonName);
}

// Player Evaluations — column names confirmed via information_schema.columns
// (Sept 2026). Unique on (club_id, season_name, player_name), so picking a
// season + player either loads that existing evaluation or starts a blank
// one; Save always upserts on that same composite key. training_attendance/
// training_total/game_attendance/game_total default to auto-computed
// counts from training_sessions/games (same convention as Stats/Player
// Report) but can be overridden by hand before saving, matching how the
// Android app treats these as editable totals rather than pure read-only
// derived fields.
function PlayerEvaluationsScreen({ clubId, coachName, onBack }) {
  const [seasons, setSeasons] = useState([]);
  const [players, setPlayers] = useState([]);
  const [seasonName, setSeasonName] = useState("");
  const [playerName, setPlayerName] = useState("");
  const [evaluations, setEvaluations] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [deletingId, setDeletingId] = useState(null);
  const [errorMsg, setErrorMsg] = useState("");
  const [infoMsg, setInfoMsg] = useState("");

  const blankForm = (seasonKey) => ({
    // evalSeasonKey is the ACTUAL season_name value Save will write —
    // normally just the selected season, but if an existing row already
    // covers this season under a compound name (see evaluationCoversSeason
    // above), it's switched to that exact compound string instead, so
    // saving an edit never splits one multi-season evaluation into two
    // separate rows.
    evalSeasonKey: seasonKey,
    evaluationDate: new Date().toISOString().slice(0, 10),
    ageGroup: "",
    ballSkills: 3, attacking: 3, defense: 3, perception: 3, footwork: 3,
    skillLevel: "Medium",
    mainPositions: [],
    nextSeason: "Stay",
    comments: "",
    trainingAttendance: 0, trainingTotal: 0, gameAttendance: 0, gameTotal: 0,
  });
  const [form, setForm] = useState(blankForm(""));

  useEffect(() => {
    (async () => {
      const [seasonsRes, playersRes] = await Promise.all([
        db.from("seasons").select("*").eq("club_id", clubId).order("name", { ascending: true }),
        db.from("players").select("*").eq("club_id", clubId).order("name", { ascending: true }),
      ]);
      if (seasonsRes.error) { setErrorMsg(seasonsRes.error.message); setLoading(false); return; }
      if (playersRes.error) { setErrorMsg(playersRes.error.message); setLoading(false); return; }
      setSeasons(seasonsRes.data || []);
      setPlayers(playersRes.data || []);
      if (seasonsRes.data && seasonsRes.data.length > 0) setSeasonName(seasonsRes.data[0].name);
      if (playersRes.data && playersRes.data.length > 0) setPlayerName(playersRes.data[0].name);
      if (!seasonsRes.data || seasonsRes.data.length === 0) setLoading(false);
    })();
  }, [clubId]);

  const loadForSeason = useCallback(async () => {
    if (!seasonName) return;
    setLoading(true);
    setErrorMsg("");
    // Deliberately does NOT filter by season_name in the query itself (see
    // evaluationCoversSeason above) — an evaluation covering this season
    // might be stored under a compound "SeasonA, SeasonB" string, which a
    // plain .eq() would never match. Filtering happens client-side instead.
    const { data, error: evalErr } = await db
      .from("player_evaluations")
      .select("*")
      .eq("club_id", clubId);
    if (evalErr) { setErrorMsg(evalErr.message); setLoading(false); return; }
    const forThisSeason = (data || [])
      .filter(e => evaluationCoversSeason(e.season_name, seasonName))
      .sort((a, b) => a.player_name.localeCompare(b.player_name));
    setEvaluations(forThisSeason);
    setLoading(false);
  }, [clubId, seasonName]);

  useEffect(() => { loadForSeason(); }, [loadForSeason]);

  // Whenever the season or player changes, load that player's existing
  // evaluation for the season if one exists, else start from computed
  // attendance defaults + a blank form.
  useEffect(() => {
    if (!seasonName || !playerName) return;
    (async () => {
      const existing = evaluations.find(e => e.player_name === playerName);
      if (existing) {
        setForm({
          // Preserve the row's real (possibly compound, e.g. "Grading
          // Winter 2026, Winter 2026") season_name so Save updates this
          // exact row instead of splitting it into a new single-season one.
          evalSeasonKey: existing.season_name,
          evaluationDate: existing.evaluation_date || new Date().toISOString().slice(0, 10),
          ageGroup: existing.age_group || "",
          ballSkills: existing.ball_skills == null ? 3 : existing.ball_skills,
          attacking: existing.attacking == null ? 3 : existing.attacking,
          defense: existing.defense == null ? 3 : existing.defense,
          perception: existing.perception == null ? 3 : existing.perception,
          footwork: existing.footwork == null ? 3 : existing.footwork,
          skillLevel: existing.skill_level || "Medium",
          mainPositions: existing.main_positions ? existing.main_positions.split(",").map(s => s.trim()).filter(Boolean) : [],
          nextSeason: existing.next_season || "Stay",
          comments: existing.comments || "",
          trainingAttendance: existing.training_attendance || 0,
          trainingTotal: existing.training_total || 0,
          gameAttendance: existing.game_attendance || 0,
          gameTotal: existing.game_total || 0,
        });
        return;
      }
      // No saved evaluation yet for this player/season — compute sensible
      // attendance defaults from real data (same convention as Stats /
      // Player Report) rather than leaving them at zero.
      const activeSeason = seasons.find(s => s.name === seasonName);
      const [gamesRes, sessionsRes] = await Promise.all([
        db.from("games").select("*").eq("club_id", clubId).eq("season_name", seasonName).eq("is_completed", true).eq("is_bye", false),
        db.from("training_sessions").select("*").eq("club_id", clubId).eq("season", seasonName),
      ]);
      const games = gamesRes.data || [];
      const sessions = (sessionsRes.data || []).filter(s => !s.is_cancelled);
      const gameTotal = games.filter(g => (g.players_snapshot || []).some(p => p.name === playerName)).length;
      const gameAttendance = games.filter(g =>
        (g.players_snapshot || []).some(p => p.name === playerName) &&
        (g.player_availability || {})[playerName] !== false
      ).length;
      const trainingTotal = sessions.length;
      const trainingAttendance = sessions.filter(s => (s.attendance || {})[playerName] === true).length;
      setForm({
        ...blankForm(seasonName),
        ageGroup: (activeSeason && activeSeason.team_name) || "",
        trainingAttendance, trainingTotal, gameAttendance, gameTotal,
      });
    })();
  }, [seasonName, playerName, evaluations]);

  function updateField(key, value) {
    setForm(prev => ({ ...prev, [key]: value }));
  }
  function toggleMainPosition(code) {
    setForm(prev => ({
      ...prev,
      mainPositions: prev.mainPositions.includes(code)
        ? prev.mainPositions.filter(c => c !== code)
        : [...prev.mainPositions, code],
    }));
  }

  async function handleSave() {
    if (!seasonName || !playerName) return;
    setSaving(true);
    setErrorMsg(""); setInfoMsg("");
    // Uses form.evalSeasonKey, not the plain selected seasonName — for an
    // existing evaluation that already covers this season under a compound
    // name (e.g. "Grading Winter 2026, Winter 2026"), this keeps updating
    // that same row instead of forking off a new single-season duplicate.
    const seasonKeyToSave = form.evalSeasonKey || seasonName;
    const { error: saveErr } = await db.from("player_evaluations").upsert({
      club_id: clubId,
      season_name: seasonKeyToSave,
      player_name: playerName,
      evaluation_date: form.evaluationDate,
      age_group: form.ageGroup,
      coach_name: coachName || "",
      ball_skills: Number(form.ballSkills),
      attacking: Number(form.attacking),
      defense: Number(form.defense),
      perception: Number(form.perception),
      footwork: Number(form.footwork),
      skill_level: form.skillLevel,
      main_positions: form.mainPositions.join(", "),
      next_season: form.nextSeason,
      comments: form.comments,
      training_attendance: Number(form.trainingAttendance) || 0,
      training_total: Number(form.trainingTotal) || 0,
      game_attendance: Number(form.gameAttendance) || 0,
      game_total: Number(form.gameTotal) || 0,
    }, { onConflict: "club_id,season_name,player_name" });
    setSaving(false);
    if (saveErr) { setErrorMsg(saveErr.message); return; }
    setInfoMsg(
      "Saved evaluation for " + playerName + "." +
      (seasonKeyToSave !== seasonName ? " (This evaluation also covers: " + seasonKeyToSave + ")" : "")
    );
    await loadForSeason();
  }

  async function handleDelete(evaluation) {
    if (!window.confirm("Delete the evaluation for " + evaluation.player_name + " (" + evaluation.season_name + ")? This can't be undone.")) return;
    setDeletingId(evaluation.id);
    setErrorMsg(""); setInfoMsg("");
    const { error: delErr } = await db.from("player_evaluations").delete().eq("id", evaluation.id).eq("club_id", clubId);
    setDeletingId(null);
    if (delErr) { setErrorMsg(delErr.message); return; }
    setInfoMsg("Deleted evaluation for " + evaluation.player_name + ".");
    if (evaluation.player_name === playerName) setForm(blankForm(seasonName));
    await loadForSeason();
  }

  const ratingRow = (label, key) => (
    <div className="session-field" key={key}>
      <label>{label} (1-5)</label>
      <input type="range" min="1" max="5" step="1" value={form[key]} onChange={e => updateField(key, e.target.value)} />
      <span style={{ marginLeft: 8, fontWeight: 700 }}>{form[key]}</span>
    </div>
  );

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={onBack}>&larr; Back to Home</a>
        <h1 className="page-title">Player Evaluations</h1>
      </div>

      {seasons.length > 0 && players.length > 0 && (
        <div className="season-select-row" style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <select className="season-select" value={seasonName} onChange={e => setSeasonName(e.target.value)}>
            {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
          </select>
          <select className="season-select" value={playerName} onChange={e => setPlayerName(e.target.value)}>
            {players.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
          </select>
        </div>
      )}

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}
      {infoMsg && <div className="banner info" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{infoMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : seasons.length === 0 ? (
        <div className="empty-note">No seasons set up yet — add one under "Load Teams &amp; Players".</div>
      ) : players.length === 0 ? (
        <div className="empty-note">No players on the club roster yet.</div>
      ) : (
        <React.Fragment>
          <div className="session-form" style={{ maxWidth: 560 }}>
            <div className="session-field">
              <label>Evaluation Date</label>
              <input type="date" value={form.evaluationDate} onChange={e => updateField("evaluationDate", e.target.value)} />
            </div>
            <div className="session-field">
              <label>Age Group / Team</label>
              <input type="text" value={form.ageGroup} onChange={e => updateField("ageGroup", e.target.value)} placeholder="e.g. U15 Violets" />
            </div>

            {ratingRow("Ball Skills", "ballSkills")}
            {ratingRow("Attacking", "attacking")}
            {ratingRow("Defense", "defense")}
            {ratingRow("Perception", "perception")}
            {ratingRow("Footwork", "footwork")}

            <div className="session-field">
              <label>Skill Level</label>
              <select value={form.skillLevel} onChange={e => updateField("skillLevel", e.target.value)}>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
              </select>
            </div>

            <div className="session-field">
              <label>Main Position(s)</label>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {COURT_CODES.map(code => (
                  <label key={code} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 13 }}>
                    <input type="checkbox" checked={form.mainPositions.includes(code)} onChange={() => toggleMainPosition(code)} />
                    {code}
                  </label>
                ))}
              </div>
            </div>

            <div className="session-field">
              <label>Next Season</label>
              <select value={form.nextSeason} onChange={e => updateField("nextSeason", e.target.value)}>
                <option value="Stay">Stay</option>
                <option value="Move Up">Move Up</option>
                <option value="Leave">Leave</option>
              </select>
            </div>

            <div className="session-summary-row" style={{ margin: "8px 0 0 0", padding: 0 }}>
              <div className="quick-stat">
                <label>Training Attendance</label>
                <input type="number" min="0" style={{ width: 60 }} value={form.trainingAttendance} onChange={e => updateField("trainingAttendance", e.target.value)} />
                {" / "}
                <input type="number" min="0" style={{ width: 60 }} value={form.trainingTotal} onChange={e => updateField("trainingTotal", e.target.value)} />
              </div>
              <div className="quick-stat">
                <label>Game Attendance</label>
                <input type="number" min="0" style={{ width: 60 }} value={form.gameAttendance} onChange={e => updateField("gameAttendance", e.target.value)} />
                {" / "}
                <input type="number" min="0" style={{ width: 60 }} value={form.gameTotal} onChange={e => updateField("gameTotal", e.target.value)} />
              </div>
            </div>
            <div className="muted-hint" style={{ marginBottom: 8 }}>Attendance figures are pre-filled from actual records — adjust if needed before saving.</div>

            <div className="session-field">
              <label>Comments</label>
              <textarea rows={4} value={form.comments} onChange={e => updateField("comments", e.target.value)} />
            </div>

            <button className="primary" style={{ marginTop: 10, width: "auto" }} disabled={saving} onClick={handleSave}>
              {saving ? "Saving…" : "Save Evaluation"}
            </button>
          </div>

          {evaluations.length > 0 && (
            <div className="session-form" style={{ maxWidth: 700, marginTop: 10 }}>
              <div className="muted-hint" style={{ marginBottom: 6 }}>Evaluations covering {seasonName} ({evaluations.length}):</div>
              {evaluations.map(ev => (
                <div key={ev.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13.5, padding: "5px 0", borderBottom: "1px solid var(--border)" }}>
                  <span>
                    {ev.player_name} — {ev.skill_level}
                    {ev.season_name !== seasonName && (
                      <span className="muted-hint" style={{ marginLeft: 6 }}>(recorded under: {ev.season_name})</span>
                    )}
                  </span>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button className="secondary" style={{ marginTop: 0, width: "auto", padding: "3px 10px", fontSize: 12 }} onClick={() => setPlayerName(ev.player_name)}>
                      View / Edit
                    </button>
                    <button
                      className="secondary"
                      style={{ marginTop: 0, width: "auto", padding: "3px 10px", fontSize: 12 }}
                      disabled={deletingId === ev.id}
                      onClick={() => handleDelete(ev)}
                    >
                      {deletingId === ev.id ? "Deleting…" : "Delete"}
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

function HomeScreen({ profile, onLogout, onNavigate, onQuickTraining }) {
  const isAdmin = profile.role === "admin";
  const isTeamManager = profile.role === "team_manager";

  // Mirrors the Android app's role gating (see Permission levels / roles
  // section of the project knowledge doc): team_manager gets Game Day +
  // Training + history views only; Reports/Stats/Registration/Evaluations
  // and Club Settings/Manage Coaches stay hidden. Reports & Admin sections
  // remain "Coming soon" placeholders pending later phases.

  const [seasons, setSeasons] = useState([]);
  const [seasonName, setSeasonName] = useState("");
  const [games, setGames] = useState([]);
  const [loadingHome, setLoadingHome] = useState(true);

  useEffect(() => {
    (async () => {
      const { data, error: seasonsErr } = await db
        .from("seasons")
        .select("*")
        .eq("club_id", profile.clubId)
        .order("name", { ascending: true });
      if (seasonsErr) { setLoadingHome(false); return; }
      setSeasons(data || []);
      if (data && data.length > 0) setSeasonName(data[0].name);
      else setLoadingHome(false);
    })();
  }, [profile.clubId]);

  useEffect(() => {
    if (!seasonName) return;
    (async () => {
      setLoadingHome(true);
      const { data, error: gamesErr } = await db
        .from("games")
        .select("*")
        .eq("club_id", profile.clubId)
        .eq("season_name", seasonName);
      if (!gamesErr) setGames(data || []);
      setLoadingHome(false);
    })();
  }, [profile.clubId, seasonName]);

  const activeSeason = seasons.find(s => s.name === seasonName);
  const completedGames = games.filter(g => g.is_completed && !g.is_bye);
  const wins = completedGames.filter(g => g.our_score > g.opponent_score).length;
  const losses = completedGames.filter(g => g.our_score < g.opponent_score).length;
  const draws = completedGames.filter(g => g.our_score === g.opponent_score).length;
  const nextGame = games
    .filter(g => !g.is_completed && !g.is_bye)
    .sort((a, b) => (a.round || 0) - (b.round || 0))[0];
  const nextGameUnavailable = nextGame
    ? Object.entries(nextGame.player_availability || {}).filter(([, v]) => v === false).map(([name]) => name).sort()
    : [];

  return (
    <div>
      <div className="topbar">
        <div className="who">
          <span className="club-name">{profile.clubName || "Your Club"}</span>
          <span className="me">
            {profile.displayName || profile.email}
            <span className="role-badge">{profile.role}</span>
          </span>
        </div>
        <button className="logout" onClick={onLogout}>Log Out</button>
      </div>

      {!loadingHome && seasons.length > 0 && (
        <div style={{ display: "flex", gap: 12, maxWidth: 900, margin: "16px auto 0 auto", padding: "0 20px", flexWrap: "wrap" }}>
          <div className="game-card" style={{ flex: 1, minWidth: 220 }}>
            <div className="meta-line" style={{ marginBottom: 4 }}>ACTIVE SEASON</div>
            {seasons.length > 1 ? (
              <select className="season-select" style={{ width: "100%" }} value={seasonName} onChange={e => setSeasonName(e.target.value)}>
                {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
              </select>
            ) : (
              <div className="round-line">{seasonName}</div>
            )}
            {activeSeason && activeSeason.team_name && <div className="meta-line" style={{ marginTop: 4 }}>{activeSeason.team_name}</div>}
          </div>
          <div className="game-card" style={{ flex: 1, minWidth: 220 }}>
            <div className="meta-line" style={{ marginBottom: 4 }}>SEASON RECORD</div>
            {completedGames.length === 0 ? (
              <div className="round-line">No games yet</div>
            ) : (
              <div style={{ display: "flex", gap: 16 }}>
                <span><strong>{wins}</strong> W</span>
                <span><strong>{losses}</strong> L</span>
                <span><strong>{draws}</strong> D</span>
              </div>
            )}
          </div>
        </div>
      )}

      {!loadingHome && nextGame && (
        <div className="game-card" style={{ maxWidth: 900, margin: "12px auto 0 auto" }}>
          <div>
            <div className="meta-line" style={{ marginBottom: 2 }}>NEXT GAME</div>
            <div className="round-line">Round {nextGame.round} vs {nextGame.opponent}</div>
            <div className="meta-line">
              {nextGame.game_date}
              {nextGame.game_time ? " · " + nextGame.game_time : ""}
              {nextGame.court ? " · Court " + nextGame.court : ""}
            </div>
            {nextGameUnavailable.length > 0 && (
              <div className="unavailable-line">Unavailable: {nextGameUnavailable.join(", ")}</div>
            )}
          </div>
        </div>
      )}

      <div className="section-label">Game Day</div>
      <div className="nav-grid">
        <NavTile label="Game Day" enabled={true} onClick={() => onNavigate("planned-games")} />
        <NavTile label="Upcoming Games" enabled={true} onClick={() => onNavigate("planned-games")} />
        <NavTile label="Game History" enabled={true} onClick={() => onNavigate("game-history")} />
      </div>

      <div className="section-label">Training</div>
      <div className="nav-grid">
        <NavTile label="Training Attendance" enabled={!isTeamManager} onClick={onQuickTraining} />
        <NavTile label="Training History" enabled={true} onClick={() => onNavigate("training-history")} />
      </div>

      {!isTeamManager && (
        <React.Fragment>
          <div className="section-label">Reports &amp; Admin</div>
          <div className="nav-grid">
            <NavTile label="Registration" enabled={true} onClick={() => onNavigate("registration")} />
            <NavTile label="Stats" enabled={true} onClick={() => onNavigate("stats")} />
            <NavTile label="Reports" enabled={true} onClick={() => onNavigate("reports")} />
            <NavTile label="Player Evaluations" enabled={true} onClick={() => onNavigate("player-evaluations")} />
          </div>
        </React.Fragment>
      )}

      {isAdmin && (
        <React.Fragment>
          <div className="section-label">Club Admin</div>
          <div className="nav-grid">
            <NavTile label="Club Settings" enabled={true} onClick={() => onNavigate("club-settings")} />
            <NavTile label="Manage Coaches" enabled={true} onClick={() => onNavigate("manage-coaches")} />
            <NavTile label="Load Teams &amp; Players" enabled={true} onClick={() => onNavigate("load-teams-players")} />
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("loading");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [profile, setProfile] = useState(null);
  const [gameDayId, setGameDayId] = useState(null);
  const [gameDayReturnTo, setGameDayReturnTo] = useState("planned-games");
  const [trainingSessionId, setTrainingSessionId] = useState(null);
  const [trainingReturnTo, setTrainingReturnTo] = useState("training-history");

  const clearMessages = () => { setError(""); setInfo(""); };

  const loadCoachProfile = useCallback(async (user) => {
    const { data, error: fetchErr } = await db
      .from("coaches")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();

    if (fetchErr || !data) {
      await db.auth.signOut();
      setError("Could not find your coach profile. Please contact your club admin.");
      setScreen("login");
      return;
    }

    setProfile({
      id: user.id,
      email: user.email,
      displayName: data.display_name,
      clubId: data.club_id,
      clubName: data.club_name,
      role: data.role || "coach",
    });
    setScreen("home");
  }, []);

  useEffect(() => {
    const { data: authListener } = db.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        clearMessages();
        setScreen("reset");
      }
    });

    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session && session.user) {
        await loadCoachProfile(session.user);
      } else {
        setScreen("login");
      }
    })();

    return () => {
      authListener && authListener.subscription && authListener.subscription.unsubscribe();
    };
  }, [loadCoachProfile]);

  async function handleLogin(email, password) {
    clearMessages(); setBusy(true);
    const { data, error: loginErr } = await db.auth.signInWithPassword({ email, password });
    if (loginErr) { setError(loginErr.message); setBusy(false); return; }
    await loadCoachProfile(data.user);
    setBusy(false);
  }

  async function handleJoin(email, password, displayName, clubCodeRaw) {
    clearMessages(); setBusy(true);
    try {
      const code = clubCodeRaw.toUpperCase();
      const { data: club, error: clubErr } = await db.from("clubs").select("*").eq("code", code).maybeSingle();
      if (clubErr || !club) {
        setError("Club code not found. Double-check it with your club admin.");
        setBusy(false);
        return;
      }

      // Same pattern as the Android app's JOIN_CLUB flow: try signing in
      // first in case the account already exists, only sign up if that fails.
      let user = null;
      const signInRes = await db.auth.signInWithPassword({ email, password });
      if (signInRes.error) {
        const signUpRes = await db.auth.signUp({ email, password });
        if (signUpRes.error) { setError(signUpRes.error.message); setBusy(false); return; }
        user = signUpRes.data.user;
      } else {
        user = signInRes.data.user;
      }
      if (!user) {
        setError("Could not create your account. Please try again.");
        setBusy(false);
        return;
      }

      // Role is always sent as "coach" here — self-service joining never
      // grants admin or team_manager. An admin promotes/demotes afterwards
      // via Manage Coaches.
      const { error: upsertErr } = await db.from("coaches").upsert({
        id: user.id,
        email,
        display_name: displayName,
        club_name: club.name,
        club_id: club.id,
        role: "coach",
      });
      if (upsertErr) {
        setError("Joined but could not save your profile: " + upsertErr.message);
        setBusy(false);
        return;
      }
      await loadCoachProfile(user);
    } catch (e) {
      setError(String(e));
    }
    setBusy(false);
  }

  async function handleCreate(email, password, displayName, clubName) {
    clearMessages(); setBusy(true);
    try {
      const signUpRes = await db.auth.signUp({ email, password });
      if (signUpRes.error) { setError(signUpRes.error.message); setBusy(false); return; }
      const user = signUpRes.data.user;
      if (!user) {
        setError("Account created, but could not finish setup automatically. Please try logging in.");
        setBusy(false);
        return;
      }

      const code = generateClubCode();
      const { data: club, error: clubErr } = await db.from("clubs").insert({
        name: clubName, code, created_by: user.id,
      }).select().single();
      if (clubErr) {
        setError("Could not create club: " + clubErr.message);
        setBusy(false);
        return;
      }

      const { error: coachErr } = await db.from("coaches").upsert({
        id: user.id,
        email,
        display_name: displayName,
        club_name: club.name,
        club_id: club.id,
        role: "admin",
      });
      if (coachErr) {
        setError("Club created but could not save your profile: " + coachErr.message);
        setBusy(false);
        return;
      }

      setInfo(`Club created! Your club code is ${code} — share this with your other coaches so they can join.`);
      await loadCoachProfile(user);
    } catch (e) {
      setError(String(e));
    }
    setBusy(false);
  }

  async function handleForgot(email) {
    clearMessages(); setBusy(true);
    const redirectTo = window.location.origin + window.location.pathname;
    const { error: forgotErr } = await db.auth.resetPasswordForEmail(email, { redirectTo });
    if (forgotErr) setError(forgotErr.message);
    else setInfo("Check your email for a password reset link.");
    setBusy(false);
  }

  async function handleSetNewPassword(newPassword) {
    clearMessages(); setBusy(true);
    const { error: updateErr } = await db.auth.updateUser({ password: newPassword });
    if (updateErr) { setError(updateErr.message); setBusy(false); return; }
    await db.auth.signOut();
    setInfo("Password updated — you can now log in.");
    setScreen("login");
    setBusy(false);
  }

  async function handleLogout() {
    await db.auth.signOut();
    setProfile(null);
    clearMessages();
    setScreen("login");
  }

  function goTo(next) {
    clearMessages();
    setScreen(next);
  }

  function openTrainingSession(id, returnTo) {
    clearMessages();
    setTrainingSessionId(id);
    setTrainingReturnTo(returnTo);
    setScreen("training-session");
  }

  if (screen === "loading") {
    return <div className="center-screen"><span className="spinner-text">Loading…</span></div>;
  }
  if (screen === "login") {
    return <LoginScreen onLogin={handleLogin} onGoJoin={() => goTo("join")} onGoCreate={() => goTo("create")} onGoForgot={() => goTo("forgot")} busy={busy} error={error} info={info} />;
  }
  if (screen === "join") {
    return <JoinScreen onJoin={handleJoin} onBack={() => goTo("login")} busy={busy} error={error} info={info} />;
  }
  if (screen === "create") {
    return <CreateScreen onCreate={handleCreate} onBack={() => goTo("login")} busy={busy} error={error} info={info} />;
  }
  if (screen === "forgot") {
    return <ForgotScreen onSend={handleForgot} onBack={() => goTo("login")} busy={busy} error={error} info={info} />;
  }
  if (screen === "reset") {
    return <ResetScreen onSetNew={handleSetNewPassword} busy={busy} error={error} info={info} />;
  }
  if (screen === "home" && profile) {
    return (
      <HomeScreen
        profile={profile}
        onLogout={handleLogout}
        onNavigate={goTo}
        onQuickTraining={() => openTrainingSession(null, "home")}
      />
    );
  }
  if (screen === "planned-games" && profile) {
    return (
      <PlannedGamesScreen
        clubId={profile.clubId}
        role={profile.role}
        onBack={() => goTo("home")}
        onOpenGameDay={g => { setGameDayId(g.id); setGameDayReturnTo("planned-games"); goTo("game-day"); }}
        onCreateGame={() => goTo("create-game")}
      />
    );
  }
  if (screen === "game-history" && profile) {
    return (
      <GameHistoryScreen
        clubId={profile.clubId}
        role={profile.role}
        onBack={() => goTo("home")}
        onOpenGameDay={g => { setGameDayId(g.id); setGameDayReturnTo("game-history"); goTo("game-day"); }}
      />
    );
  }
  if (screen === "create-game" && profile) {
    if (profile.role === "team_manager") {
      // Router-level backstop, matching the Android app's pattern — team
      // managers can't reach this via the UI anyway (button is hidden and
      // the games INSERT policy blocks them at the RLS level too), but this
      // covers it if that ever changes.
      return (
        <HomeScreen
          profile={profile}
          onLogout={handleLogout}
          onNavigate={goTo}
          onQuickTraining={() => openTrainingSession(null, "home")}
        />
      );
    }
    return (
      <CreateGameScreen
        clubId={profile.clubId}
        onBack={() => goTo("planned-games")}
        onCreated={() => goTo("planned-games")}
      />
    );
  }
  if (screen === "game-day" && profile) {
    return (
      <GameDayScreen
        gameId={gameDayId}
        clubId={profile.clubId}
        coachId={profile.id}
        role={profile.role}
        backLabel={gameDayReturnTo === "game-history" ? "Game History" : "Upcoming Games"}
        onBack={() => goTo(gameDayReturnTo)}
      />
    );
  }
  if (screen === "training-history" && profile) {
    return (
      <TrainingHistoryScreen
        clubId={profile.clubId}
        role={profile.role}
        onBack={() => goTo("home")}
        onNewSession={() => openTrainingSession(null, "training-history")}
        onOpenSession={s => openTrainingSession(s.id, "training-history")}
      />
    );
  }
  if (screen === "training-session" && profile) {
    return (
      <TrainingSessionScreen
        sessionId={trainingSessionId}
        clubId={profile.clubId}
        role={profile.role}
        backLabel={trainingReturnTo === "home" ? "Home" : "Training History"}
        onBack={() => goTo(trainingReturnTo)}
      />
    );
  }
  if (screen === "registration" && profile) {
    if (profile.role === "team_manager") {
      return <HomeScreen profile={profile} onLogout={handleLogout} onNavigate={goTo} onQuickTraining={() => openTrainingSession(null, "home")} />;
    }
    return <RegistrationScreen clubId={profile.clubId} onBack={() => goTo("home")} />;
  }
  if (screen === "stats" && profile) {
    if (profile.role === "team_manager") {
      return <HomeScreen profile={profile} onLogout={handleLogout} onNavigate={goTo} onQuickTraining={() => openTrainingSession(null, "home")} />;
    }
    return <StatsScreen clubId={profile.clubId} onBack={() => goTo("home")} />;
  }
  if (screen === "reports" && profile) {
    if (profile.role === "team_manager") {
      return <HomeScreen profile={profile} onLogout={handleLogout} onNavigate={goTo} onQuickTraining={() => openTrainingSession(null, "home")} />;
    }
    return <ReportsScreen clubId={profile.clubId} clubName={profile.clubName} onBack={() => goTo("home")} />;
  }
  if (screen === "manage-coaches" && profile) {
    if (profile.role !== "admin") {
      return <HomeScreen profile={profile} onLogout={handleLogout} onNavigate={goTo} onQuickTraining={() => openTrainingSession(null, "home")} />;
    }
    return <ManageCoachesScreen clubId={profile.clubId} myCoachId={profile.id} onBack={() => goTo("home")} />;
  }
  if (screen === "load-teams-players" && profile) {
    if (profile.role !== "admin") {
      return <HomeScreen profile={profile} onLogout={handleLogout} onNavigate={goTo} onQuickTraining={() => openTrainingSession(null, "home")} />;
    }
    return <LoadTeamsPlayersScreen clubId={profile.clubId} onBack={() => goTo("home")} />;
  }
  if (screen === "club-settings" && profile) {
    if (profile.role !== "admin") {
      return <HomeScreen profile={profile} onLogout={handleLogout} onNavigate={goTo} onQuickTraining={() => openTrainingSession(null, "home")} />;
    }
    return (
      <ClubSettingsScreen
        clubId={profile.clubId}
        onBack={() => goTo("home")}
        onSaved={({ clubName }) => setProfile(prev => prev ? { ...prev, clubName } : prev)}
      />
    );
  }
  if (screen === "player-evaluations" && profile) {
    if (profile.role === "team_manager") {
      return <HomeScreen profile={profile} onLogout={handleLogout} onNavigate={goTo} onQuickTraining={() => openTrainingSession(null, "home")} />;
    }
    return <PlayerEvaluationsScreen clubId={profile.clubId} coachName={profile.displayName || profile.email} onBack={() => goTo("home")} />;
  }
  return <div className="center-screen"><span className="spinner-text">Loading…</span></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  // The app source above is deliberately type="text/plain" (inert) rather than
  // type="text/babel", so we can control Babel's options explicitly here.
  // IMPORTANT: @babel/standalone's default JSX runtime is "automatic", which
  // compiles JSX into `import { jsx } from "react/jsx-runtime"` — a real ES
  // module import. That's meant for bundlers; loaded as a plain page (React
  // brought in as a global via a CDN <script>, not a module), it throws
  // "Cannot use import statement outside a module" and the whole app fails
  // silently (blank page). Forcing the "classic" runtime compiles JSX into
  // plain React.createElement(...) calls against the global React instead,
  // which works correctly in this plain-script, no-bundler setup.
  const appSource = document.getElementById("app-source").textContent;
  const compiled = Babel.transform(appSource, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  const script = document.createElement("script");
  script.text = compiled;
  document.body.appendChild(script);
</script>
</body>
</html>
