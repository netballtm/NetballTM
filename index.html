function LoadTeamsPlayersScreen({ clubId, onBack }) {
  const [players, setPlayers] = useState([]);
  const [seasons, setSeasons] = useState([]);
  const [loading, setLoading] = useState(true);
  const [pasteText, setPasteText] = useState("");
  const [addingPlayers, setAddingPlayers] = useState(false);
  const [seasonName, setSeasonName] = useState("");
  const [teamName, setTeamName] = useState("");
  const [addingSeason, setAddingSeason] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [infoMsg, setInfoMsg] = useState("");
  const [deletingSeasonId, setDeletingSeasonId] = useState(null);
  const [deletingPlayerId, setDeletingPlayerId] = useState(null);

  const loadAll = useCallback(async () => {
    const [playersRes, seasonsRes] = await Promise.all([
      db.from("players").select("*").eq("club_id", clubId).order("name", { ascending: true }),
      db.from("seasons").select("*").eq("club_id", clubId).order("name", { ascending: true }),
    ]);
    if (playersRes.error) setErrorMsg(playersRes.error.message);
    else setPlayers(playersRes.data || []);
    if (seasonsRes.error) setErrorMsg(seasonsRes.error.message);
    else setSeasons(seasonsRes.data || []);
    setLoading(false);
  }, [clubId]);

  useEffect(() => { loadAll(); }, [loadAll]);

  async function handleAddPlayers() {
    const names = pasteText.split("\n").map(n => n.trim()).filter(n => n.length > 0);
    if (names.length === 0) return;
    setAddingPlayers(true);
    setErrorMsg(""); setInfoMsg("");

    const existingLower = new Set(players.map(p => p.name.toLowerCase()));
    const seenThisBatch = new Set();
    const toInsert = [];
    const skipped = [];
    names.forEach(name => {
      const lower = name.toLowerCase();
      if (existingLower.has(lower) || seenThisBatch.has(lower)) { skipped.push(name); return; }
      seenThisBatch.add(lower);
      toInsert.push({ name, club_id: clubId, is_default_fill_in: false });
    });

    if (toInsert.length === 0) {
      setInfoMsg("Nothing to add — every name pasted is already a player.");
      setAddingPlayers(false);
      return;
    }

    const { error: insertErr } = await db.from("players").insert(toInsert);
    setAddingPlayers(false);
    if (insertErr) { setErrorMsg(insertErr.message); return; }

    setInfoMsg(
      "Added " + toInsert.length + " player" + (toInsert.length === 1 ? "" : "s") + "." +
      (skipped.length ? " Skipped " + skipped.length + " already on the roster: " + skipped.join(", ") + "." : "")
    );
    setPasteText("");
    await loadAll();
  }

  async function handleAddSeason() {
    if (!seasonName.trim()) return;
    setAddingSeason(true);
    setErrorMsg(""); setInfoMsg("");
    const { error: insertErr } = await db.from("seasons").insert({
      name: seasonName.trim(),
      team_name: teamName.trim() || null,
      club_id: clubId,
    });
    setAddingSeason(false);
    if (insertErr) { setErrorMsg(insertErr.message); return; }
    setInfoMsg("Added season \"" + seasonName.trim() + "\".");
    setSeasonName(""); setTeamName("");
    await loadAll();
  }

  // Deleting a season is only allowed once nothing references it any more —
  // games/training/registrations are checked first rather than cascading,
  // so a season's history can never be silently wiped by one click. If the
  // season really does need to go, the linked games/sessions/registrations
  // have to be removed first (or, for games, via Delete Game on Game
  // History / Upcoming Games).
  async function handleDeleteSeason(season) {
    setErrorMsg(""); setInfoMsg("");
    const [gamesRes, trainingRes, regRes] = await Promise.all([
      db.from("games").select("id", { count: "exact", head: true }).eq("club_id", clubId).eq("season_name", season.name),
      db.from("training_sessions").select("id", { count: "exact", head: true }).eq("club_id", clubId).eq("season", season.name),
      db.from("registrations").select("id", { count: "exact", head: true }).eq("club_id", clubId).eq("season_id", season.id),
    ]);
    const checkErr = gamesRes.error || trainingRes.error || regRes.error;
    if (checkErr) { setErrorMsg(checkErr.message); return; }
    const gamesCount = gamesRes.count || 0;
    const trainingCount = trainingRes.count || 0;
    const regCount = regRes.count || 0;
    if (gamesCount > 0 || trainingCount > 0 || regCount > 0) {
      const parts = [];
      if (gamesCount > 0) parts.push(gamesCount + " game" + (gamesCount === 1 ? "" : "s"));
      if (trainingCount > 0) parts.push(trainingCount + " training session" + (trainingCount === 1 ? "" : "s"));
      if (regCount > 0) parts.push(regCount + " registration" + (regCount === 1 ? "" : "s"));
      setErrorMsg("Can't delete \"" + season.name + "\" — it still has " + parts.join(", ") + ". Remove those first (Delete Game on Game History, Delete Session on Training History) if this season really should go.");
      return;
    }
    if (!window.confirm("Delete season \"" + season.name + "\"? This can't be undone.")) return;
    setDeletingSeasonId(season.id);
    const { error: delErr } = await db.from("seasons").delete().eq("id", season.id).eq("club_id", clubId);
    setDeletingSeasonId(null);
    if (delErr) { setErrorMsg(delErr.message); return; }
    setInfoMsg("Deleted season \"" + season.name + "\".");
    await loadAll();
  }

  // Removing a player deletes their registrations, notes and evaluations
  // (nothing left dangling), but deliberately does NOT touch past games —
  // each completed game already stores its own players_snapshot/goals
  // independently, so historical results and stats stay exactly as they
  // were. This mirrors how the app already treats games as a permanent
  // record rather than a live join to the players table.
  async function handleDeletePlayer(player) {
    setErrorMsg(""); setInfoMsg("");
    if (!window.confirm("Remove " + player.name + " from the roster? Their registrations, notes and evaluations will be deleted. Past game results/goals already recorded for them are kept as-is.")) return;
    setDeletingPlayerId(player.id);
    const [regDel, notesDel, evalDel] = await Promise.all([
      db.from("registrations").delete().eq("club_id", clubId).eq("player_name", player.name),
      db.from("player_notes").delete().eq("club_id", clubId).eq("player_name", player.name),
      db.from("player_evaluations").delete().eq("club_id", clubId).eq("player_name", player.name),
    ]);
    const cleanupErr = regDel.error || notesDel.error || evalDel.error;
    if (cleanupErr) { setDeletingPlayerId(null); setErrorMsg(cleanupErr.message); return; }
    const { error: delErr } = await db.from("players").delete().eq("id", player.id).eq("club_id", clubId);
    setDeletingPlayerId(null);
    if (delErr) { setErrorMsg(delErr.message); return; }
    setInfoMsg("Removed " + player.name + " from the roster. Past game history is unaffected.");
    await loadAll();
  }

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={onBack}>&larr; Back to Home</a>
        <h1 className="page-title">Load Teams &amp; Players</h1>
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}
      {infoMsg && <div className="banner info" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{infoMsg}</div>}

      <div className="session-form" style={{ maxWidth: 560 }}>
        <div className="session-field">
          <label>Add Players</label>
          <textarea
            rows={8}
            placeholder={"Paste one player name per line, e.g.\nAddison Daly\nAlly Turner\nEllie Hatzis"}
            value={pasteText}
            onChange={e => setPasteText(e.target.value)}
          />
          <div className="muted-hint">
            Names already on the club's player list are skipped automatically — safe to paste the same list twice.
            {!loading && " Currently " + players.length + " player" + (players.length === 1 ? "" : "s") + " on the roster."}
          </div>
        </div>
        <div style={{ margin: "12px 0 28px 0" }}>
          <button className="primary" style={{ marginTop: 0, width: "auto" }} disabled={addingPlayers || !pasteText.trim()} onClick={handleAddPlayers}>
            {addingPlayers ? "Adding…" : "Add Players"}
          </button>
        </div>

        {!loading && players.length > 0 && (
          <div style={{ borderTop: "1px solid var(--border)", paddingTop: 20, marginBottom: 28 }}>
            <div className="muted-hint" style={{ marginBottom: 6 }}>Current players ({players.length}):</div>
            {players.map(p => (
              <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13.5, padding: "5px 0", borderBottom: "1px solid var(--border)" }}>
                <span>{p.name}</span>
                <button
                  className="secondary"
                  style={{ marginTop: 0, width: "auto", padding: "3px 10px", fontSize: 12 }}
                  disabled={deletingPlayerId === p.id}
                  onClick={() => handleDeletePlayer(p)}
                >
                  {deletingPlayerId === p.id ? "Removing…" : "Remove"}
                </button>
              </div>
            ))}
          </div>
        )}

        <div style={{ borderTop: "1px solid var(--border)", paddingTop: 20 }}>
          <div className="session-field">
            <label>Add a Season / Team</label>
            <input type="text" placeholder="Season name, e.g. Winter 2027" value={seasonName} onChange={e => setSeasonName(e.target.value)} />
          </div>
          <div className="session-field">
            <label>Team name (optional)</label>
            <input type="text" placeholder="e.g. U15 Violets" value={teamName} onChange={e => setTeamName(e.target.value)} />
          </div>
          <button className="primary" style={{ marginTop: 0, width: "auto" }} disabled={addingSeason || !seasonName.trim()} onClick={handleAddSeason}>
            {addingSeason ? "Adding…" : "Add Season"}
          </button>

          {!loading && seasons.length > 0 && (
            <div style={{ marginTop: 18 }}>
              <div className="muted-hint" style={{ marginBottom: 6 }}>Existing seasons:</div>
              {seasons.map(s => (
                <div key={s.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13.5, padding: "4px 0" }}>
                  <span>{s.name}{s.team_name ? " — " + s.team_name : ""}</span>
                  <button
                    className="secondary"
                    style={{ marginTop: 0, width: "auto", padding: "3px 10px", fontSize: 12 }}
                    disabled={deletingSeasonId === s.id}
                    onClick={() => handleDeleteSeason(s)}
                  >
                    {deletingSeasonId === s.id ? "Deleting…" : "Delete"}
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function RegistrationScreen({ clubId, onBack }) {
  const [seasons, setSeasons] = useState([]);
  const [seasonId, setSeasonId] = useState("");
  const [players, setPlayers] = useState([]);
  const [registeredNames, setRegisteredNames] = useState({});
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");

  useEffect(() => {
    (async () => {
      const [seasonsRes, playersRes] = await Promise.all([
        db.from("seasons").select("*").eq("club_id", clubId).order("name", { ascending: true }),
        db.from("players").select("*").eq("club_id", clubId).order("name", { ascending: true }),
      ]);
      if (seasonsRes.error) { setErrorMsg(seasonsRes.error.message); setLoading(false); return; }
      if (playersRes.error) { setErrorMsg(playersRes.error.message); setLoading(false); return; }
      setSeasons(seasonsRes.data || []);
      setPlayers(playersRes.data || []);
      if (seasonsRes.data && seasonsRes.data.length > 0) setSeasonId(seasonsRes.data[0].id);
      else setLoading(false);
    })();
  }, [clubId]);

  const loadRegistrations = useCallback(async () => {
    if (!seasonId) return;
    setLoading(true);
    setErrorMsg("");
    const { data, error: regErr } = await db
      .from("registrations")
      .select("player_name")
      .eq("club_id", clubId)
      .eq("season_id", seasonId);
    if (regErr) { setErrorMsg(regErr.message); setLoading(false); return; }
    const map = {};
    (data || []).forEach(r => { map[r.player_name] = true; });
    setRegisteredNames(map);
    setLoading(false);
  }, [clubId, seasonId]);

  useEffect(() => { loadRegistrations(); }, [loadRegistrations]);

  async function toggle(name) {
    if (saving) return;
    const isCurrentlyRegistered = !!registeredNames[name];
    setSaving(true);
    setErrorMsg("");
    if (isCurrentlyRegistered) {
      const { error: delErr } = await db.from("registrations")
        .delete()
        .eq("club_id", clubId)
        .eq("season_id", seasonId)
        .eq("player_name", name);
      setSaving(false);
      if (delErr) { setErrorMsg(delErr.message); return; }
      setRegisteredNames(prev => { const next = { ...prev }; delete next[name]; return next; });
    } else {
      // Deliberately does NOT write season_index — that legacy column is what
      // caused the original registrations ambiguity (see project notes) and
      // writing a guessed value into it here would just recreate the same
      // problem for new rows. If this insert fails because season_index turns
      // out to be a NOT NULL column with no default, the fix is a one-line
      // `ALTER TABLE registrations ALTER COLUMN season_index DROP NOT NULL;`
      // in the Supabase SQL Editor, not filling it in with a made-up value.
      const { error: insErr } = await db.from("registrations").insert({
        club_id: clubId,
        season_id: seasonId,
        player_name: name,
      });
      setSaving(false);
      if (insErr) { setErrorMsg(insErr.message); return; }
      setRegisteredNames(prev => ({ ...prev, [name]: true }));
    }
  }

  const activeSeason = seasons.find(s => s.id === seasonId);
  const registeredCount = Object.keys(registeredNames).length;

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={onBack}>&larr; Back to Home</a>
        <h1 className="page-title">Registration</h1>
      </div>

      {seasons.length > 1 && (
        <div className="season-select-row">
          <select className="season-select" value={seasonId} onChange={e => setSeasonId(e.target.value)}>
            {seasons.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </div>
      )}

      {!loading && activeSeason && (
        <div className="session-summary-row">
          <div className="quick-stat"><label>Registered</label>{registeredCount} / {players.length}</div>
          {activeSeason.team_name && <div className="quick-stat"><label>Team</label>{activeSeason.team_name}</div>}
        </div>
      )}

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : seasons.length === 0 ? (
        <div className="empty-note">No seasons set up yet — add one under "Load Teams &amp; Players".</div>
      ) : players.length === 0 ? (
        <div className="empty-note">No players on the club roster yet — add some under "Load Teams &amp; Players".</div>
      ) : (
        <div className="session-form" style={{ maxWidth: 560 }}>
          <RosterToggleList
            players={players.map(p => p.name)}
            selected={registeredNames}
            onToggle={toggle}
          />
        </div>
      )}
    </div>
  );
}

function StatsScreen({ clubId, onBack }) {
  const [seasons, setSeasons] = useState([]);
  const [seasonName, setSeasonName] = useState("");
  const [tab, setTab] = useState("games");
  const [games, setGames] = useState([]);
  const [players, setPlayers] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [errorMsg, setErrorMsg] = useState("");

  useEffect(() => {
    (async () => {
      const { data, error: seasonsErr } = await db.from("seasons").select("*").eq("club_id", clubId);
      if (seasonsErr) { setErrorMsg(seasonsErr.message); setLoading(false); return; }
      setSeasons(data || []);
      if (data && data.length > 0) setSeasonName(data[0].name);
      else setLoading(false);
    })();
  }, [clubId]);

  const loadStats = useCallback(async () => {
    if (!seasonName) return;
    setLoading(true);
    setErrorMsg("");
    const [gamesRes, playersRes, sessionsRes] = await Promise.all([
      db.from("games").select("*").eq("club_id", clubId).eq("season_name", seasonName).eq("is_completed", true),
      db.from("players").select("*").eq("club_id", clubId).order("name", { ascending: true }),
      db.from("training_sessions").select("*").eq("club_id", clubId).eq("season", seasonName),
    ]);
    const firstErr = gamesRes.error || playersRes.error || sessionsRes.error;
    if (firstErr) { setErrorMsg(firstErr.message); setLoading(false); return; }
    setGames(gamesRes.data || []);
    setPlayers(playersRes.data || []);
    setSessions(sessionsRes.data || []);
    setLoading(false);
  }, [clubId, seasonName]);

  useEffect(() => { loadStats(); }, [loadStats]);

  const playedGames = games.filter(g => !g.is_bye);
  const wins = playedGames.filter(g => g.our_score > g.opponent_score).length;
  const losses = playedGames.filter(g => g.our_score < g.opponent_score).length;
  const draws = playedGames.filter(g => g.our_score === g.opponent_score).length;
  const byes = games.length - playedGames.length;

  const goalsByPlayer = {};
  playedGames.forEach(g => {
    QUARTERS.forEach(q => {
      const qGoals = (g.goals_by_quarter && g.goals_by_quarter[q]) || {};
      Object.entries(qGoals).forEach(([name, val]) => {
        goalsByPlayer[name] = (goalsByPlayer[name] || 0) + (Number(val) || 0);
      });
    });
  });

  const gamesPlayedByPlayer = {};
  playedGames.forEach(g => {
    (g.players_snapshot || []).forEach(p => {
      if ((g.player_availability || {})[p.name] === false) return;
      gamesPlayedByPlayer[p.name] = (gamesPlayedByPlayer[p.name] || 0) + 1;
    });
  });

  const activeSessions = sessions.filter(s => !s.is_cancelled);
  const trainingByPlayer = {};
  activeSessions.forEach(s => {
    Object.entries(s.attendance || {}).forEach(([name, present]) => {
      if (!trainingByPlayer[name]) trainingByPlayer[name] = { attended: 0, total: 0 };
      trainingByPlayer[name].total += 1;
      if (present === true) trainingByPlayer[name].attended += 1;
    });
  });

  const topScorers = Object.entries(goalsByPlayer).sort((a, b) => b[1] - a[1]).slice(0, 5);

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={onBack}>&larr; Back to Home</a>
        <h1 className="page-title">Stats</h1>
      </div>

      {seasons.length > 1 && (
        <div className="season-select-row">
          <select className="season-select" value={seasonName} onChange={e => setSeasonName(e.target.value)}>
            {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
          </select>
        </div>
      )}

      <div className="quarter-tabs">
        <button className={"quarter-tab" + (tab === "games" ? " active" : "")} onClick={() => setTab("games")}>Games</button>
        <button className={"quarter-tab" + (tab === "players" ? " active" : "")} onClick={() => setTab("players")}>Players</button>
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : tab === "games" ? (
        games.length === 0 ? (
          <div className="empty-note">No completed games yet.</div>
        ) : (
          <React.Fragment>
            <div className="session-summary-row">
              <div className="quick-stat"><label>Wins</label>{wins}</div>
              <div className="quick-stat"><label>Losses</label>{losses}</div>
              <div className="quick-stat"><label>Draws</label>{draws}</div>
              {byes > 0 && <div className="quick-stat"><label>Byes</label>{byes}</div>}
            </div>
            <div className="game-list">
              {games.slice().sort((a, b) => a.round - b.round).map(g => {
                let resultLabel = "BYE", resultClass = "bye";
                if (!g.is_bye) {
                  if (g.our_score > g.opponent_score) { resultLabel = "W"; resultClass = "win"; }
                  else if (g.our_score < g.opponent_score) { resultLabel = "L"; resultClass = "loss"; }
                  else { resultLabel = "D"; resultClass = "draw"; }
                }
                return (
                  <div className="game-card" key={g.id}>
                    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                      <div className={"result-badge " + resultClass}>{resultLabel}</div>
                      <div>
                        <div className="round-line">Round {g.round}{g.is_bye ? " — BYE" : " vs " + g.opponent}</div>
                        {!g.is_bye && (
                          <div className="meta-line">{g.our_score} - {g.opponent_score}{g.game_date ? " · " + g.game_date : ""}</div>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </React.Fragment>
        )
      ) : players.length === 0 ? (
        <div className="empty-note">No players on the club roster yet.</div>
      ) : (
        <React.Fragment>
          {topScorers.length > 0 && (
            <div className="potm-section" style={{ maxWidth: 900 }}>
              <h3>Top Scorers</h3>
              {topScorers.map(([name, goals]) => (
                <div className="availability-row" key={name}><span>{name}</span><span>{goals}</span></div>
              ))}
            </div>
          )}
          <div className="game-list" style={{ maxWidth: 900 }}>
            {players.map(p => {
              const gp = gamesPlayedByPlayer[p.name] || 0;
              const goals = goalsByPlayer[p.name] || 0;
              const t = trainingByPlayer[p.name] || { attended: 0, total: 0 };
              const trainingPct = t.total > 0 ? Math.round((t.attended / t.total) * 100) : null;
              return (
                <div className="game-card" key={p.id}>
                  <div className="round-line">{p.name}</div>
                  <div style={{ display: "flex", gap: 16, fontSize: 13 }}>
                    <span>Games: {gp}</span>
                    <span>Goals: {goals}</span>
                    <span>Training: {trainingPct === null ? "—" : trainingPct + "%"}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function SeasonReportView({ clubId, clubName, seasons }) {
  const [seasonName, setSeasonName] = useState(seasons[0].name);
  const [games, setGames] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [errorMsg, setErrorMsg] = useState("");

  const load = useCallback(async () => {
    setLoading(true);
    setErrorMsg("");
    const [gamesRes, sessionsRes] = await Promise.all([
      db.from("games").select("*").eq("club_id", clubId).eq("season_name", seasonName).eq("is_completed", true),
      db.from("training_sessions").select("*").eq("club_id", clubId).eq("season", seasonName),
    ]);
    if (gamesRes.error) { setErrorMsg(gamesRes.error.message); setLoading(false); return; }
    if (sessionsRes.error) { setErrorMsg(sessionsRes.error.message); setLoading(false); return; }
    setGames(gamesRes.data || []);
    setSessions(sessionsRes.data || []);
    setLoading(false);
  }, [clubId, seasonName]);

  useEffect(() => { load(); }, [load]);

  const playedGames = games.filter(g => !g.is_bye);
  const byes = games.length - playedGames.length;
  const wins = playedGames.filter(g => g.our_score > g.opponent_score).length;
  const losses = playedGames.filter(g => g.our_score < g.opponent_score).length;
  const draws = playedGames.filter(g => g.our_score === g.opponent_score).length;
  const goalsFor = playedGames.reduce((sum, g) => sum + (Number(g.our_score) || 0), 0);
  const goalsAgainst = playedGames.reduce((sum, g) => sum + (Number(g.opponent_score) || 0), 0);
  const activeSessions = sessions.filter(s => !s.is_cancelled);
  const avgAttendance = (() => {
    const rates = activeSessions.map(s => {
      const entries = Object.entries(s.attendance || {});
      if (entries.length === 0) return null;
      return entries.filter(([, v]) => v === true).length / entries.length;
    }).filter(r => r !== null);
    if (rates.length === 0) return null;
    return Math.round((rates.reduce((a, b) => a + b, 0) / rates.length) * 100);
  })();

  const goalsByPlayer = {};
  const potmCountByPlayer = {};
  playedGames.forEach(g => {
    QUARTERS.forEach(q => {
      const qGoals = (g.goals_by_quarter && g.goals_by_quarter[q]) || {};
      Object.entries(qGoals).forEach(([name, val]) => {
        goalsByPlayer[name] = (goalsByPlayer[name] || 0) + (Number(val) || 0);
      });
    });
    (g.players_of_match || []).forEach(name => {
      potmCountByPlayer[name] = (potmCountByPlayer[name] || 0) + 1;
    });
  });
  const topScorers = Object.entries(goalsByPlayer).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const potmLeaders = Object.entries(potmCountByPlayer).sort((a, b) => b[1] - a[1]);

  return (
    <div>
      <div className="season-select-row" style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <select className="season-select" value={seasonName} onChange={e => setSeasonName(e.target.value)}>
          {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
        </select>
        <button className="secondary no-print" onClick={() => window.print()}>Print / Save as PDF</button>
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : (
        <div className="session-form" style={{ maxWidth: 700 }}>
          <h2 style={{ margin: "18px 0 4px 0" }}>{clubName} — Season Report</h2>
          <div className="muted-hint" style={{ marginBottom: 16 }}>{seasonName}</div>

          <div className="session-summary-row" style={{ margin: "0 0 20px 0", padding: 0 }}>
            <div className="quick-stat"><label>Wins</label>{wins}</div>
            <div className="quick-stat"><label>Losses</label>{losses}</div>
            <div className="quick-stat"><label>Draws</label>{draws}</div>
            {byes > 0 && <div className="quick-stat"><label>Byes</label>{byes}</div>}
            <div className="quick-stat"><label>Avg Training Attendance</label>{avgAttendance === null ? "—" : avgAttendance + "%"}</div>
          </div>
          <div className="session-summary-row" style={{ margin: "0 0 20px 0", padding: 0 }}>
            <div className="quick-stat"><label>Goals For</label>{goalsFor}</div>
            <div className="quick-stat"><label>Goals Against</label>{goalsAgainst}</div>
            <div className="quick-stat"><label>Margin</label>{goalsFor - goalsAgainst > 0 ? "+" : ""}{goalsFor - goalsAgainst}</div>
          </div>

          <h3 style={{ fontSize: 13, textTransform: "uppercase", letterSpacing: "0.03em", color: "var(--muted)" }}>Game Results</h3>
          {playedGames.length === 0 ? (
            <div style={{ fontSize: 13.5, color: "var(--muted)" }}>No completed games this season.</div>
          ) : (
            playedGames.slice().sort((a, b) => a.round - b.round).map(g => (
              <div key={g.id} className="availability-row">
                <span>Round {g.round} vs {g.opponent}{g.game_date ? " · " + g.game_date : ""}</span>
                <span>{g.our_score} - {g.opponent_score}</span>
              </div>
            ))
          )}

          {topScorers.length > 0 && (
            <React.Fragment>
              <h3 style={{ fontSize: 13, textTransform: "uppercase", letterSpacing: "0.03em", color: "var(--muted)", marginTop: 20 }}>Top Scorers</h3>
              {topScorers.map(([name, goals]) => (
                <div key={name} className="availability-row"><span>{name}</span><span>{goals}</span></div>
              ))}
            </React.Fragment>
          )}

          {potmLeaders.length > 0 && (
            <React.Fragment>
              <h3 style={{ fontSize: 13, textTransform: "uppercase", letterSpacing: "0.03em", color: "var(--muted)", marginTop: 20 }}>Player of the Match</h3>
              {potmLeaders.map(([name, count]) => (
                <div key={name} className="availability-row"><span>{name}</span><span>{count}&times;</span></div>
              ))}
            </React.Fragment>
          )}

          <h3 style={{ fontSize: 13, textTransform: "uppercase", letterSpacing: "0.03em", color: "var(--muted)", marginTop: 20 }}>Training</h3>
          <div style={{ fontSize: 13.5 }}>
            {sessions.length} session{sessions.length === 1 ? "" : "s"} recorded, {sessions.length - activeSessions.length} cancelled.
          </div>
        </div>
      )}
    </div>
  );
}

function GameReportView({ clubId, clubName, seasons }) {
  const [seasonName, setSeasonName] = useState(seasons[0].name);
  const [games, setGames] = useState([]);
  const [gameId, setGameId] = useState("");
  const [loading, setLoading] = useState(true);
  const [errorMsg, setErrorMsg] = useState("");
  const [potmPhotoUrls, setPotmPhotoUrls] = useState({});

  const load = useCallback(async () => {
    setLoading(true);
    setErrorMsg("");
    const { data, error: gamesErr } = await db
      .from("games")
      .select("*")
      .eq("club_id", clubId)
      .eq("season_name", seasonName)
      .eq("is_completed", true)
      .eq("is_bye", false)
      .order("round", { ascending: true });
    if (gamesErr) { setErrorMsg(gamesErr.message); setLoading(false); return; }
    const rows = data || [];
    setGames(rows);
    setGameId(rows.length > 0 ? rows[0].id : "");
    setLoading(false);
  }, [clubId, seasonName]);

  useEffect(() => { load(); }, [load]);

  const game = games.find(g => g.id === gameId);

  // Resolve any stored POTM photo paths to short-lived signed URLs whenever
  // the selected game changes — same convention GameDayScreen uses.
  useEffect(() => {
    let cancelled = false;
    setPotmPhotoUrls({});
    if (!game || !game.potm_photos) return;
    const entries = Object.entries(game.potm_photos);
    if (entries.length === 0) return;
    (async () => {
      const urls = {};
      await Promise.all(entries.map(async ([name, path]) => {
        const { data: signed } = await db.storage.from("potm-photos").createSignedUrl(path, 3600);
        if (signed && signed.signedUrl) urls[name] = signed.signedUrl;
      }));
      if (!cancelled) setPotmPhotoUrls(urls);
    })();
    return () => { cancelled = true; };
  }, [game && game.id]);

  return (
    <div>
      <div className="season-select-row" style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <select className="season-select" value={seasonName} onChange={e => setSeasonName(e.target.value)}>
          {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
        </select>
        {games.length > 0 && (
          <select className="season-select" value={gameId} onChange={e => setGameId(e.target.value)}>
            {games.map(g => <option key={g.id} value={g.id}>Round {g.round} vs {g.opponent}</option>)}
          </select>
        )}
        {game && <button className="secondary no-print" onClick={() => window.print()}>Print / Save as PDF</button>}
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : !game ? (
        <div className="empty-note">No completed games for this season yet.</div>
      ) : (
        <div className="session-form" style={{ maxWidth: 700 }}>
          <h2 style={{ margin: "18px 0 4px 0" }}>{clubName} — Game Report</h2>
          <div className="muted-hint" style={{ marginBottom: 16 }}>
            {seasonName} · Round {game.round} vs {game.opponent}{game.game_date ? " · " + game.game_date : ""}
          </div>

          <div className="session-summary-row" style={{ margin: "0 0 20px 0", padding: 0 }}>
            <div className="quick-stat"><label>Final Score</label>{game.our_score} - {game.opponent_score}</div>
          </div>

          <h3 style={{ fontSize: 13, textTransform: "uppercase", letterSpacing: "0.03em", color: "var(--muted)" }}>By Quarter</h3>
          {QUARTERS.map(q => {
            const qGoals = (game.goals_by_quarter && game.goals_by_quarter[q]) || {};
            const scorers = Object.entries(qGoals).filter(([, v]) => Number(v) > 0);
            const ourQ = scorers.reduce((sum, [, v]) => sum + Number(v), 0);
            const oppQ = (game.opponent_goals_by_quarter && game.opponent_goals_by_quarter[q]) || 0;
            const turnoversQ = (game.turnovers_by_quarter && game.turnovers_by_quarter[q]) || 0;
            const noteQ = (game.quarter_notes && game.quarter_notes[q]) || "";
            return (
              <div key={q} className="availability-row" style={{ display: "block", padding: "10px 0" }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 600 }}>
                  <span>Quarter {q}</span>
                  <span>{ourQ} - {oppQ}{turnoversQ ? " · Turnovers: " + turnoversQ : ""}</span>
                </div>
                {scorers.length > 0 && (
                  <div style={{ fontSize: 12.5, color: "var(--muted)", marginTop: 3 }}>
                    Goals: {scorers.map(([n, v]) => n + " (" + v + ")").join(", ")}
                  </div>
                )}
                {noteQ && <div style={{ fontSize: 12.5, color: "var(--muted)", marginTop: 3 }}>{noteQ}</div>}
              </div>
            );
          })}

          {(game.players_of_match || []).length > 0 && (
            <React.Fragment>
              <h3 style={{ fontSize: 13, textTransform: "uppercase", letterSpacing: "0.03em", color: "var(--muted)", marginTop: 20 }}>Player of the Match</h3>
              {(game.players_of_match || []).map(name => (
                <div key={name} style={{ fontSize: 13.5, padding: "8px 0" }}>
                  <strong>{name}</strong>
                  {(game.potm_comments || {})[name] ? " — " + game.potm_comments[name] : ""}
                  {potmPhotoUrls[name] && (
                    <img src={potmPhotoUrls[name]} alt={name + " photo"} className="potm-photo-preview" />
                  )}
                </div>
              ))}
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
}

function PlayerReportView({ clubId, clubName, seasons, players }) {
  const [seasonName, setSeasonName] = useState(seasons[0].name);
  const [playerName, setPlayerName] = useState(players.length > 0 ? players[0].name : "");
  const [games, setGames] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [errorMsg, setErrorMsg] = useState("");

  const load = useCallback(async () => {
    setLoading(true);
    setErrorMsg("");
    const [gamesRes, sessionsRes] = await Promise.all([
      db.from("games").select("*").eq("club_id", clubId).eq("season_name", seasonName).eq("is_completed", true),
      db.from("training_sessions").select("*").eq("club_id", clubId).eq("season", seasonName),
    ]);
    if (gamesRes.error) { setErrorMsg(gamesRes.error.message); setLoading(false); return; }
    if (sessionsRes.error) { setErrorMsg(sessionsRes.error.message); setLoading(false); return; }
    setGames(gamesRes.data || []);
    setSessions(sessionsRes.data || []);
    setLoading(false);
  }, [clubId, seasonName]);

  useEffect(() => { load(); }, [load]);

  if (players.length === 0) {
    return <div className="empty-note">No players on the club roster yet.</div>;
  }

  const playerGames = games.filter(g => !g.is_bye && (g.players_snapshot || []).some(p => p.name === playerName));
  const gamesGoals = playerGames.map(g => {
    let goals = 0;
    const byQuarter = {};
    QUARTERS.forEach(q => {
      const qGoals = Number(((g.goals_by_quarter && g.goals_by_quarter[q]) || {})[playerName]) || 0;
      byQuarter[q] = qGoals;
      goals += qGoals;
    });
    const wasAvailable = (g.player_availability || {})[playerName] !== false;
    const wasPotm = (g.players_of_match || []).includes(playerName);
    return { game: g, goals, byQuarter, wasAvailable, wasPotm };
  });
  const gamesPlayedCount = gamesGoals.filter(x => x.wasAvailable).length;
  const totalGoals = gamesGoals.reduce((sum, x) => sum + x.goals, 0);
  const potmCount = gamesGoals.filter(x => x.wasPotm).length;
  const bestGame = gamesGoals.reduce((best, x) => (!best || x.goals > best.goals) ? x : best, null);

  const activeSessions = sessions.filter(s => !s.is_cancelled);
  const attendedCount = activeSessions.filter(s => (s.attendance || {})[playerName] === true).length;
  const trainingPct = activeSessions.length > 0 ? Math.round((attendedCount / activeSessions.length) * 100) : null;

  return (
    <div>
      <div className="season-select-row" style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <select className="season-select" value={seasonName} onChange={e => setSeasonName(e.target.value)}>
          {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
        </select>
        <select className="season-select" value={playerName} onChange={e => setPlayerName(e.target.value)}>
          {players.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
        </select>
        <button className="secondary no-print" onClick={() => window.print()}>Print / Save as PDF</button>
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : (
        <div className="session-form" style={{ maxWidth: 700 }}>
          <h2 style={{ margin: "18px 0 4px 0" }}>{clubName} — Player Report</h2>
          <div className="muted-hint" style={{ marginBottom: 16 }}>{playerName} · {seasonName}</div>

          <div className="session-summary-row" style={{ margin: "0 0 20px 0", padding: 0 }}>
            <div className="quick-stat"><label>Games Played</label>{gamesPlayedCount}</div>
            <div className="quick-stat"><label>Goals</label>{totalGoals}</div>
            <div className="quick-stat"><label>Player of the Match</label>{potmCount}&times;</div>
            <div className="quick-stat"><label>Training Attendance</label>{trainingPct === null ? "—" : trainingPct + "%"}</div>
          </div>
          {bestGame && bestGame.goals > 0 && (
            <div className="muted-hint" style={{ marginBottom: 16 }}>
              Best game: {bestGame.goals} goals vs {bestGame.game.opponent} (Round {bestGame.game.round})
            </div>
          )}

          <h3 style={{ fontSize: 13, textTransform: "uppercase", letterSpacing: "0.03em", color: "var(--muted)" }}>Game Log</h3>
          {gamesGoals.length === 0 ? (
            <div style={{ fontSize: 13.5, color: "var(--muted)" }}>No games recorded for this player this season.</div>
          ) : (
            gamesGoals.slice().sort((a, b) => a.game.round - b.game.round).map(({ game, goals, byQuarter, wasAvailable, wasPotm }) => (
              <div key={game.id} className="availability-row" style={{ display: "block", padding: "10px 0" }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 600 }}>
                  <span>Round {game.round} vs {game.opponent}{!wasAvailable ? " (unavailable)" : ""}{wasPotm ? " ⭐" : ""}</span>
                  <span>{goals > 0 ? goals + " goals" : "—"}</span>
                </div>
                {goals > 0 && (
                  <div style={{ fontSize: 12.5, color: "var(--muted)", marginTop: 3 }}>
                    By quarter: {QUARTERS.map(q => "Q" + q + ": " + (byQuarter[q] || 0)).join("  ·  ")}
                  </div>
                )}
              </div>
            ))
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("loading");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [profile, setProfile] = useState(null);
  const [gameDayId, setGameDayId] = useState(null);
  const [gameDayReturnTo, setGameDayReturnTo] = useState("planned-games");
  const [trainingSessionId, setTrainingSessionId] = useState(null);
  const [trainingReturnTo, setTrainingReturnTo] = useState("training-history");

  const clearMessages = () => { setError(""); setInfo(""); };

  const loadCoachProfile = useCallback(async (user) => {
    const { data, error: fetchErr } = await db
      .from("coaches")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();

    if (fetchErr || !data) {
      await db.auth.signOut();
      setError("Could not find your coach profile. Please contact your club admin.");
      setScreen("login");
      return;
    }

    setProfile({
      id: user.id,
      email: user.email,
      displayName: data.display_name,
      clubId: data.club_id,
      clubName: data.club_name,
      role: data.role || "coach",
    });
    setScreen("home");
  }, []);

  useEffect(() => {
    const { data: authListener } = db.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        clearMessages();
        setScreen("reset");
      }
    });

    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session && session.user) {
        await loadCoachProfile(session.user);
      } else {
        setScreen("login");
      }
    })();

    return () => {
      authListener && authListener.subscription && authListener.subscription.unsubscribe();
    };
  }, [loadCoachProfile]);

  async function handleLogin(email, password) {
    clearMessages(); setBusy(true);
    const { data, error: loginErr } = await db.auth.signInWithPassword({ email, password });
    if (loginErr) { setError(loginErr.message); setBusy(false); return; }
    await loadCoachProfile(data.user);
    setBusy(false);
  }

  async function handleJoin(email, password, displayName, clubCodeRaw) {
    clearMessages(); setBusy(true);
    try {
      const code = clubCodeRaw.toUpperCase();
      const { data: club, error: clubErr } = await db.from("clubs").select("*").eq("code", code).maybeSingle();
      if (clubErr || !club) {
        setError("Club code not found. Double-check it with your club admin.");
        setBusy(false);
        return;
      }

      // Same pattern as the Android app's JOIN_CLUB flow: try signing in
      // first in case the account already exists, only sign up if that fails.
      let user = null;
      const signInRes = await db.auth.signInWithPassword({ email, password });
      if (signInRes.error) {
        const signUpRes = await db.auth.signUp({ email, password });
        if (signUpRes.error) { setError(signUpRes.error.message); setBusy(false); return; }
        user = signUpRes.data.user;
      } else {
        user = signInRes.data.user;
      }
      if (!user) {
        setError("Could not create your account. Please try again.");
        setBusy(false);
        return;
      }

      // Role is always sent as "coach" here — self-service joining never
      // grants admin or team_manager. An admin promotes/demotes afterwards
      // via Manage Coaches.
      const { error: upsertErr } = await db.from("coaches").upsert({
        id: user.id,
        email,
        display_name: displayName,
        club_name: club.name,
        club_id: club.id,
        role: "coach",
      });
      if (upsertErr) {
        setError("Joined but could not save your profile: " + upsertErr.message);
        setBusy(false);
        return;
      }
      await loadCoachProfile(user);
    } catch (e) {
      setError(String(e));
    }
    setBusy(false);
  }

  async function handleCreate(email, password, displayName, clubName) {
    clearMessages(); setBusy(true);
    try {
      const signUpRes = await db.auth.signUp({ email, password });
      if (signUpRes.error) { setError(signUpRes.error.message); setBusy(false); return; }
      const user = signUpRes.data.user;
      if (!user) {
        setError("Account created, but could not finish setup automatically. Please try logging in.");
        setBusy(false);
        return;
      }

      const code = generateClubCode();
      const { data: club, error: clubErr } = await db.from("clubs").insert({
        name: clubName, code, created_by: user.id,
      }).select().single();
      if (clubErr) {
        setError("Could not create club: " + clubErr.message);
        setBusy(false);
        return;
      }

      const { error: coachErr } = await db.from("coaches").upsert({
        id: user.id,
        email,
        display_name: displayName,
        club_name: club.name,
        club_id: club.id,
        role: "admin",
      });
      if (coachErr) {
        setError("Club created but could not save your profile: " + coachErr.message);
        setBusy(false);
        return;
      }

      setInfo(`Club created! Your club code is ${code} — share this with your other coaches so they can join.`);
      await loadCoachProfile(user);
    } catch (e) {
      setError(String(e));
    }
    setBusy(false);
  }

  async function handleForgot(email) {
    clearMessages(); setBusy(true);
    const redirectTo = window.location.origin + window.location.pathname;
    const { error: forgotErr } = await db.auth.resetPasswordForEmail(email, { redirectTo });
    if (forgotErr) setError(forgotErr.message);
    else setInfo("Check your email for a password reset link.");
    setBusy(false);
  }

  async function handleSetNewPassword(newPassword) {
    clearMessages(); setBusy(true);
    const { error: updateErr } = await db.auth.updateUser({ password: newPassword });
    if (updateErr) { setError(updateErr.message); setBusy(false); return; }
    await db.auth.signOut();
    setInfo("Password updated — you can now log in.");
    setScreen("login");
    setBusy(false);
  }

  async function handleLogout() {
    await db.auth.signOut();
    setProfile(null);
    clearMessages();
    setScreen("login");
  }

  function goTo(next) {
    clearMessages();
    setScreen(next);
  }

  function openTrainingSession(id, returnTo) {
    clearMessages();
    setTrainingSessionId(id);
    setTrainingReturnTo(returnTo);
    setScreen("training-session");
  }

  if (screen === "loading") {
    return <div className="center-screen"><span className="spinner-text">Loading…</span></div>;
  }
  if (screen === "login") {
    return <LoginScreen onLogin={handleLogin} onGoJoin={() => goTo("join")} onGoCreate={() => goTo("create")} onGoForgot={() => goTo("forgot")} busy={busy} error={error} info={info} />;
  }
  if (screen === "join") {
    return <JoinScreen onJoin={handleJoin} onBack={() => goTo("login")} busy={busy} error={error} info={info} />;
  }
  if (screen === "create") {
    return <CreateScreen onCreate={handleCreate} onBack={() => goTo("login")} busy={busy} error={error} info={info} />;
  }
  if (screen === "forgot") {
    return <ForgotScreen onSend={handleForgot} onBack={() => goTo("login")} busy={busy} error={error} info={info} />;
  }
  if (screen === "reset") {
    return <ResetScreen onSetNew={handleSetNewPassword} busy={busy} error={error} info={info} />;
  }
  if (screen === "home" && profile) {
    return (
      <HomeScreen
        profile={profile}
        onLogout={handleLogout}
        onNavigate={goTo}
        onQuickTraining={() => openTrainingSession(null, "home")}
      />
    );
  }
  if (screen === "planned-games" && profile) {
    return (
      <PlannedGamesScreen
        clubId={profile.clubId}
        role={profile.role}
        onBack={() => goTo("home")}
        onOpenGameDay={g => { setGameDayId(g.id); setGameDayReturnTo("planned-games"); goTo("game-day"); }}
        onCreateGame={() => goTo("create-game")}
      />
    );
  }
  if (screen === "game-history" && profile) {
    return (
      <GameHistoryScreen
        clubId={profile.clubId}
        role={profile.role}
        onBack={() => goTo("home")}
        onOpenGameDay={g => { setGameDayId(g.id); setGameDayReturnTo("game-history"); goTo("game-day"); }}
      />
    );
  }
  if (screen === "create-game" && profile) {
    if (profile.role === "team_manager") {
      // Router-level backstop, matching the Android app's pattern — team
      // managers can't reach this via the UI anyway (button is hidden and
      // the games INSERT policy blocks them at the RLS level too), but this
      // covers it if that ever changes.
      return (
        <HomeScreen
          profile={profile}
          onLogout={handleLogout}
          onNavigate={goTo}
          onQuickTraining={() => openTrainingSession(null, "home")}
        />
      );
    }
    return (
      <CreateGameScreen
        clubId={profile.clubId}
        onBack={() => goTo("planned-games")}
        onCreated={() => goTo("planned-games")}
      />
    );
  }
  if (screen === "game-day" && profile) {
    return (
      <GameDayScreen
        gameId={gameDayId}
        clubId={profile.clubId}
        coachId={profile.id}
        role={profile.role}
        backLabel={gameDayReturnTo === "game-history" ? "Game History" : "Upcoming Games"}
        onBack={() => goTo(gameDayReturnTo)}
      />
    );
  }
  if (screen === "training-history" && profile) {
    return (
      <TrainingHistoryScreen
        clubId={profile.clubId}
        role={profile.role}
        onBack={() => goTo("home")}
        onNewSession={() => openTrainingSession(null, "training-history")}
        onOpenSession={s => openTrainingSession(s.id, "training-history")}
      />
    );
  }
  if (screen === "training-session" && profile) {
    return (
      <TrainingSessionScreen
        sessionId={trainingSessionId}
        clubId={profile.clubId}
        role={profile.role}
        backLabel={trainingReturnTo === "home" ? "Home" : "Training History"}
        onBack={() => goTo(trainingReturnTo)}
      />
    );
  }
  if (screen === "registration" && profile) {
    if (profile.role === "team_manager") {
      return <HomeScreen profile={profile} onLogout={handleLogout} onNavigate={goTo} onQuickTraining={() => openTrainingSession(null, "home")} />;
    }
    return <RegistrationScreen clubId={profile.clubId} onBack={() => goTo("home")} />;
  }
  if (screen === "stats" && profile) {
    if (profile.role === "team_manager") {
      return <HomeScreen profile={profile} onLogout={handleLogout} onNavigate={goTo} onQuickTraining={() => openTrainingSession(null, "home")} />;
    }
    return <StatsScreen clubId={profile.clubId} onBack={() => goTo("home")} />;
  }
  if (screen === "reports" && profile) {
    if (profile.role === "team_manager") {
      return <HomeScreen profile={profile} onLogout={handleLogout} onNavigate={goTo} onQuickTraining={() => openTrainingSession(null, "home")} />;
    }
    return <ReportsScreen clubId={profile.clubId} clubName={profile.clubName} onBack={() => goTo("home")} />;
  }
  if (screen === "manage-coaches" && profile) {
    if (profile.role !== "admin") {
      return <HomeScreen profile={profile} onLogout={handleLogout} onNavigate={goTo} onQuickTraining={() => openTrainingSession(null, "home")} />;
    }
    return <ManageCoachesScreen clubId={profile.clubId} myCoachId={profile.id} onBack={() => goTo("home")} />;
  }
  if (screen === "load-teams-players" && profile) {
    if (profile.role !== "admin") {
      return <HomeScreen profile={profile} onLogout={handleLogout} onNavigate={goTo} onQuickTraining={() => openTrainingSession(null, "home")} />;
    }
    return <LoadTeamsPlayersScreen clubId={profile.clubId} onBack={() => goTo("home")} />;
  }
  return <div className="center-screen"><span className="spinner-text">Loading…</span></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  // The app source above is deliberately type="text/plain" (inert) rather than
  // type="text/babel", so we can control Babel's options explicitly here.
  // IMPORTANT: @babel/standalone's default JSX runtime is "automatic", which
  // compiles JSX into `import { jsx } from "react/jsx-runtime"` — a real ES
  // module import. That's meant for bundlers; loaded as a plain page (React
  // brought in as a global via a CDN <script>, not a module), it throws
  // "Cannot use import statement outside a module" and the whole app fails
  // silently (blank page). Forcing the "classic" runtime compiles JSX into
  // plain React.createElement(...) calls against the global React instead,
  // which works correctly in this plain-script, no-bundler setup.
  const appSource = document.getElementById("app-source").textContent;
  const compiled = Babel.transform(appSource, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  const script = document.createElement("script");
  script.text = compiled;
  document.body.appendChild(script);
</script>
</body>
</html>
