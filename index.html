<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NetballTM Web Hub</title>

<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // Capture the Supabase UMD global immediately, before Babel standalone loads.
  // IMPORTANT: never name a local variable "supabase" anywhere below (see project notes) —
  // Babel standalone's own internals conflict with that global name and silently corrupt output.
  window.__supabaseLib = window.supabase;
</script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<style>
  :root {
    --accent: #3F51B5;
    --accent-dark: #2C387E;
    --bg: #F4F5F8;
    --card: #FFFFFF;
    --text: #1C1E21;
    --muted: #6B7280;
    --border: #E2E4E9;
    --danger: #C0392B;
    --danger-bg: #FDEDEC;
    --success: #1E7B4D;
    --success-bg: #EAF7EF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #root { min-height: 100vh; }
  .center-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.05);
  }
  .card h1 {
    font-size: 20px;
    margin: 0 0 4px 0;
    text-align: center;
  }
  .card .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary {
    width: 100%;
    margin-top: 24px;
    padding: 11px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
  button.primary:hover:not(:disabled) { background: var(--accent-dark); }
  .link-row {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    font-size: 13px;
  }
  .link-row a, .link-plain {
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
  }
  .link-row a:hover, .link-plain:hover { text-decoration: underline; }
  .banner {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 16px;
  }
  .banner.error { background: var(--danger-bg); color: var(--danger); }
  .banner.info { background: var(--success-bg); color: var(--success); }

  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .topbar .who { display: flex; flex-direction: column; }
  .topbar .club-name { font-weight: 700; font-size: 15px; }
  .topbar .me { font-size: 12px; color: var(--muted); }
  .role-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 100px;
    background: #EDEEFB;
    color: var(--accent-dark);
    margin-left: 6px;
  }
  button.logout {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  button.logout:hover { background: #F0F1F4; }

  .nav-grid {
    max-width: 900px;
    margin: 28px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }
  .nav-tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 16px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
  }
  .nav-tile.enabled { cursor: pointer; }
  .nav-tile.enabled:hover { border-color: var(--accent); }
  .nav-tile.disabled { opacity: 0.55; cursor: not-allowed; }
  .nav-tile .soon {
    display: block;
    font-weight: 400;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .section-label {
    max-width: 900px;
    margin: 24px auto 0 auto;
    padding: 0 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .spinner-text {
    color: var(--muted);
    font-size: 14px;
  }

  .page-header {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 20px 0 20px;
  }
  .back-link {
    color: var(--accent);
    cursor: pointer;
    font-size: 14px;
  }
  .back-link:hover { text-decoration: underline; }
  .page-title {
    font-size: 20px;
    font-weight: 700;
    margin: 6px 0 0 0;
  }
  .season-select-row {
    max-width: 900px;
    margin: 14px auto 0 auto;
    padding: 0 20px;
  }
  select.season-select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
  }
  .game-list {
    max-width: 900px;
    margin: 16px auto 40px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .game-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .game-card.bye { opacity: 0.7; }
  .game-card .round-line { font-weight: 700; font-size: 14px; }
  .game-card .meta-line { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .game-card .unavailable-line { color: #B45309; font-size: 12.5px; margin-top: 4px; }
  .empty-note {
    max-width: 900px;
    margin: 0 auto;
    color: var(--muted);
    font-size: 14px;
    padding: 30px 20px;
    text-align: center;
  }
  button.secondary {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
    white-space: nowrap;
  }
  button.secondary:hover { background: #F0F1F4; }
  button.secondary:disabled { opacity: 0.6; cursor: not-allowed; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal-card {
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.25);
  }
  .modal-card h2 { margin: 0 0 4px 0; font-size: 17px; }
  .modal-card .modal-subtitle { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }
  .availability-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .availability-row:last-child { border-bottom: none; }

  .toggle-switch { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #ccc;
    transition: 0.15s;
    border-radius: 24px;
  }
  .toggle-slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: 0.15s;
    border-radius: 50%;
  }
  .toggle-switch input:checked + .toggle-slider { background-color: var(--accent); }
  .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }

  .gameday-toolbar {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 20px 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 16px;
  }
  .score-row { display: flex; gap: 12px; align-items: center; }
  .score-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    text-align: center;
    min-width: 90px;
  }
  .score-box .score-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .score-box .score-value { font-size: 22px; font-weight: 700; }
  .score-sep { font-size: 20px; color: var(--muted); font-weight: 700; }
  .quick-stats-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .quick-stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    min-width: 120px;
    text-align: center;
  }
  .quick-stat label {
    display: block;
    font-size: 10.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 0 5px 0;
    font-weight: 600;
  }
  .quick-stat input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    text-align: center;
    font-weight: 700;
  }

  .quarters-grid {
    max-width: 1000px;
    margin: 20px auto 0 auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .quarter-panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .quarter-panel h3 { margin: 0 0 10px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
  .quarter-field { margin-bottom: 10px; }
  .quarter-field label { font-size: 12px; font-weight: 600; margin: 0 0 4px 0; }
  .quarter-field input { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; }
  .quarter-field .muted-hint { color: var(--muted); font-size: 11.5px; }

  .gameday-actions {
    max-width: 1000px;
    margin: 24px auto 40px auto;
    padding: 0 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .locked-card { max-width: 480px; margin: 60px auto; }

  .page-header-actions {
    max-width: 900px;
    margin: 12px auto 0 auto;
    padding: 0 20px;
    display: flex;
    justify-content: flex-end;
  }

  .quarter-tabs {
    max-width: 1000px;
    margin: 16px auto 0 auto;
    padding: 0 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .quarter-tab {
    padding: 9px 20px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
  }
  .quarter-tab:hover { border-color: var(--accent); }
  .quarter-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .court-wrap {
    max-width: 1000px;
    margin: 18px auto 0 auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .court-zone {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .court-zone h4 {
    margin: 0 0 12px 0;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .court-slots { display: flex; gap: 10px; flex-wrap: wrap; }
  .court-slot {
    flex: 1;
    min-width: 130px;
    background: #F7F8FB;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
  }
  .court-slot:hover { border-color: var(--accent); }
  .court-slot.filled { border-style: solid; background: #fff; }
  .court-slot .slot-code {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-dark);
    letter-spacing: 0.03em;
  }
  .court-slot .slot-player { font-size: 14.5px; font-weight: 600; margin-top: 5px; }
  .court-slot .slot-empty { font-size: 13px; color: var(--muted); margin-top: 5px; }

  .bench-wrap { max-width: 1000px; margin: 16px auto 0 auto; padding: 0 20px; }
  .bench-wrap h4 { margin: 0 0 8px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
  .bench-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .bench-chip {
    padding: 9px 16px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 13.5px;
    cursor: pointer;
  }
  .bench-chip:hover { border-color: var(--accent); }
  .bench-chip.nap { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }

  .quarter-panel-single { max-width: 480px; margin: 20px auto 0 auto; padding: 0 20px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useEffect, useCallback } = React;

const SUPABASE_URL = "https://fkwoiaxmmjfegiltawkg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrd29pYXhtbWpmZWdpbHRhd2tnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjQ3MjAsImV4cCI6MjA5NjY0MDcyMH0.0lAsh7avrfmp7Qy8LVXcanwUwI1IaNvYLfk61UuL734";

// The Supabase client. Deliberately NOT named "supabase" (see the comment
// in <head> — Babel standalone's own global conflicts with that name).
const db = window.__supabaseLib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function generateClubCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no 0/O/1/I to avoid confusion
  let out = "";
  for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

function Banner({ error, info }) {
  if (error) return <div className="banner error">{error}</div>;
  if (info) return <div className="banner info">{info}</div>;
  return null;
}

function AuthShell({ title, subtitle, children }) {
  return (
    <div className="center-screen">
      <div className="card">
        <h1>{title}</h1>
        {subtitle && <div className="subtitle">{subtitle}</div>}
        {children}
      </div>
    </div>
  );
}

function LoginScreen({ onLogin, onGoJoin, onGoCreate, onGoForgot, busy, error, info }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  return (
    <AuthShell title="NetballTM" subtitle="Web Hub login">
      <label>Email</label>
      <input type="email" value={email} onChange={e => setEmail(e.target.value)} autoComplete="username" />
      <label>Password</label>
      <input type="password" value={password} onChange={e => setPassword(e.target.value)} autoComplete="current-password" />
      <Banner error={error} info={info} />
      <button className="primary" disabled={busy || !email || !password} onClick={() => onLogin(email.trim(), password)}>
        {busy ? "Logging in…" : "Log In"}
      </button>
      <div className="link-row">
        <a onClick={onGoForgot}>Forgot password?</a>
        <a onClick={onGoJoin}>Join a club</a>
      </div>
      <div className="link-row" style={{ justifyContent: "center" }}>
        <a onClick={onGoCreate}>Create a new club</a>
      </div>
    </AuthShell>
  );
}

function JoinScreen({ onJoin, onBack, busy, error, info }) {
  const [clubCode, setClubCode] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const canSubmit = clubCode && displayName && email && password;
  return (
    <AuthShell title="Join a Club" subtitle="Enter the club code your admin gave you">
      <label>Club Code</label>
      <input value={clubCode} onChange={e => setClubCode(e.target.value)} placeholder="e.g. AB12CD" />
      <label>Your Name</label>
      <input value={displayName} onChange={e => setDisplayName(e.target.value)} />
      <label>Email</label>
      <input type="email" value={email} onChange={e => setEmail(e.target.value)} autoComplete="username" />
      <label>Password</label>
      <input type="password" value={password} onChange={e => setPassword(e.target.value)} autoComplete="new-password" />
      <Banner error={error} info={info} />
      <button className="primary" disabled={busy || !canSubmit} onClick={() => onJoin(email.trim(), password, displayName.trim(), clubCode.trim())}>
        {busy ? "Joining…" : "Join Club"}
      </button>
      <div className="link-row" style={{ justifyContent: "center" }}>
        <a onClick={onBack}>Back to login</a>
      </div>
    </AuthShell>
  );
}

function CreateScreen({ onCreate, onBack, busy, error, info }) {
  const [clubName, setClubName] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const canSubmit = clubName && displayName && email && password;
  return (
    <AuthShell title="Create a Club" subtitle="You'll be set up as the club's admin">
      <label>Club Name</label>
      <input value={clubName} onChange={e => setClubName(e.target.value)} />
      <label>Your Name</label>
      <input value={displayName} onChange={e => setDisplayName(e.target.value)} />
      <label>Email</label>
      <input type="email" value={email} onChange={e => setEmail(e.target.value)} autoComplete="username" />
      <label>Password</label>
      <input type="password" value={password} onChange={e => setPassword(e.target.value)} autoComplete="new-password" />
      <Banner error={error} info={info} />
      <button className="primary" disabled={busy || !canSubmit} onClick={() => onCreate(email.trim(), password, displayName.trim(), clubName.trim())}>
        {busy ? "Creating…" : "Create Club"}
      </button>
      <div className="link-row" style={{ justifyContent: "center" }}>
        <a onClick={onBack}>Back to login</a>
      </div>
    </AuthShell>
  );
}

function ForgotScreen({ onSend, onBack, busy, error, info }) {
  const [email, setEmail] = useState("");
  return (
    <AuthShell title="Reset Password" subtitle="We'll email you a reset link">
      <label>Email</label>
      <input type="email" value={email} onChange={e => setEmail(e.target.value)} autoComplete="username" />
      <Banner error={error} info={info} />
      <button className="primary" disabled={busy || !email} onClick={() => onSend(email.trim())}>
        {busy ? "Sending…" : "Send Reset Link"}
      </button>
      <div className="link-row" style={{ justifyContent: "center" }}>
        <a onClick={onBack}>Back to login</a>
      </div>
    </AuthShell>
  );
}

function ResetScreen({ onSetNew, busy, error, info }) {
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const mismatch = confirm.length > 0 && password !== confirm;
  return (
    <AuthShell title="Set New Password" subtitle="Choose a new password for your account">
      <label>New Password</label>
      <input type="password" value={password} onChange={e => setPassword(e.target.value)} autoComplete="new-password" />
      <label>Confirm Password</label>
      <input type="password" value={confirm} onChange={e => setConfirm(e.target.value)} autoComplete="new-password" />
      {mismatch && <div className="banner error">Passwords don't match.</div>}
      <Banner error={error} info={info} />
      <button className="primary" disabled={busy || !password || mismatch} onClick={() => onSetNew(password)}>
        {busy ? "Saving…" : "Set New Password"}
      </button>
    </AuthShell>
  );
}

function AvailabilityDialog({ game, onClose, onSave, busy }) {
  // Roster comes from the game's own players_snapshot (the season roster
  // captured when the game was created) rather than a live registrations
  // lookup — this matches how the Android app's Availability dialog works
  // and sidesteps needing to resolve registrations.season_index to a season.
  const players = (game.players_snapshot || []).map(p => p.name).sort();

  const initial = {};
  players.forEach(name => {
    // Default is available (true) unless the game row has an explicit
    // false entry for that player — same convention as the rest of the app.
    initial[name] = (game.player_availability || {})[name] !== false;
  });
  const [avail, setAvail] = useState(initial);

  function toggle(name) {
    setAvail(prev => ({ ...prev, [name]: !prev[name] }));
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={e => e.stopPropagation()}>
        <h2>Availability</h2>
        <div className="modal-subtitle">
          Round {game.round}{game.opponent ? " vs " + game.opponent : ""}
        </div>

function CreateGameScreen({ clubId, onBack, onCreated }) {
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [seasons, setSeasons] = useState([]);
  const [players, setPlayers] = useState([]);
  const [existingRounds, setExistingRounds] = useState({}); // seasonName -> [round, ...]

  const [seasonName, setSeasonName] = useState("");
  const [round, setRound] = useState("");
  const [opponent, setOpponent] = useState("");
  const [court, setCourt] = useState("");
  const [dateStr, setDateStr] = useState("");
  const [timeStr, setTimeStr] = useState("");
  const [isBye, setIsBye] = useState(false);
  const [selectedPlayers, setSelectedPlayers] = useState({});

  useEffect(() => {
    (async () => {
      const [seasonsRes, playersRes, gamesRes] = await Promise.all([
        db.from("seasons").select("*").eq("club_id", clubId),
        db.from("players").select("*").eq("club_id", clubId).order("name", { ascending: true }),
        db.from("games").select("season_name,round").eq("club_id", clubId),
      ]);
      const firstErr = seasonsRes.error || playersRes.error || gamesRes.error;
      if (firstErr) {
        setErrorMsg(firstErr.message);
        setLoading(false);
        return;
      }
      const seasonRows = seasonsRes.data || [];
      const playerRows = playersRes.data || [];
      const gameRows = gamesRes.data || [];

      setSeasons(seasonRows);
      setPlayers(playerRows);

      const roundsBySeason = {};
      gameRows.forEach(g => {
        if (!roundsBySeason[g.season_name]) roundsBySeason[g.season_name] = [];
        roundsBySeason[g.season_name].push(g.round);
      });
      setExistingRounds(roundsBySeason);

      const initialSeason = (seasonRows[0] && seasonRows[0].name) || "";
      setSeasonName(initialSeason);
      const usedRounds = roundsBySeason[initialSeason] || [];
      setRound(usedRounds.length ? String(Math.max(...usedRounds) + 1) : "1");

      const initialSelected = {};
      playerRows.forEach(p => { initialSelected[p.name] = true; });
      setSelectedPlayers(initialSelected);

      setLoading(false);
    })();
  }, [clubId]);

  function handleSeasonChange(name) {
    setSeasonName(name);
    const usedRounds = existingRounds[name] || [];
    setRound(usedRounds.length ? String(Math.max(...usedRounds) + 1) : "1");
  }

  function togglePlayer(name) {
    setSelectedPlayers(prev => ({ ...prev, [name]: !prev[name] }));
  }

  function formatDisplayDate(iso) {
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return dayNames[d.getDay()] + ", " + d.getDate() + " " + monthNames[d.getMonth()] + " " + d.getFullYear();
  }

  function formatDisplayTime(t) {
    if (!t) return "";
    const parts = t.split(":");
    let h = parseInt(parts[0], 10);
    const m = parts[1];
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12; if (h === 0) h = 12;
    return h + ":" + m + " " + ampm;
  }

  const canSubmit = seasonName && round && (isBye || opponent.trim());
  const usedRoundsForSeason = (existingRounds[seasonName] || []).slice().sort((a, b) => a - b);

  async function handleCreate() {
    setSaving(true);
    setErrorMsg("");

    const rosterNames = isBye ? [] : Object.keys(selectedPlayers).filter(name => selectedPlayers[name]).sort();

    const payload = {
      club_id: clubId,
      season_name: seasonName,
      round: parseInt(round, 10),
      opponent: isBye ? "BYE" : opponent.trim(),
      court: court.trim() || null,
      game_date: formatDisplayDate(dateStr),
      game_time: formatDisplayTime(timeStr),
      is_completed: false,
      is_bye: isBye,
      players_snapshot: rosterNames.map(name => ({ name, wasFillIn: false })),
      positions_by_quarter: {},
      goals_by_quarter: {},
      opponent_goals_by_quarter: {},
      turnovers_by_quarter: {},
      quarter_notes: {},
      player_availability: {},
      players_of_match: [],
      potm_comments: {},
      potm_photos: {},
      our_score: 0,
      opponent_score: 0,
    };

    const { error: insertErr } = await db.from("games").insert(payload);
    setSaving(false);
    if (insertErr) { setErrorMsg(insertErr.message); return; }
    onCreated();
  }

  if (loading) return <div className="empty-note">Loading…</div>;

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={onBack}>&larr; Back to Upcoming Games</a>
        <h1 className="page-title">Create Game</h1>
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      <div className="quarters-grid" style={{ gridTemplateColumns: "1fr", maxWidth: 480 }}>
        <div className="quarter-panel">
          <div className="quarter-field">
            <label>Season</label>
            <select className="season-select" style={{ width: "100%" }} value={seasonName} onChange={e => handleSeasonChange(e.target.value)}>
              {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
            </select>
          </div>
          <div className="quarter-field">
            <label>Round</label>
            <input type="number" min="1" value={round} onChange={e => setRound(e.target.value)} />
            {usedRoundsForSeason.length > 0 && (
              <div className="muted-hint">Rounds already used this season: {usedRoundsForSeason.join(", ")}</div>
            )}
          </div>
          <div className="quarter-field">
            <label>
              <input type="checkbox" checked={isBye} onChange={e => setIsBye(e.target.checked)} style={{ width: "auto", marginRight: 8 }} />
              This round is a BYE
            </label>
          </div>
          {!isBye && (
            <div className="quarter-field">
              <label>Opponent</label>
              <input type="text" value={opponent} onChange={e => setOpponent(e.target.value)} />
            </div>
          )}
          <div className="quarter-field">
            <label>Court</label>
            <input type="text" value={court} onChange={e => setCourt(e.target.value)} />
          </div>
          <div className="quarter-field">
            <label>Date</label>
            <input type="date" value={dateStr} onChange={e => setDateStr(e.target.value)} />
          </div>
          <div className="quarter-field">
            <label>Time</label>
            <input type="time" value={timeStr} onChange={e => setTimeStr(e.target.value)} />
          </div>
        </div>

        {!isBye && (
          <div className="quarter-panel">
            <h3>Roster</h3>
            <RosterToggleList players={players.map(p => p.name)} selected={selectedPlayers} onToggle={togglePlayer} />
          </div>
        )}
      </div>

      <div className="gameday-actions">
        <button className="secondary" onClick={onBack} disabled={saving}>Cancel</button>
        <button className="primary" style={{ marginTop: 0, width: "auto" }} disabled={saving || !canSubmit} onClick={handleCreate}>
          {saving ? "Creating…" : "Create Game"}
        </button>
      </div>
    </div>
  );
}

function PlannedGamesScreen({ clubId, role, onBack, onOpenGameDay, onCreateGame }) {
  const [seasons, setSeasons] = useState([]);
  const [seasonName, setSeasonName] = useState("");
  const [games, setGames] = useState([]);
  const [loading, setLoading] = useState(true);
  const [dialogGame, setDialogGame] = useState(null);
  const [savingAvailability, setSavingAvailability] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");

  useEffect(() => {
    (async () => {
      const { data, error: seasonsErr } = await db.from("seasons").select("*").eq("club_id", clubId);
      if (seasonsErr) { setErrorMsg(seasonsErr.message); setLoading(false); return; }
      setSeasons(data || []);
      if (data && data.length > 0) setSeasonName(data[0].name);
      else setLoading(false);
    })();
  }, [clubId]);

  const loadGames = useCallback(async () => {
    if (!seasonName) return;
    setLoading(true);
    const { data, error: gamesErr } = await db
      .from("games")
      .select("*")
      .eq("club_id", clubId)
      .eq("season_name", seasonName)
      .eq("is_completed", false)
      .order("round", { ascending: true });
    if (gamesErr) setErrorMsg(gamesErr.message);
    else setGames(data || []);
    setLoading(false);
  }, [clubId, seasonName]);

  useEffect(() => { loadGames(); }, [loadGames]);

  async function saveAvailability(map) {
    setSavingAvailability(true);
    const { error: updateErr } = await db.from("games").update({ player_availability: map }).eq("id", dialogGame.id);
    setSavingAvailability(false);
    if (updateErr) { setErrorMsg(updateErr.message); return; }
    setGames(prev => prev.map(g => g.id === dialogGame.id ? { ...g, player_availability: map } : g));
    setDialogGame(null);
  }

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={onBack}>&larr; Back to Home</a>
        <h1 className="page-title">Upcoming Games</h1>
      </div>

      {role !== "team_manager" && (
        <div className="page-header-actions">
          <button className="secondary" onClick={onCreateGame}>+ Create Game</button>
        </div>
      )}

      {seasons.length > 1 && (
        <div className="season-select-row">
          <select className="season-select" value={seasonName} onChange={e => setSeasonName(e.target.value)}>
            {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
          </select>
        </div>
      )}

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : games.length === 0 ? (
        <div className="empty-note">No upcoming games for this season.</div>
      ) : (
        <div className="game-list">
          {games.map(g => <GameCard key={g.id} game={g} onOpenAvailability={setDialogGame} onOpenGameDay={onOpenGameDay} />)}
        </div>
      )}

      {dialogGame && (
        <AvailabilityDialog
          game={dialogGame}
          busy={savingAvailability}
          onClose={() => setDialogGame(null)}
          onSave={saveAvailability}
        />
      )}
    </div>
  );
}

const QUARTERS = ["1", "2", "3", "4"];
const COURT_ZONES = [
  { title: "Attack", codes: ["GS", "GA"] },
  { title: "Centre", codes: ["WA", "C", "WD"] },
  { title: "Defence", codes: ["GD", "GK"] },
];
const COURT_CODES = COURT_ZONES.reduce((all, zone) => all.concat(zone.codes), []);
const POSITION_LABELS = {
  GS: "Goal Shooter", GA: "Goal Attack", WA: "Wing Attack", C: "Centre",
  WD: "Wing Defence", GD: "Goal Defence", GK: "Goal Keeper",
};
// Same 2-hour staleness window as the Android app's game lock guard (see
// project notes) — a lock older than this is treated as abandoned.
const LOCK_STALE_MS = 2 * 60 * 60 * 1000;

function CourtView({ q, players, positions, onAssign, onClearSlot, onToggleBench }) {
  const [openSlot, setOpenSlot] = useState(null);
  const qPositions = positions[q] || {};

  const slotAssignments = {};
  COURT_CODES.forEach(code => { slotAssignments[code] = null; });
  players.forEach(name => {
    const code = qPositions[name] || "OFF";
    if (COURT_CODES.indexOf(code) !== -1) slotAssignments[code] = name;
  });

  const benchPlayers = players
    .filter(name => COURT_CODES.indexOf(qPositions[name] || "OFF") === -1)
    .map(name => ({ name, status: qPositions[name] === "NAP" ? "NAP" : "OFF" }));

  return (
    <div>
      <div className="court-wrap">
        {COURT_ZONES.map(zone => (
          <div className="court-zone" key={zone.title}>
            <h4>{zone.title}</h4>
            <div className="court-slots">
              {zone.codes.map(code => {
                const playerName = slotAssignments[code];
                return (
                  <div
                    key={code}
                    className={"court-slot" + (playerName ? " filled" : "")}
                    onClick={() => setOpenSlot(code)}
                  >
                    <div className="slot-code">{code}</div>
                    {playerName ? (
                      <div className="slot-player">{playerName}</div>
                    ) : (
                      <div className="slot-empty">Tap to assign</div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>

      <div className="bench-wrap">
        <h4>Bench <span style={{ textTransform: "none", fontWeight: 400 }}>(tap a player to mark Not Available)</span></h4>
        <div className="bench-chips">
          {benchPlayers.length === 0 && <span style={{ color: "var(--muted)", fontSize: 13 }}>Everyone is on court.</span>}
          {benchPlayers.map(p => (
            <div
              key={p.name}
              className={"bench-chip" + (p.status === "NAP" ? " nap" : "")}
              onClick={() => onToggleBench(q, p.name, p.status)}
            >
              {p.name}{p.status === "NAP" ? " · N/A" : ""}
            </div>
          ))}
        </div>
      </div>

      {openSlot && (
        <PlayerPickerModal
          slotCode={openSlot}
          currentPlayer={slotAssignments[openSlot]}
          benchPlayers={benchPlayers}
          onPick={name => { onAssign(q, openSlot, name); setOpenSlot(null); }}
          onClear={() => { onClearSlot(q, slotAssignments[openSlot]); setOpenSlot(null); }}
          onClose={() => setOpenSlot(null)}
        />
      )}
    </div>
  );
}

function GameDayScreen({ gameId, clubId, coachId, onBack }) {
  const [loading, setLoading] = useState(true);
  const [lockState, setLockState] = useState("checking"); // checking | held | locked-by-other
  const [lockedByName, setLockedByName] = useState("");
  const [errorMsg, setErrorMsg] = useState("");
  const [infoMsg, setInfoMsg] = useState("");
  const [saving, setSaving] = useState(false);

  const [game, setGame] = useState(null);
  const [players, setPlayers] = useState([]);
  const [positions, setPositions] = useState({ "1": {}, "2": {}, "3": {}, "4": {} });
  const [goals, setGoals] = useState({ "1": {}, "2": {}, "3": {}, "4": {} });
  const [oppGoals, setOppGoals] = useState({ "1": 0, "2": 0, "3": 0, "4": 0 });
  const [turnovers, setTurnovers] = useState({ "1": 0, "2": 0, "3": 0, "4": 0 });
  const [notes, setNotes] = useState({ "1": "", "2": "", "3": "", "4": "" });
  const [activeQuarter, setActiveQuarter] = useState("1");

  useEffect(() => {
    let cancelled = false;

    (async () => {
      setLoading(true);
      setErrorMsg("");

      const { data: gameRow, error: gameErr } = await db.from("games").select("*").eq("id", gameId).maybeSingle();
      if (cancelled) return;
      if (gameErr || !gameRow) {
        setErrorMsg("Could not load this game.");
        setLoading(false);
        return;
      }

      const lockKey = { club_id: clubId, season_name: gameRow.season_name, round: gameRow.round, opponent: gameRow.opponent };

      const { data: existingLock } = await db
        .from("game_locks")
        .select("*")
        .eq("club_id", clubId)
        .eq("season_name", gameRow.season_name)
        .eq("round", gameRow.round)
        .eq("opponent", gameRow.opponent)
        .maybeSingle();

      if (cancelled) return;

      let shouldInsertLock = false;

      if (existingLock) {
        const age = Date.now() - Number(existingLock.locked_at);
        if (age > LOCK_STALE_MS) {
          // Stale lock left behind (app minimised/killed mid-edit) — clear it
          // and take over, same as the Android app's 2-hour staleness guard.
          await db.from("game_locks").delete().eq("id", existingLock.id);
          shouldInsertLock = true;
        } else if (existingLock.locked_by !== coachId) {
          const { data: otherCoach } = await db.from("coaches").select("display_name,email").eq("id", existingLock.locked_by).maybeSingle();
          if (cancelled) return;
          setLockedByName((otherCoach && (otherCoach.display_name || otherCoach.email)) || "another coach");
          setLockState("locked-by-other");
          setLoading(false);
          return;
        }
        // else: it's already our own lock (e.g. reopened in another tab) — carry on.
      } else {
        shouldInsertLock = true;
      }

      if (shouldInsertLock) {
        const { error: insertErr } = await db.from("game_locks").insert({ ...lockKey, locked_by: coachId, locked_at: Date.now() });
        if (insertErr) {
          // Another coach grabbed the lock in the same instant — re-check who has it now
          // rather than surfacing a raw unique-constraint error.
          const { data: raceLock } = await db
            .from("game_locks").select("*")
            .eq("club_id", clubId).eq("season_name", gameRow.season_name)
            .eq("round", gameRow.round).eq("opponent", gameRow.opponent)
            .maybeSingle();
          if (cancelled) return;
          if (raceLock && raceLock.locked_by !== coachId) {
            const { data: otherCoach } = await db.from("coaches").select("display_name,email").eq("id", raceLock.locked_by).maybeSingle();
            if (cancelled) return;
            setLockedByName((otherCoach && (otherCoach.display_name || otherCoach.email)) || "another coach");
            setLockState("locked-by-other");
            setLoading(false);
            return;
          }
        }
      }

      if (cancelled) return;

      const snapshotPlayers = (gameRow.players_snapshot || []).map(p => p.name);
      const nextPositions = {};
      const nextGoals = {};
      const nextOppGoals = {};
      const nextTurnovers = {};
      const nextNotes = {};
      QUARTERS.forEach(q => {
        const storedPositions = (gameRow.positions_by_quarter && gameRow.positions_by_quarter[q]) || {};
        const qPositions = {};
        snapshotPlayers.forEach(name => { qPositions[name] = storedPositions[name] || "OFF"; });
        nextPositions[q] = qPositions;
        nextGoals[q] = (gameRow.goals_by_quarter && gameRow.goals_by_quarter[q]) || {};
        nextOppGoals[q] = (gameRow.opponent_goals_by_quarter && gameRow.opponent_goals_by_quarter[q]) || 0;
        nextTurnovers[q] = (gameRow.turnovers_by_quarter && gameRow.turnovers_by_quarter[q]) || 0;
        nextNotes[q] = (gameRow.quarter_notes && gameRow.quarter_notes[q]) || "";
      });

      setGame(gameRow);
      setPlayers(snapshotPlayers);
      setPositions(nextPositions);
      setGoals(nextGoals);
      setOppGoals(nextOppGoals);
      setTurnovers(nextTurnovers);
      setNotes(nextNotes);
      setLockState("held");
      setLoading(false);
    })();

    return () => { cancelled = true; };
  }, [gameId, clubId, coachId]);

  function updatePosition(q, name, code) {
    setPositions(prev => ({ ...prev, [q]: { ...prev[q], [name]: code } }));
  }
  function assignSlot(q, code, name) {
    setPositions(prev => {
      const qMap = { ...prev[q] };
      // Whoever was previously in this slot goes back to the bench.
      Object.keys(qMap).forEach(pname => {
        if (qMap[pname] === code && pname !== name) qMap[pname] = "OFF";
      });
      qMap[name] = code;
      return { ...prev, [q]: qMap };
    });
  }
  function clearSlot(q, name) {
    if (!name) return;
    setPositions(prev => ({ ...prev, [q]: { ...prev[q], [name]: "OFF" } }));
  }
  function toggleBenchStatus(q, name, currentStatus) {
    setPositions(prev => ({ ...prev, [q]: { ...prev[q], [name]: currentStatus === "NAP" ? "OFF" : "NAP" } }));
  }
  function updateGoal(q, name, value) {
    setGoals(prev => ({ ...prev, [q]: { ...prev[q], [name]: value } }));
  }
  function updateOppGoals(q, value) {
    setOppGoals(prev => ({ ...prev, [q]: value }));
  }
  function updateTurnovers(q, value) {
    setTurnovers(prev => ({ ...prev, [q]: value }));
  }
  function updateNotes(q, value) {
    setNotes(prev => ({ ...prev, [q]: value }));
  }

  async function releaseLock() {
    if (!game) return;
    await db.from("game_locks")
      .delete()
      .eq("club_id", clubId)
      .eq("season_name", game.season_name)
      .eq("round", game.round)
      .eq("opponent", game.opponent)
      .eq("locked_by", coachId);
  }

  async function handleBack() {
    await releaseLock();
    onBack();
  }

  async function handleSaveDraft() {
    setSaving(true);
    setErrorMsg("");
    setInfoMsg("");

    let ourScore = 0;
    let opponentScore = 0;
    const cleanGoals = {};
    const cleanOppGoals = {};
    const cleanTurnovers = {};
    const cleanNotes = {};

    QUARTERS.forEach(q => {
      const qGoals = {};
      Object.entries(goals[q] || {}).forEach(([name, val]) => {
        const n = Number(val) || 0;
        if (n > 0) { qGoals[name] = n; ourScore += n; }
      });
      cleanGoals[q] = qGoals;
      cleanOppGoals[q] = Number(oppGoals[q]) || 0;
      opponentScore += cleanOppGoals[q];
      cleanTurnovers[q] = Number(turnovers[q]) || 0;
      if (notes[q] && notes[q].trim()) cleanNotes[q] = notes[q].trim();
    });

    const { error: updateErr } = await db.from("games").update({
      positions_by_quarter: positions,
      goals_by_quarter: cleanGoals,
      opponent_goals_by_quarter: cleanOppGoals,
      turnovers_by_quarter: cleanTurnovers,
      quarter_notes: cleanNotes,
      our_score: ourScore,
      opponent_score: opponentScore,
    }).eq("id", gameId);

    setSaving(false);
    if (updateErr) { setErrorMsg(updateErr.message); return; }
    setInfoMsg("Draft saved.");
  }

  if (loading) {
    return <div className="empty-note">Loading…</div>;
  }

  if (lockState === "locked-by-other") {
    return (
      <div className="center-screen">
        <div className="card locked-card">
          <h1>Game In Use</h1>
          <div className="subtitle">This game is currently being edited by {lockedByName}. Try again shortly.</div>
          <button className="primary" onClick={onBack}>Back</button>
        </div>
      </div>
    );
  }

  if (!game) {
    return (
      <div className="empty-note">
        {errorMsg || "Could not load this game."}
        <div style={{ marginTop: 14 }}><a className="back-link" onClick={onBack}>&larr; Back</a></div>
      </div>
    );
  }

  const ourScoreLive = QUARTERS.reduce((sum, q) => sum + Object.values(goals[q] || {}).reduce((s, v) => s + (Number(v) || 0), 0), 0);
  const oppScoreLive = QUARTERS.reduce((sum, q) => sum + (Number(oppGoals[q]) || 0), 0);

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={handleBack}>&larr; Back to Upcoming Games</a>
        <h1 className="page-title">Round {game.round} vs {game.opponent}</h1>
      </div>

      <div className="gameday-toolbar">
        <div className="score-row">
          <div className="score-box">
            <div className="score-label">Us</div>
            <div className="score-value">{ourScoreLive}</div>
          </div>
          <div className="score-sep">-</div>
          <div className="score-box">
            <div className="score-label">{game.opponent}</div>
            <div className="score-value">{oppScoreLive}</div>
          </div>
        </div>
        <div className="quick-stats-row">
          <div className="quick-stat">
            <label>Opp Goals · Q{activeQuarter}</label>
            <input
              type="number" min="0"
              value={oppGoals[activeQuarter] || 0}
              onChange={e => updateOppGoals(activeQuarter, parseInt(e.target.value, 10) || 0)}
            />
          </div>
          <div className="quick-stat">
            <label>Turnovers · Q{activeQuarter}</label>
            <input
              type="number" min="0"
              value={turnovers[activeQuarter] || 0}
              onChange={e => updateTurnovers(activeQuarter, parseInt(e.target.value, 10) || 0)}
            />
          </div>
        </div>
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 1000, margin: "14px auto 0 auto" }}>{errorMsg}</div>}
      {infoMsg && <div className="banner info" style={{ maxWidth: 1000, margin: "14px auto 0 auto" }}>{infoMsg}</div>}

      <div className="quarter-tabs">
        {QUARTERS.map(q => (
          <button
            key={q}
            className={"quarter-tab" + (activeQuarter === q ? " active" : "")}
            onClick={() => setActiveQuarter(q)}
          >
            Quarter {q}
          </button>
        ))}
      </div>

      <CourtView
        q={activeQuarter}
        players={players}
        positions={positions}
        onAssign={assignSlot}
        onClearSlot={clearSlot}
        onToggleBench={toggleBenchStatus}
      />

      <div className="quarter-panel-single">
        <QuarterPanel
          q={activeQuarter}
          players={players}
          positions={positions}
          goals={goals}
          notes={notes}
          onGoalChange={updateGoal}
          onNotesChange={updateNotes}
        />
      </div>

      <div className="gameday-actions">
        <button className="secondary" onClick={handleBack} disabled={saving}>Back</button>
        <button className="primary" style={{ marginTop: 0, width: "auto" }} disabled={saving} onClick={handleSaveDraft}>
          {saving ? "Saving…" : "Save"}
        </button>
      </div>
    </div>
  );
}

function NavTile({ label, enabled, onClick }) {
  return (
    <div className={"nav-tile " + (enabled ? "enabled" : "disabled")} onClick={enabled ? onClick : undefined}>
      {label}
      {!enabled && <span className="soon">Coming soon</span>}
    </div>
  );
}

function HomeScreen({ profile, onLogout, onNavigate }) {
  const isAdmin = profile.role === "admin";
  const isTeamManager = profile.role === "team_manager";

  // Mirrors the Android app's role gating (see Permission levels / roles
  // section of the project knowledge doc): team_manager gets Game Day +
  // Training + history views only; Reports/Stats/Registration/Evaluations
  // and Club Settings/Manage Coaches stay hidden. Nothing here is wired up
  // yet (Phase 1 is just the login/role foundation) — every tile is a
  // placeholder until its phase is built.
  return (
    <div>
      <div className="topbar">
        <div className="who">
          <span className="club-name">{profile.clubName || "Your Club"}</span>
          <span className="me">
            {profile.displayName || profile.email}
            <span className="role-badge">{profile.role}</span>
          </span>
        </div>
        <button className="logout" onClick={onLogout}>Log Out</button>
      </div>

      <div className="section-label">Game Day</div>
      <div className="nav-grid">
        <NavTile label="Game Day" enabled={true} onClick={() => onNavigate("planned-games")} />
        <NavTile label="Upcoming Games" enabled={true} onClick={() => onNavigate("planned-games")} />
        <NavTile label="Game History" enabled={false} />
      </div>

      <div className="section-label">Training</div>
      <div className="nav-grid">
        <NavTile label="Training Attendance" enabled={false} />
        <NavTile label="Training History" enabled={false} />
      </div>

      {!isTeamManager && (
        <React.Fragment>
          <div className="section-label">Reports &amp; Admin</div>
          <div className="nav-grid">
            <NavTile label="Registration" enabled={false} />
            <NavTile label="Stats" enabled={false} />
            <NavTile label="Reports" enabled={false} />
            <NavTile label="Player Evaluations" enabled={false} />
          </div>
        </React.Fragment>
      )}

      {isAdmin && (
        <React.Fragment>
          <div className="section-label">Club Admin</div>
          <div className="nav-grid">
            <NavTile label="Club Settings" enabled={false} />
            <NavTile label="Manage Coaches" enabled={false} />
            <NavTile label="Load Teams &amp; Players" enabled={false} />
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("loading");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [profile, setProfile] = useState(null);
  const [gameDayId, setGameDayId] = useState(null);

  const clearMessages = () => { setError(""); setInfo(""); };

  const loadCoachProfile = useCallback(async (user) => {
    const { data, error: fetchErr } = await db
      .from("coaches")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();

    if (fetchErr || !data) {
      await db.auth.signOut();
      setError("Could not find your coach profile. Please contact your club admin.");
      setScreen("login");
      return;
    }

    setProfile({
      id: user.id,
      email: user.email,
      displayName: data.display_name,
      clubId: data.club_id,
      clubName: data.club_name,
      role: data.role || "coach",
    });
    setScreen("home");
  }, []);

  useEffect(() => {
    const { data: authListener } = db.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        clearMessages();
        setScreen("reset");
      }
    });

    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session && session.user) {
        await loadCoachProfile(session.user);
      } else {
        setScreen("login");
      }
    })();

    return () => {
      authListener && authListener.subscription && authListener.subscription.unsubscribe();
    };
  }, [loadCoachProfile]);

  async function handleLogin(email, password) {
    clearMessages(); setBusy(true);
    const { data, error: loginErr } = await db.auth.signInWithPassword({ email, password });
    if (loginErr) { setError(loginErr.message); setBusy(false); return; }
    await loadCoachProfile(data.user);
    setBusy(false);
  }

  async function handleJoin(email, password, displayName, clubCodeRaw) {
    clearMessages(); setBusy(true);
    try {
      const code = clubCodeRaw.toUpperCase();
      const { data: club, error: clubErr } = await db.from("clubs").select("*").eq("code", code).maybeSingle();
      if (clubErr || !club) {
        setError("Club code not found. Double-check it with your club admin.");
        setBusy(false);
        return;
      }

      // Same pattern as the Android app's JOIN_CLUB flow: try signing in
      // first in case the account already exists, only sign up if that fails.
      let user = null;
      const signInRes = await db.auth.signInWithPassword({ email, password });
      if (signInRes.error) {
        const signUpRes = await db.auth.signUp({ email, password });
        if (signUpRes.error) { setError(signUpRes.error.message); setBusy(false); return; }
        user = signUpRes.data.user;
      } else {
        user = signInRes.data.user;
      }
      if (!user) {
        setError("Could not create your account. Please try again.");
        setBusy(false);
        return;
      }

      // Role is always sent as "coach" here — self-service joining never
      // grants admin or team_manager. An admin promotes/demotes afterwards
      // via Manage Coaches.
      const { error: upsertErr } = await db.from("coaches").upsert({
        id: user.id,
        email,
        display_name: displayName,
        club_name: club.name,
        club_id: club.id,
        role: "coach",
      });
      if (upsertErr) {
        setError("Joined but could not save your profile: " + upsertErr.message);
        setBusy(false);
        return;
      }
      await loadCoachProfile(user);
    } catch (e) {
      setError(String(e));
    }
    setBusy(false);
  }

  async function handleCreate(email, password, displayName, clubName) {
    clearMessages(); setBusy(true);
    try {
      const signUpRes = await db.auth.signUp({ email, password });
      if (signUpRes.error) { setError(signUpRes.error.message); setBusy(false); return; }
      const user = signUpRes.data.user;
      if (!user) {
        setError("Account created, but could not finish setup automatically. Please try logging in.");
        setBusy(false);
        return;
      }

      const code = generateClubCode();
      const { data: club, error: clubErr } = await db.from("clubs").insert({
        name: clubName, code, created_by: user.id,
      }).select().single();
      if (clubErr) {
        setError("Could not create club: " + clubErr.message);
        setBusy(false);
        return;
      }

      const { error: coachErr } = await db.from("coaches").upsert({
        id: user.id,
        email,
        display_name: displayName,
        club_name: club.name,
        club_id: club.id,
        role: "admin",
      });
      if (coachErr) {
        setError("Club created but could not save your profile: " + coachErr.message);
        setBusy(false);
        return;
      }

      setInfo(`Club created! Your club code is ${code} — share this with your other coaches so they can join.`);
      await loadCoachProfile(user);
    } catch (e) {
      setError(String(e));
    }
    setBusy(false);
  }

  async function handleForgot(email) {
    clearMessages(); setBusy(true);
    const redirectTo = window.location.origin + window.location.pathname;
    const { error: forgotErr } = await db.auth.resetPasswordForEmail(email, { redirectTo });
    if (forgotErr) setError(forgotErr.message);
    else setInfo("Check your email for a password reset link.");
    setBusy(false);
  }

  async function handleSetNewPassword(newPassword) {
    clearMessages(); setBusy(true);
    const { error: updateErr } = await db.auth.updateUser({ password: newPassword });
    if (updateErr) { setError(updateErr.message); setBusy(false); return; }
    await db.auth.signOut();
    setInfo("Password updated — you can now log in.");
    setScreen("login");
    setBusy(false);
  }

  async function handleLogout() {
    await db.auth.signOut();
    setProfile(null);
    clearMessages();
    setScreen("login");
  }

  function goTo(next) {
    clearMessages();
    setScreen(next);
  }

  if (screen === "loading") {
    return <div className="center-screen"><span className="spinner-text">Loading…</span></div>;
  }
  if (screen === "login") {
    return <LoginScreen onLogin={handleLogin} onGoJoin={() => goTo("join")} onGoCreate={() => goTo("create")} onGoForgot={() => goTo("forgot")} busy={busy} error={error} info={info} />;
  }
  if (screen === "join") {
    return <JoinScreen onJoin={handleJoin} onBack={() => goTo("login")} busy={busy} error={error} info={info} />;
  }
  if (screen === "create") {
    return <CreateScreen onCreate={handleCreate} onBack={() => goTo("login")} busy={busy} error={error} info={info} />;
  }
  if (screen === "forgot") {
    return <ForgotScreen onSend={handleForgot} onBack={() => goTo("login")} busy={busy} error={error} info={info} />;
  }
  if (screen === "reset") {
    return <ResetScreen onSetNew={handleSetNewPassword} busy={busy} error={error} info={info} />;
  }
  if (screen === "home" && profile) {
    return <HomeScreen profile={profile} onLogout={handleLogout} onNavigate={goTo} />;
  }
  if (screen === "planned-games" && profile) {
    return (
      <PlannedGamesScreen
        clubId={profile.clubId}
        role={profile.role}
        onBack={() => goTo("home")}
        onOpenGameDay={g => { setGameDayId(g.id); goTo("game-day"); }}
        onCreateGame={() => goTo("create-game")}
      />
    );
  }
  if (screen === "create-game" && profile) {
    if (profile.role === "team_manager") {
      // Router-level backstop, matching the Android app's pattern — team
      // managers can't reach this via the UI anyway (button is hidden and
      // the games INSERT policy blocks them at the RLS level too), but this
      // covers it if that ever changes.
      return <HomeScreen profile={profile} onLogout={handleLogout} onNavigate={goTo} />;
    }
    return (
      <CreateGameScreen
        clubId={profile.clubId}
        onBack={() => goTo("planned-games")}
        onCreated={() => goTo("planned-games")}
      />
    );
  }
  if (screen === "game-day" && profile) {
    return (
      <GameDayScreen
        gameId={gameDayId}
        clubId={profile.clubId}
        coachId={profile.id}
        onBack={() => goTo("planned-games")}
      />
    );
  }
  return <div className="center-screen"><span className="spinner-text">Loading…</span></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  // The app source above is deliberately type="text/plain" (inert) rather than
  // type="text/babel", so we can control Babel's options explicitly here.
  // IMPORTANT: @babel/standalone's default JSX runtime is "automatic", which
  // compiles JSX into `import { jsx } from "react/jsx-runtime"` — a real ES
  // module import. That's meant for bundlers; loaded as a plain page (React
  // brought in as a global via a CDN <script>, not a module), it throws
  // "Cannot use import statement outside a module" and the whole app fails
  // silently (blank page). Forcing the "classic" runtime compiles JSX into
  // plain React.createElement(...) calls against the global React instead,
  // which works correctly in this plain-script, no-bundler setup.
  const appSource = document.getElementById("app-source").textContent;
  const compiled = Babel.transform(appSource, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  const script = document.createElement("script");
  script.text = compiled;
  document.body.appendChild(script);
</script>
</body>
