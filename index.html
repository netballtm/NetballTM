function LoadTeamsPlayersScreen({ clubId, onBack }) {
  const [players, setPlayers] = useState([]);
  const [seasons, setSeasons] = useState([]);
  const [loading, setLoading] = useState(true);
  const [pasteText, setPasteText] = useState("");
  const [addingPlayers, setAddingPlayers] = useState(false);
  const [seasonName, setSeasonName] = useState("");
  const [teamName, setTeamName] = useState("");
  const [addingSeason, setAddingSeason] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [infoMsg, setInfoMsg] = useState("");
  const [deletingSeasonId, setDeletingSeasonId] = useState(null);
  const [deletingPlayerId, setDeletingPlayerId] = useState(null);

  const loadAll = useCallback(async () => {
    const [playersRes, seasonsRes] = await Promise.all([
      db.from("players").select("*").eq("club_id", clubId).order("name", { ascending: true }),
      db.from("seasons").select("*").eq("club_id", clubId).order("name", { ascending: true }),
    ]);
    if (playersRes.error) setErrorMsg(playersRes.error.message);
    else setPlayers(playersRes.data || []);
    if (seasonsRes.error) setErrorMsg(seasonsRes.error.message);
    else setSeasons(seasonsRes.data || []);
    setLoading(false);
  }, [clubId]);

  useEffect(() => { loadAll(); }, [loadAll]);

  async function handleAddPlayers() {
    const names = pasteText.split("\n").map(n => n.trim()).filter(n => n.length > 0);
    if (names.length === 0) return;
    setAddingPlayers(true);
    setErrorMsg(""); setInfoMsg("");

    const existingLower = new Set(players.map(p => p.name.toLowerCase()));
    const seenThisBatch = new Set();
    const toInsert = [];
    const skipped = [];
    names.forEach(name => {
      const lower = name.toLowerCase();
      if (existingLower.has(lower) || seenThisBatch.has(lower)) { skipped.push(name); return; }
      seenThisBatch.add(lower);
      toInsert.push({ name, club_id: clubId, is_default_fill_in: false });
    });

    if (toInsert.length === 0) {
      setInfoMsg("Nothing to add — every name pasted is already a player.");
      setAddingPlayers(false);
      return;
    }

    const { error: insertErr } = await db.from("players").insert(toInsert);
    setAddingPlayers(false);
    if (insertErr) { setErrorMsg(insertErr.message); return; }

    setInfoMsg(
      "Added " + toInsert.length + " player" + (toInsert.length === 1 ? "" : "s") + "." +
      (skipped.length ? " Skipped " + skipped.length + " already on the roster: " + skipped.join(", ") + "." : "")
    );
    setPasteText("");
    await loadAll();
  }

  async function handleAddSeason() {
    if (!seasonName.trim()) return;
    setAddingSeason(true);
    setErrorMsg(""); setInfoMsg("");
    const { error: insertErr } = await db.from("seasons").insert({
      name: seasonName.trim(),
      team_name: teamName.trim() || null,
      club_id: clubId,
    });
    setAddingSeason(false);
    if (insertErr) { setErrorMsg(insertErr.message); return; }
    setInfoMsg("Added season \"" + seasonName.trim() + "\".");
    setSeasonName(""); setTeamName("");
    await loadAll();
  }

  // Deleting a season is only allowed once nothing references it any more —
  // games/training/registrations are checked first rather than cascading,
  // so a season's history can never be silently wiped by one click. If the
  // season really does need to go, the linked games/sessions/registrations
  // have to be removed first (or, for games, via Delete Game on Game
  // History / Upcoming Games).
  async function handleDeleteSeason(season) {
    setErrorMsg(""); setInfoMsg("");
    // Real incident, Sept 2026: this check originally missed
    // player_evaluations entirely, because Android can store an
    // evaluation's season_name as several season names joined together
    // (e.g. "Grading Winter 2026, Winter 2026") rather than one exact
    // match — so a season whose only remaining link was an evaluation like
    // that would sail through this guard undetected. It turned out fine
    // that time (the evaluation data itself was untouched — only the
    // season's own row went missing, breaking the picker), but the guard
    // should actually catch this rather than rely on being lucky again.
    // See evaluationCoversSeason for the same compound-name matching used
    // by the Player Evaluations / Evaluations report screens.
    const [gamesRes, trainingRes, regRes, evalRes] = await Promise.all([
      db.from("games").select("id", { count: "exact", head: true }).eq("club_id", clubId).eq("season_name", season.name),
      db.from("training_sessions").select("id", { count: "exact", head: true }).eq("club_id", clubId).eq("season", season.name),
      db.from("registrations").select("id", { count: "exact", head: true }).eq("club_id", clubId).eq("season_id", season.id),
      db.from("player_evaluations").select("season_name").eq("club_id", clubId),
    ]);
    const checkErr = gamesRes.error || trainingRes.error || regRes.error || evalRes.error;
    if (checkErr) { setErrorMsg(checkErr.message); return; }
    const gamesCount = gamesRes.count || 0;
    const trainingCount = trainingRes.count || 0;
    const regCount = regRes.count || 0;
    const evalCount = (evalRes.data || []).filter(e => evaluationCoversSeason(e.season_name, season.name)).length;
    if (gamesCount > 0 || trainingCount > 0 || regCount > 0 || evalCount > 0) {
      const parts = [];
      if (gamesCount > 0) parts.push(gamesCount + " game" + (gamesCount === 1 ? "" : "s"));
      if (trainingCount > 0) parts.push(trainingCount + " training session" + (trainingCount === 1 ? "" : "s"));
      if (regCount > 0) parts.push(regCount + " registration" + (regCount === 1 ? "" : "s"));
      if (evalCount > 0) parts.push(evalCount + " player evaluation" + (evalCount === 1 ? "" : "s"));
      setErrorMsg("Can't delete \"" + season.name + "\" — it still has " + parts.join(", ") + ". Remove those first (Delete Game on Game History, Delete Session on Training History, Delete on Player Evaluations) if this season really should go.");
      return;
    }
    if (!window.confirm("Delete season \"" + season.name + "\"? This can't be undone.")) return;
    setDeletingSeasonId(season.id);
    const { error: delErr } = await db.from("seasons").delete().eq("id", season.id).eq("club_id", clubId);
    setDeletingSeasonId(null);
    if (delErr) { setErrorMsg(delErr.message); return; }
    setInfoMsg("Deleted season \"" + season.name + "\".");
    await loadAll();
  }

  // Removing a player deletes their registrations, notes and evaluations
  // (nothing left dangling), but deliberately does NOT touch past games —
  // each completed game already stores its own players_snapshot/goals
  // independently, so historical results and stats stay exactly as they
  // were. This mirrors how the app already treats games as a permanent
  // record rather than a live join to the players table.
  async function handleDeletePlayer(player) {
    setErrorMsg(""); setInfoMsg("");
    if (!window.confirm("Remove " + player.name + " from the roster? Their registrations, notes and evaluations will be deleted. Past game results/goals already recorded for them are kept as-is.")) return;
    setDeletingPlayerId(player.id);
    const [regDel, notesDel, evalDel] = await Promise.all([
      db.from("registrations").delete().eq("club_id", clubId).eq("player_name", player.name),
      db.from("player_notes").delete().eq("club_id", clubId).eq("player_name", player.name),
      db.from("player_evaluations").delete().eq("club_id", clubId).eq("player_name", player.name),
    ]);
    const cleanupErr = regDel.error || notesDel.error || evalDel.error;
    if (cleanupErr) { setDeletingPlayerId(null); setErrorMsg(cleanupErr.message); return; }
    const { error: delErr } = await db.from("players").delete().eq("id", player.id).eq("club_id", clubId);
    setDeletingPlayerId(null);
    if (delErr) { setErrorMsg(delErr.message); return; }
    setInfoMsg("Removed " + player.name + " from the roster. Past game history is unaffected.");
    await loadAll();
  }

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={onBack}>&larr; Back to Home</a>
        <h1 className="page-title">Load Teams &amp; Players</h1>
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}
      {infoMsg && <div className="banner info" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{infoMsg}</div>}

      <div className="session-form" style={{ maxWidth: 560 }}>
        <div className="session-field">
          <label>Add Players</label>
          <textarea
            rows={8}
            placeholder={"Paste one player name per line, e.g.\nAddison Daly\nAlly Turner\nEllie Hatzis"}
            value={pasteText}
            onChange={e => setPasteText(e.target.value)}
          />
          <div className="muted-hint">
            Names already on the club's player list are skipped automatically — safe to paste the same list twice.
            {!loading && " Currently " + players.length + " player" + (players.length === 1 ? "" : "s") + " on the roster."}
          </div>
        </div>
        <div style={{ margin: "12px 0 28px 0" }}>
          <button className="primary" style={{ marginTop: 0, width: "auto" }} disabled={addingPlayers || !pasteText.trim()} onClick={handleAddPlayers}>
            {addingPlayers ? "Adding…" : "Add Players"}
          </button>
        </div>

        {!loading && players.length > 0 && (
          <div style={{ borderTop: "1px solid var(--border)", paddingTop: 20, marginBottom: 28 }}>
            <div className="muted-hint" style={{ marginBottom: 6 }}>Current players ({players.length}):</div>
            {players.map(p => (
              <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13.5, padding: "5px 0", borderBottom: "1px solid var(--border)" }}>
                <span>{p.name}</span>
                <button
                  className="secondary"
                  style={{ marginTop: 0, width: "auto", padding: "3px 10px", fontSize: 12 }}
                  disabled={deletingPlayerId === p.id}
                  onClick={() => handleDeletePlayer(p)}
                >
                  {deletingPlayerId === p.id ? "Removing…" : "Remove"}
                </button>
              </div>
            ))}
          </div>
        )}

        <div style={{ borderTop: "1px solid var(--border)", paddingTop: 20 }}>
          <div className="session-field">
            <label>Add a Season / Team</label>
            <input type="text" placeholder="Season name, e.g. Winter 2027" value={seasonName} onChange={e => setSeasonName(e.target.value)} />
          </div>
          <div className="session-field">
            <label>Team name (optional)</label>
            <input type="text" placeholder="e.g. U15 Violets" value={teamName} onChange={e => setTeamName(e.target.value)} />
          </div>
          <button className="primary" style={{ marginTop: 0, width: "auto" }} disabled={addingSeason || !seasonName.trim()} onClick={handleAddSeason}>
            {addingSeason ? "Adding…" : "Add Season"}
          </button>

          {!loading && seasons.length > 0 && (
            <div style={{ marginTop: 18 }}>
              <div className="muted-hint" style={{ marginBottom: 6 }}>Existing seasons:</div>
              {seasons.map(s => (
                <div key={s.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13.5, padding: "4px 0" }}>
                  <span>{s.name}{s.team_name ? " — " + s.team_name : ""}</span>
                  <button
                    className="secondary"
                    style={{ marginTop: 0, width: "auto", padding: "3px 10px", fontSize: 12 }}
                    disabled={deletingSeasonId === s.id}
                    onClick={() => handleDeleteSeason(s)}
                  >
                    {deletingSeasonId === s.id ? "Deleting…" : "Delete"}
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function RegistrationScreen({ clubId, onBack }) {
  const [seasons, setSeasons] = useState([]);
  const [seasonId, setSeasonId] = useState("");
  const [players, setPlayers] = useState([]);
  const [registeredNames, setRegisteredNames] = useState({});
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");

  useEffect(() => {
    (async () => {
      const [seasonsRes, playersRes] = await Promise.all([
        db.from("seasons").select("*").eq("club_id", clubId).order("name", { ascending: true }),
        db.from("players").select("*").eq("club_id", clubId).order("name", { ascending: true }),
      ]);
      if (seasonsRes.error) { setErrorMsg(seasonsRes.error.message); setLoading(false); return; }
      if (playersRes.error) { setErrorMsg(playersRes.error.message); setLoading(false); return; }
      setSeasons(seasonsRes.data || []);
      setPlayers(playersRes.data || []);
      if (seasonsRes.data && seasonsRes.data.length > 0) setSeasonId(seasonsRes.data[0].id);
      else setLoading(false);
    })();
  }, [clubId]);

  const loadRegistrations = useCallback(async () => {
    if (!seasonId) return;
    setLoading(true);
    setErrorMsg("");
    const { data, error: regErr } = await db
      .from("registrations")
      .select("player_name")
      .eq("club_id", clubId)
      .eq("season_id", seasonId);
    if (regErr) { setErrorMsg(regErr.message); setLoading(false); return; }
    const map = {};
    (data || []).forEach(r => { map[r.player_name] = true; });
    setRegisteredNames(map);
    setLoading(false);
  }, [clubId, seasonId]);

  useEffect(() => { loadRegistrations(); }, [loadRegistrations]);

  async function toggle(name) {
    if (saving) return;
    const isCurrentlyRegistered = !!registeredNames[name];
    setSaving(true);
    setErrorMsg("");
    if (isCurrentlyRegistered) {
      const { error: delErr } = await db.from("registrations")
        .delete()
        .eq("club_id", clubId)
        .eq("season_id", seasonId)
        .eq("player_name", name);
      setSaving(false);
      if (delErr) { setErrorMsg(delErr.message); return; }
      setRegisteredNames(prev => { const next = { ...prev }; delete next[name]; return next; });
    } else {
      // Deliberately does NOT write season_index — that legacy column is what
      // caused the original registrations ambiguity (see project notes) and
      // writing a guessed value into it here would just recreate the same
      // problem for new rows. If this insert fails because season_index turns
      // out to be a NOT NULL column with no default, the fix is a one-line
      // `ALTER TABLE registrations ALTER COLUMN season_index DROP NOT NULL;`
      // in the Supabase SQL Editor, not filling it in with a made-up value.
      const { error: insErr } = await db.from("registrations").insert({
        club_id: clubId,
        season_id: seasonId,
        player_name: name,
      });
      setSaving(false);
      if (insErr) { setErrorMsg(insErr.message); return; }
      setRegisteredNames(prev => ({ ...prev, [name]: true }));
    }
  }

  const activeSeason = seasons.find(s => s.id === seasonId);
  const registeredCount = Object.keys(registeredNames).length;

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={onBack}>&larr; Back to Home</a>
        <h1 className="page-title">Registration</h1>
      </div>

      {seasons.length > 1 && (
        <div className="season-select-row">
          <select className="season-select" value={seasonId} onChange={e => setSeasonId(e.target.value)}>
            {seasons.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </div>
      )}

      {!loading && activeSeason && (
        <div className="session-summary-row">
          <div className="quick-stat"><label>Registered</label>{registeredCount} / {players.length}</div>
          {activeSeason.team_name && <div className="quick-stat"><label>Team</label>{activeSeason.team_name}</div>}
        </div>
      )}

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : seasons.length === 0 ? (
        <div className="empty-note">No seasons set up yet — add one under "Load Teams &amp; Players".</div>
      ) : players.length === 0 ? (
        <div className="empty-note">No players on the club roster yet — add some under "Load Teams &amp; Players".</div>
      ) : (
        <div className="session-form" style={{ maxWidth: 560 }}>
          <RosterToggleList
            players={players.map(p => p.name)}
            selected={registeredNames}
            onToggle={toggle}
          />
        </div>
      )}
    </div>
  );
}

function StatsScreen({ clubId, onBack }) {
  const [seasons, setSeasons] = useState([]);
  const [seasonName, setSeasonName] = useState("");
  const [tab, setTab] = useState("games");
  const [games, setGames] = useState([]);
  const [players, setPlayers] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [errorMsg, setErrorMsg] = useState("");

  useEffect(() => {
    (async () => {
      const { data, error: seasonsErr } = await db.from("seasons").select("*").eq("club_id", clubId);
      if (seasonsErr) { setErrorMsg(seasonsErr.message); setLoading(false); return; }
      setSeasons(data || []);
      if (data && data.length > 0) setSeasonName(data[0].name);
      else setLoading(false);
    })();
  }, [clubId]);

  const loadStats = useCallback(async () => {
    if (!seasonName) return;
    setLoading(true);
    setErrorMsg("");
    const [gamesRes, playersRes, sessionsRes] = await Promise.all([
      db.from("games").select("*").eq("club_id", clubId).eq("season_name", seasonName).eq("is_completed", true),
      db.from("players").select("*").eq("club_id", clubId).order("name", { ascending: true }),
      db.from("training_sessions").select("*").eq("club_id", clubId).eq("season", seasonName),
    ]);
    const firstErr = gamesRes.error || playersRes.error || sessionsRes.error;
    if (firstErr) { setErrorMsg(firstErr.message); setLoading(false); return; }
    setGames(gamesRes.data || []);
    setPlayers(playersRes.data || []);
    setSessions(sessionsRes.data || []);
    setLoading(false);
  }, [clubId, seasonName]);

  useEffect(() => { loadStats(); }, [loadStats]);

  const playedGames = games.filter(g => !g.is_bye);
  const wins = playedGames.filter(g => g.our_score > g.opponent_score).length;
  const losses = playedGames.filter(g => g.our_score < g.opponent_score).length;
  const draws = playedGames.filter(g => g.our_score === g.opponent_score).length;
  const byes = games.length - playedGames.length;

  const goalsByPlayer = {};
  playedGames.forEach(g => {
    QUARTERS.forEach(q => {
      const qGoals = (g.goals_by_quarter && g.goals_by_quarter[q]) || {};
      Object.entries(qGoals).forEach(([name, val]) => {
        goalsByPlayer[name] = (goalsByPlayer[name] || 0) + (Number(val) || 0);
      });
    });
  });

  const gamesPlayedByPlayer = {};
  playedGames.forEach(g => {
    (g.players_snapshot || []).forEach(p => {
      if ((g.player_availability || {})[p.name] === false) return;
      gamesPlayedByPlayer[p.name] = (gamesPlayedByPlayer[p.name] || 0) + 1;
    });
  });

  const activeSessions = sessions.filter(s => !s.is_cancelled);
  const trainingByPlayer = {};
  activeSessions.forEach(s => {
    Object.entries(s.attendance || {}).forEach(([name, present]) => {
      if (!trainingByPlayer[name]) trainingByPlayer[name] = { attended: 0, total: 0 };
      trainingByPlayer[name].total += 1;
      if (present === true) trainingByPlayer[name].attended += 1;
    });
  });

  const topScorers = Object.entries(goalsByPlayer).sort((a, b) => b[1] - a[1]).slice(0, 5);

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={onBack}>&larr; Back to Home</a>
        <h1 className="page-title">Stats</h1>
      </div>

      {seasons.length > 1 && (
        <div className="season-select-row">
          <select className="season-select" value={seasonName} onChange={e => setSeasonName(e.target.value)}>
            {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
          </select>
        </div>
      )}

      <div className="quarter-tabs">
        <button className={"quarter-tab" + (tab === "games" ? " active" : "")} onClick={() => setTab("games")}>Games</button>
        <button className={"quarter-tab" + (tab === "players" ? " active" : "")} onClick={() => setTab("players")}>Players</button>
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : tab === "games" ? (
        games.length === 0 ? (
          <div className="empty-note">No completed games yet.</div>
        ) : (
          <React.Fragment>
            <div className="session-summary-row">
              <div className="quick-stat"><label>Wins</label>{wins}</div>
              <div className="quick-stat"><label>Losses</label>{losses}</div>
              <div className="quick-stat"><label>Draws</label>{draws}</div>
              {byes > 0 && <div className="quick-stat"><label>Byes</label>{byes}</div>}
            </div>
            <div className="game-list">
              {games.slice().sort((a, b) => a.round - b.round).map(g => {
                let resultLabel = "BYE", resultClass = "bye";
                if (!g.is_bye) {
                  if (g.our_score > g.opponent_score) { resultLabel = "W"; resultClass = "win"; }
                  else if (g.our_score < g.opponent_score) { resultLabel = "L"; resultClass = "loss"; }
                  else { resultLabel = "D"; resultClass = "draw"; }
                }
                return (
                  <div className="game-card" key={g.id}>
                    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                      <div className={"result-badge " + resultClass}>{resultLabel}</div>
                      <div>
                        <div className="round-line">Round {g.round}{g.is_bye ? " — BYE" : " vs " + g.opponent}</div>
                        {!g.is_bye && (
                          <div className="meta-line">{g.our_score} - {g.opponent_score}{g.game_date ? " · " + g.game_date : ""}</div>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </React.Fragment>
        )
      ) : players.length === 0 ? (
        <div className="empty-note">No players on the club roster yet.</div>
      ) : (
        <React.Fragment>
          {topScorers.length > 0 && (
            <div className="potm-section" style={{ maxWidth: 900 }}>
              <h3>Top Scorers</h3>
              {topScorers.map(([name, goals]) => (
                <div className="availability-row" key={name}><span>{name}</span><span>{goals}</span></div>
              ))}
            </div>
          )}
          <div className="game-list" style={{ maxWidth: 900 }}>
            {players.map(p => {
              const gp = gamesPlayedByPlayer[p.name] || 0;
              const goals = goalsByPlayer[p.name] || 0;
              const t = trainingByPlayer[p.name] || { attended: 0, total: 0 };
              const trainingPct = t.total > 0 ? Math.round((t.attended / t.total) * 100) : null;
              return (
                <div className="game-card" key={p.id}>
                  <div className="round-line">{p.name}</div>
                  <div style={{ display: "flex", gap: 16, fontSize: 13 }}>
                    <span>Games: {gp}</span>
                    <span>Goals: {goals}</span>
                    <span>Training: {trainingPct === null ? "—" : trainingPct + "%"}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// Report document shell + letterhead — rebuilt Sept 2026 after the first
// version (a coloured banner glued on top of the app's own dashboard-card
// styling) read as a screenshot with a header on it rather than an actual
// report. ReportDoc is the "page": a plain white sheet with sane margins
// (see .report-doc CSS) carrying --report-accent so every child rule/
// heading/table picks up the club's own primary_color without threading
// it through every component. ReportLetterhead is the logo+club name+
// report-type block with a coloured rule underneath, standing in for the
// Android app's branded PDF header.
function ReportDoc({ clubSettings, children }) {
  const accent = (clubSettings && clubSettings.primary_color) || null;
  return (
    <div className="report-doc" style={accent ? { "--report-accent": accent } : undefined}>
      {children}
    </div>
  );
}

function ReportLetterhead({ clubSettings, clubName, reportTitle, meta }) {
  return (
    <React.Fragment>
      <div className="report-letterhead">
        {clubSettings && clubSettings.logo_base64 && (
          <img src={"data:image/jpeg;base64," + clubSettings.logo_base64} alt="Club logo" className="report-letterhead-logo" />
        )}
        <div>
          <div className="report-letterhead-club">{clubName}</div>
          <div className="report-letterhead-title">{reportTitle}</div>
        </div>
      </div>
      {meta && <div className="report-meta">{meta}</div>}
    </React.Fragment>
  );
}

// Same colour-coding convention as the Android app's TrainingAttendancePdfExporter:
// green at 90%+, the club's own primary colour at 50%+, red below that.
function pctColor(pct, clubSettings) {
  if (pct === null || pct === undefined) return "var(--muted)";
  if (pct >= 90) return "var(--success)";
  if (pct >= 50) return (clubSettings && clubSettings.primary_color) || "var(--accent)";
  return "var(--danger)";
}

// Rating colour scale for the Evaluations report. Fixed Sept 2026 after
// comparing against a real app-exported evaluation PDF: the app's scale
// runs 1 = Exceptional ... 5 = Needs Improvement, i.e. LOWER is better —
// the opposite of what this originally assumed (which coloured every
// rating backwards). Green for 1-2, the club colour for 3, red for 4-5.
function ratingColor(value, clubSettings) {
  const n = Number(value);
  if (n <= 2) return "var(--success)";
  if (n >= 4) return "var(--danger)";
  return (clubSettings && clubSettings.primary_color) || "var(--accent)";
}

function SeasonReportView({ clubId, clubName, seasons, clubSettings }) {
  const [seasonName, setSeasonName] = useState(seasons[0].name);
  const [games, setGames] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [errorMsg, setErrorMsg] = useState("");

  const load = useCallback(async () => {
    setLoading(true);
    setErrorMsg("");
    const [gamesRes, sessionsRes] = await Promise.all([
      db.from("games").select("*").eq("club_id", clubId).eq("season_name", seasonName).eq("is_completed", true),
      db.from("training_sessions").select("*").eq("club_id", clubId).eq("season", seasonName),
    ]);
    if (gamesRes.error) { setErrorMsg(gamesRes.error.message); setLoading(false); return; }
    if (sessionsRes.error) { setErrorMsg(sessionsRes.error.message); setLoading(false); return; }
    setGames(gamesRes.data || []);
    setSessions(sessionsRes.data || []);
    setLoading(false);
  }, [clubId, seasonName]);

  useEffect(() => { load(); }, [load]);

  const playedGames = games.filter(g => !g.is_bye);
  const byes = games.length - playedGames.length;
  const wins = playedGames.filter(g => g.our_score > g.opponent_score).length;
  const losses = playedGames.filter(g => g.our_score < g.opponent_score).length;
  const draws = playedGames.filter(g => g.our_score === g.opponent_score).length;
  const goalsFor = playedGames.reduce((sum, g) => sum + (Number(g.our_score) || 0), 0);
  const goalsAgainst = playedGames.reduce((sum, g) => sum + (Number(g.opponent_score) || 0), 0);
  const activeSessions = sessions.filter(s => !s.is_cancelled);
  const avgAttendance = (() => {
    const rates = activeSessions.map(s => {
      const entries = Object.entries(s.attendance || {});
      if (entries.length === 0) return null;
      return entries.filter(([, v]) => v === true).length / entries.length;
    }).filter(r => r !== null);
    if (rates.length === 0) return null;
    return Math.round((rates.reduce((a, b) => a + b, 0) / rates.length) * 100);
  })();

  const goalsByPlayer = {};
  const potmCountByPlayer = {};
  playedGames.forEach(g => {
    QUARTERS.forEach(q => {
      const qGoals = (g.goals_by_quarter && g.goals_by_quarter[q]) || {};
      Object.entries(qGoals).forEach(([name, val]) => {
        goalsByPlayer[name] = (goalsByPlayer[name] || 0) + (Number(val) || 0);
      });
    });
    (g.players_of_match || []).forEach(name => {
      potmCountByPlayer[name] = (potmCountByPlayer[name] || 0) + 1;
    });
  });
  const topScorers = Object.entries(goalsByPlayer).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const potmLeaders = Object.entries(potmCountByPlayer).sort((a, b) => b[1] - a[1]);

  return (
    <div>
      <div className="season-select-row" style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <select className="season-select" value={seasonName} onChange={e => setSeasonName(e.target.value)}>
          {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
        </select>
        <button className="secondary no-print" onClick={() => window.print()}>Print / Save as PDF</button>
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : (
        <ReportDoc clubSettings={clubSettings}>
          <ReportLetterhead clubSettings={clubSettings} clubName={clubName} reportTitle="Season Report" meta={seasonName} />

          <div className="report-stat-strip">
            <div><label>Wins</label><span className="value">{wins}</span></div>
            <div><label>Losses</label><span className="value">{losses}</span></div>
            <div><label>Draws</label><span className="value">{draws}</span></div>
            {byes > 0 && <div><label>Byes</label><span className="value">{byes}</span></div>}
            <div>
              <label>Avg Training</label>
              <span className="value" style={{ color: pctColor(avgAttendance, clubSettings) }}>
                {avgAttendance === null ? "—" : avgAttendance + "%"}
              </span>
            </div>
          </div>
          <div className="report-stat-strip">
            <div><label>Goals For</label><span className="value">{goalsFor}</span></div>
            <div><label>Goals Against</label><span className="value">{goalsAgainst}</span></div>
            <div><label>Margin</label><span className="value">{goalsFor - goalsAgainst > 0 ? "+" : ""}{goalsFor - goalsAgainst}</span></div>
          </div>

          <div className="report-section-title">Game Results</div>
          {playedGames.length === 0 ? (
            <div className="report-empty">No completed games this season.</div>
          ) : (
            <table className="report-table">
              <thead><tr><th>Round</th><th>Opponent</th><th>Date</th><th className="num">Score</th></tr></thead>
              <tbody>
                {playedGames.slice().sort((a, b) => a.round - b.round).map(g => (
                  <tr key={g.id}>
                    <td>{g.round}</td>
                    <td>{g.opponent}</td>
                    <td>{g.game_date || "—"}</td>
                    <td className="num">{g.our_score} - {g.opponent_score}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}

          {topScorers.length > 0 && (
            <React.Fragment>
              <div className="report-section-title">Top Scorers</div>
              <table className="report-table">
                <tbody>
                  {topScorers.map(([name, goals]) => (
                    <tr key={name}><td>{name}</td><td className="num">{goals}</td></tr>
                  ))}
                </tbody>
              </table>
            </React.Fragment>
          )}

          {potmLeaders.length > 0 && (
            <React.Fragment>
              <div className="report-section-title">Player of the Match</div>
              <table className="report-table">
                <tbody>
                  {potmLeaders.map(([name, count]) => (
                    <tr key={name}><td>{name}</td><td className="num">{count}&times;</td></tr>
                  ))}
                </tbody>
              </table>
            </React.Fragment>
          )}

          <div className="report-section-title">Training</div>
          <div style={{ fontSize: 13 }}>
            {sessions.length} session{sessions.length === 1 ? "" : "s"} recorded, {sessions.length - activeSessions.length} cancelled.
          </div>

          <div className="report-footer">Generated {new Date().toLocaleDateString()} · {clubName}</div>
        </ReportDoc>
      )}
    </div>
  );
}

function GameReportView({ clubId, clubName, seasons, clubSettings }) {
  const [seasonName, setSeasonName] = useState(seasons[0].name);
  const [games, setGames] = useState([]);
  const [gameId, setGameId] = useState("");
  const [loading, setLoading] = useState(true);
  const [errorMsg, setErrorMsg] = useState("");
  const [potmPhotoUrls, setPotmPhotoUrls] = useState({});

  const load = useCallback(async () => {
    setLoading(true);
    setErrorMsg("");
    const { data, error: gamesErr } = await db
      .from("games")
      .select("*")
      .eq("club_id", clubId)
      .eq("season_name", seasonName)
      .eq("is_completed", true)
      .eq("is_bye", false)
      .order("round", { ascending: true });
    if (gamesErr) { setErrorMsg(gamesErr.message); setLoading(false); return; }
    const rows = data || [];
    setGames(rows);
    setGameId(rows.length > 0 ? rows[0].id : "");
    setLoading(false);
  }, [clubId, seasonName]);

  useEffect(() => { load(); }, [load]);

  const game = games.find(g => g.id === gameId);

  // Resolve any stored POTM photo paths to short-lived signed URLs whenever
  // the selected game changes — same convention GameDayScreen uses.
  useEffect(() => {
    let cancelled = false;
    setPotmPhotoUrls({});
    if (!game || !game.potm_photos) return;
    const entries = Object.entries(game.potm_photos);
    if (entries.length === 0) return;
    (async () => {
      const urls = {};
      await Promise.all(entries.map(async ([name, path]) => {
        const { data: signed } = await db.storage.from("potm-photos").createSignedUrl(path, 3600);
        if (signed && signed.signedUrl) urls[name] = signed.signedUrl;
      }));
      if (!cancelled) setPotmPhotoUrls(urls);
    })();
    return () => { cancelled = true; };
  }, [game && game.id]);

  return (
    <div>
      <div className="season-select-row" style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <select className="season-select" value={seasonName} onChange={e => setSeasonName(e.target.value)}>
          {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
        </select>
        {games.length > 0 && (
          <select className="season-select" value={gameId} onChange={e => setGameId(e.target.value)}>
            {games.map(g => <option key={g.id} value={g.id}>Round {g.round} vs {g.opponent}</option>)}
          </select>
        )}
        {game && <button className="secondary no-print" onClick={() => window.print()}>Print / Save as PDF</button>}
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : !game ? (
        <div className="empty-note">No completed games for this season yet.</div>
      ) : (
        <ReportDoc clubSettings={clubSettings}>
          <ReportLetterhead
            clubSettings={clubSettings}
            clubName={clubName}
            reportTitle="Game Report"
            meta={seasonName + " · Round " + game.round + " vs " + game.opponent + (game.game_date ? " · " + game.game_date : "")
              + " · " + (game.our_score > game.opponent_score ? "WIN" : game.our_score < game.opponent_score ? "LOSS" : "DRAW")}
          />

          <div className="report-stat-strip">
            <div><label>Our Score</label><span className="value">{game.our_score}</span></div>
            <div><label>Their Score</label><span className="value">{game.opponent_score}</span></div>
            <div><label>Turnovers</label><span className="value">{QUARTERS.reduce((sum, q) => sum + (Number((game.turnovers_by_quarter || {})[q]) || 0), 0)}</span></div>
            <div><label>Player of Match</label><span className="value">{(game.players_of_match || []).length}</span></div>
          </div>

          <div className="report-section-title">Goals by Player</div>
          {(() => {
            const totals = {};
            QUARTERS.forEach(q => {
              Object.entries((game.goals_by_quarter && game.goals_by_quarter[q]) || {}).forEach(([n, v]) => {
                totals[n] = (totals[n] || 0) + (Number(v) || 0);
              });
            });
            const rows = Object.entries(totals).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
            return rows.length === 0 ? (
              <div className="report-empty">No goals recorded.</div>
            ) : (
              <table className="report-table">
                <tbody>
                  {rows.map(([name, goals]) => (
                    <tr key={name}><td>{name}</td><td className="num">{goals}</td></tr>
                  ))}
                </tbody>
              </table>
            );
          })()}

          <div className="report-section-title">By Quarter</div>
          <table className="report-table">
            <thead><tr><th>Qtr</th><th className="num">Score</th><th className="num">Turnovers</th><th>Scorers</th><th>Notes</th></tr></thead>
            <tbody>
              {QUARTERS.map(q => {
                const qGoals = (game.goals_by_quarter && game.goals_by_quarter[q]) || {};
                const scorers = Object.entries(qGoals).filter(([, v]) => Number(v) > 0);
                const ourQ = scorers.reduce((sum, [, v]) => sum + Number(v), 0);
                const oppQ = (game.opponent_goals_by_quarter && game.opponent_goals_by_quarter[q]) || 0;
                const turnoversQ = (game.turnovers_by_quarter && game.turnovers_by_quarter[q]) || 0;
                const noteQ = (game.quarter_notes && game.quarter_notes[q]) || "";
                return (
                  <tr key={q}>
                    <td>{q}</td>
                    <td className="num">{ourQ} - {oppQ}</td>
                    <td className="num">{turnoversQ || "—"}</td>
                    <td>{scorers.length > 0 ? scorers.map(([n, v]) => n + " (" + v + ")").join(", ") : "—"}</td>
                    <td>{noteQ || "—"}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>

          <div className="report-section-title">Quarter Results</div>
          <div className="report-pill-row">
            {QUARTERS.map(q => {
              const qGoals = (game.goals_by_quarter && game.goals_by_quarter[q]) || {};
              const ourQ = Object.values(qGoals).reduce((sum, v) => sum + (Number(v) || 0), 0);
              const oppQ = Number((game.opponent_goals_by_quarter || {})[q]) || 0;
              const result = ourQ > oppQ ? "WIN" : ourQ < oppQ ? "LOSS" : "DRAW";
              const color = result === "WIN" ? "var(--success)" : result === "LOSS" ? "var(--danger)" : "var(--muted)";
              return (
                <span key={q} className="report-pill" style={{ background: color + "1F", color: color }}>
                  Q{q} {result}
                </span>
              );
            })}
          </div>

          {(game.players_snapshot || []).length > 0 && (
            <React.Fragment>
              <div className="report-section-title">Positions by Quarter</div>
              <table className="report-table">
                <thead>
                  <tr>
                    <th>Player</th>
                    {QUARTERS.map(q => <th key={q}>Q{q}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {(game.players_snapshot || []).map(p => (
                    <tr key={p.name}>
                      <td>{p.name}{p.wasFillIn ? <span className="muted-hint"> (fill-in)</span> : null}</td>
                      {QUARTERS.map(q => {
                        const code = ((game.positions_by_quarter || {})[q] || {})[p.name];
                        return <td key={q}>{code ? <PositionBadge code={code} /> : "—"}</td>;
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </React.Fragment>
          )}

          {(game.players_of_match || []).length > 0 && (
            <React.Fragment>
              <div className="report-section-title">Player of the Match</div>
              {(game.players_of_match || []).map(name => (
                <div key={name} className="potm-card">
                  {potmPhotoUrls[name] && (
                    <img src={potmPhotoUrls[name]} alt={name + " photo"} className="potm-card-photo" />
                  )}
                  <div>
                    <div className="potm-card-name">{name}</div>
                    <div className="potm-card-meta">Round {game.round} vs {game.opponent}</div>
                    {(game.potm_comments || {})[name] && (
                      <div className="potm-card-quote">&ldquo;{game.potm_comments[name]}&rdquo;</div>
                    )}
                  </div>
                </div>
              ))}
            </React.Fragment>
          )}

          <div className="report-footer">Generated {new Date().toLocaleDateString()} · {clubName}</div>
        </ReportDoc>
      )}
    </div>
  );
}

    const [gamesRes, sessionsRes, notesRes] = await Promise.all([
      db.from("games").select("*").eq("club_id", clubId).eq("season_name", seasonName).eq("is_completed", true),
      db.from("training_sessions").select("*").eq("club_id", clubId).eq("season", seasonName),
      db.from("player_notes").select("*").eq("club_id", clubId).eq("player_name", playerName),
    ]);
    if (gamesRes.error) { setErrorMsg(gamesRes.error.message); setLoading(false); return; }
    if (sessionsRes.error) { setErrorMsg(sessionsRes.error.message); setLoading(false); return; }
    if (notesRes.error) { setErrorMsg(notesRes.error.message); setLoading(false); return; }
    setGames(gamesRes.data || []);
    setSessions(sessionsRes.data || []);
    // player_notes.season_name can be a compound "SeasonA, SeasonB" string
    // just like player_evaluations — see evaluationCoversSeason — so this
    // must never be filtered with a plain .eq() either.
    setNote((notesRes.data || []).find(n => evaluationCoversSeason(n.season_name, seasonName)) || null);
    setLoading(false);
  }, [clubId, seasonName, playerName]);

  useEffect(() => { load(); }, [load]);

  // Resolve any POTM photo(s) for this player across whichever games they
  // were named Player of the Match in this season — a different photo can
  // be stored per game. Kept above the players.length guard below so hook
  // order stays stable regardless of roster size.
  useEffect(() => {
    let cancelled = false;
    setPotmPhotoUrls({});
    const targets = games
      .filter(g => (g.players_of_match || []).includes(playerName) && g.potm_photos && g.potm_photos[playerName])
      .map(g => ({ gameId: g.id, path: g.potm_photos[playerName] }));
    if (targets.length === 0) return;
    (async () => {
      const urls = {};
      await Promise.all(targets.map(async ({ gameId, path }) => {
        const { data: signed } = await db.storage.from("potm-photos").createSignedUrl(path, 3600);
        if (signed && signed.signedUrl) urls[gameId] = signed.signedUrl;
      }));
      if (!cancelled) setPotmPhotoUrls(urls);
    })();
    return () => { cancelled = true; };
  }, [games, playerName]);

  if (players.length === 0) {
    return <div className="empty-note">No players on the club roster yet.</div>;
  }

  const playerGames = games.filter(g => !g.is_bye && (g.players_snapshot || []).some(p => p.name === playerName));
  const gamesGoals = playerGames.map(g => {
    let goals = 0;
    const byQuarter = {};
    QUARTERS.forEach(q => {
      const qGoals = Number(((g.goals_by_quarter && g.goals_by_quarter[q]) || {})[playerName]) || 0;
      byQuarter[q] = qGoals;
      goals += qGoals;
    });
    const wasAvailable = (g.player_availability || {})[playerName] !== false;
    const wasPotm = (g.players_of_match || []).includes(playerName);
    return { game: g, goals, byQuarter, wasAvailable, wasPotm };
  });
  // "Games Played" counts every game this player appears on the roster
  // for (same basis as the court-time/quarters figures below), not just
  // the ones where an explicit availability flag is true — see the note
  // sent alongside this report about a games-played count that still
  // doesn't match the app's PDF for at least one player, pending Allan
  // confirming how the app itself defines this figure.
  const gamesPlayedCount = playerGames.length;
  const totalGoals = gamesGoals.reduce((sum, x) => sum + x.goals, 0);
  const potmGames = gamesGoals.filter(x => x.wasPotm);
  const potmCount = potmGames.length;
  const bestGame = gamesGoals.reduce((best, x) => (!best || x.goals > best.goals) ? x : best, null);
  const goalsPerGame = gamesPlayedCount > 0 ? (totalGoals / gamesPlayedCount) : 0;

  const activeSessions = sessions.filter(s => !s.is_cancelled);
  const attendedCount = activeSessions.filter(s => (s.attendance || {})[playerName] === true).length;
  const trainingPct = activeSessions.length > 0 ? Math.round((attendedCount / activeSessions.length) * 100) : null;

  // Court-time / position breakdown, straight off positions_by_quarter.
  // Every quarter this player appears in a game's positions_by_quarter
  // object counts as "available"; a code other than "OFF" counts as
  // on-court. Mirrors the app's Player Report court-time % and position
  // summary.
  const positionTotals = {};
  COURT_CODES.forEach(code => { positionTotals[code] = 0; });
  let onCourtQuarters = 0;
  let availableQuarters = 0;
  const q1Counts = {};
  playerGames.forEach(g => {
    const pbq = g.positions_by_quarter || {};
    QUARTERS.forEach(q => {
      const qPositions = pbq[q] || {};
      if (!(playerName in qPositions)) return;
      availableQuarters++;
      const code = qPositions[playerName];
      if (code && COURT_CODES.indexOf(code) !== -1) {
        onCourtQuarters++;
        positionTotals[code]++;
        if (q === "1") q1Counts[code] = (q1Counts[code] || 0) + 1;
      }
    });
  });
  const offQuarters = availableQuarters - onCourtQuarters;
  const courtTimePct = availableQuarters > 0 ? Math.round((onCourtQuarters / availableQuarters) * 100) : null;
  const positionSummary = onCourtQuarters > 0
    ? Object.entries(positionTotals)
        .filter(([, count]) => count > 0)
        .sort((a, b) => b[1] - a[1])
        .map(([code, count]) => [code, Math.round((count / onCourtQuarters) * 100)])
    : [];
  const startingPositionEntry = Object.entries(q1Counts).sort((a, b) => b[1] - a[1])[0] || null;
  const gamesAvailable = availableQuarters / 4;
  const startingPositionPct = startingPositionEntry && gamesAvailable > 0
    ? Math.round((startingPositionEntry[1] / gamesAvailable) * 100)
    : null;

  return (
    <div>
      <div className="season-select-row" style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <select className="season-select" value={seasonName} onChange={e => setSeasonName(e.target.value)}>
          {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
        </select>
        <select className="season-select" value={playerName} onChange={e => setPlayerName(e.target.value)}>
          {players.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
        </select>
        <button className="secondary no-print" onClick={() => window.print()}>Print / Save as PDF</button>
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : (
        <ReportDoc clubSettings={clubSettings}>
          <ReportLetterhead clubSettings={clubSettings} clubName={clubName} reportTitle="Player Report" meta={playerName + " · " + seasonName} />

          <div className="report-stat-strip">
            <div><label>Games Played</label><span className="value">{gamesPlayedCount}</span></div>
            <div><label>Quarters on Court</label><span className="value">{onCourtQuarters}</span></div>
            <div><label>Goals</label><span className="value">{totalGoals}</span></div>
            <div><label>Player of the Match</label><span className="value">{potmCount}&times;</span></div>
          </div>
          {bestGame && bestGame.goals > 0 && (
            <div className="muted-hint" style={{ margin: "8px 0 4px 0" }}>
              Best game: {bestGame.goals} goals vs {bestGame.game.opponent} (Round {bestGame.game.round})
            </div>
          )}

          <div className="report-section-title">Performance</div>
          <div className="report-bar-row">
            <span>Court time <span className="muted-hint">({onCourtQuarters} of {availableQuarters} quarters · {Math.round(gamesAvailable)} games available)</span></span>
            <span className="value" style={{ color: pctColor(courtTimePct, clubSettings) }}>{courtTimePct === null ? "—" : courtTimePct + "%"}</span>
          </div>
          <div className="report-bar-track">
            <div className="report-bar-fill" style={{ width: (courtTimePct || 0) + "%", background: pctColor(courtTimePct, clubSettings) }}></div>
          </div>

          <div className="report-bar-row" style={{ marginTop: 12 }}>
            <span>Training attendance <span className="muted-hint">({attendedCount} of {activeSessions.length} sessions)</span></span>
            <span className="value" style={{ color: pctColor(trainingPct, clubSettings) }}>{trainingPct === null ? "—" : trainingPct + "%"}</span>
          </div>
          <div className="report-bar-track">
            <div className="report-bar-fill" style={{ width: (trainingPct || 0) + "%", background: pctColor(trainingPct, clubSettings) }}></div>
          </div>

          <div className="report-stat-grid">
            <div><label>Total Goals</label><span className="value">{totalGoals}</span></div>
            <div><label>Goals per Game</label><span className="value">{goalsPerGame.toFixed(1)}</span></div>
            <div><label>Player of the Match</label><span className="value">{potmCount}&times;</span></div>
            <div>
              <label>Starting Position</label>
              <span className="value">{startingPositionEntry ? startingPositionEntry[0] + " · " + startingPositionPct + "%" : "—"}</span>
            </div>
          </div>

          {positionSummary.length > 0 && (
            <React.Fragment>
              <div className="muted-hint" style={{ margin: "10px 0 4px 0" }}>Position summary</div>
              <div className="report-pill-row">
                {positionSummary.map(([code, pct]) => {
                  const color = POSITION_COLORS[code] || POSITION_COLORS.OFF;
                  return <span key={code} className="report-pill" style={{ background: color + "1F", color: color }}>{code} · {pct}%</span>;
                })}
              </div>
            </React.Fragment>
          )}

          {onCourtQuarters + offQuarters > 0 && (
            <React.Fragment>
              <div className="report-section-title">Quarter by Quarter</div>
              <table className="report-table">
                <thead><tr><th>Position</th><th className="num">Q1</th><th className="num">Q2</th><th className="num">Q3</th><th className="num">Q4</th><th className="num">Tot</th><th className="num">%</th></tr></thead>
                <tbody>
                  {(() => {
                    const rows = [];
                    COURT_CODES.forEach(code => {
                      let total = 0;
                      const perQ = QUARTERS.map(q => {
                        let c = 0;
                        playerGames.forEach(g => { if (((g.positions_by_quarter || {})[q] || {})[playerName] === code) c++; });
                        total += c;
                        return c;
                      });
                      rows.push(
                        <tr key={code}>
                          <td><PositionBadge code={code} /> {POSITION_LABELS[code]}</td>
                          {perQ.map((c, i) => <td key={i} className="num">{c}</td>)}
                          <td className="num">{total}</td>
                          <td className="num">{onCourtQuarters > 0 ? Math.round((total / onCourtQuarters) * 100) + "%" : "0%"}</td>
                        </tr>
                      );
                    });
                    const offPerQ = QUARTERS.map((q) => {
                      let c = 0;
                      playerGames.forEach(g => {
                        const qPositions = (g.positions_by_quarter || {})[q] || {};
                        if (playerName in qPositions && (!qPositions[playerName] || COURT_CODES.indexOf(qPositions[playerName]) === -1)) c++;
                      });
                      return c;
                    });
                    rows.push(
                      <tr key="OFF">
                        <td className="muted-hint">Off court</td>
                        {offPerQ.map((c, i) => <td key={i} className="num muted-hint">{c}</td>)}
                        <td className="num muted-hint">{offQuarters}</td>
                        <td className="num muted-hint">—</td>
                      </tr>
                    );
                    return rows;
                  })()}
                </tbody>
              </table>
            </React.Fragment>
          )}

          <div className="report-section-title">Coach Notes</div>
          <div className="report-notes-grid">
            <div className="report-notes-panel">
              <h4>Performance Overview</h4>
              <p>{(note && note.performance_overview) || <span className="muted-hint">No notes recorded.</span>}</p>
            </div>
            <div className="report-notes-panel">
              <h4>Strengths</h4>
              <p>{(note && note.strengths) || <span className="muted-hint">No notes recorded.</span>}</p>
            </div>
            <div className="report-notes-panel">
              <h4>Focus Areas</h4>
              <p>{(note && note.focus_areas) || <span className="muted-hint">No notes recorded.</span>}</p>
            </div>
          </div>

          {potmGames.length > 0 && (
            <React.Fragment>
              <div className="report-section-title">Player of the Match</div>
              {potmGames.slice().sort((a, b) => a.game.round - b.game.round).map(({ game }) => (
                <div key={game.id} className="potm-card">
                  {potmPhotoUrls[game.id] && (
                    <img src={potmPhotoUrls[game.id]} alt={playerName + " photo"} className="potm-card-photo" />
                  )}
                  <div>
                    <div className="potm-card-name">Round {game.round} vs {game.opponent}</div>
                    {(game.potm_comments || {})[playerName] && (
                      <div className="potm-card-quote">&ldquo;{game.potm_comments[playerName]}&rdquo;</div>
                    )}
                  </div>
                </div>
              ))}
            </React.Fragment>
          )}

          <div className="report-section-title">Game Log</div>
          {gamesGoals.length === 0 ? (
            <div className="report-empty">No games recorded for this player this season.</div>
          ) : (
            <table className="report-table">
              <thead><tr><th>Round</th><th>Opponent</th><th>Status</th><th className="num">Goals</th><th>By Quarter</th></tr></thead>
              <tbody>
                {gamesGoals.slice().sort((a, b) => a.game.round - b.game.round).map(({ game, goals, byQuarter, wasAvailable, wasPotm }) => (
                  <tr key={game.id}>
                    <td>{game.round}</td>
                    <td>{game.opponent}</td>
                    <td>{!wasAvailable ? "Unavailable" : wasPotm ? "POTM ⭐" : "—"}</td>
                    <td className="num">{goals > 0 ? goals : "—"}</td>
                    <td>{goals > 0 ? QUARTERS.map(q => "Q" + q + ": " + (byQuarter[q] || 0)).join("  ·  ") : "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}

          <div className="report-footer">Generated {new Date().toLocaleDateString()} · {clubName}</div>
        </ReportDoc>
      )}
    </div>
  );
}

// Evaluations report — a printable table mirroring the Android app's
// EvaluationPdfExporter column order (Player, the five 1-5 ratings,
// Training %, Games %, Skill Level, Position(s), Next Season, Comments),
// built once Player Evaluations itself existed. Reuses the confirmed
// player_evaluations schema directly — no new queries beyond what the
// Player Evaluations screen already uses.
function EvaluationReportView({ clubId, clubName, seasons, clubSettings }) {
  const [seasonName, setSeasonName] = useState(seasons[0].name);
  const [evaluations, setEvaluations] = useState([]);
  const [loading, setLoading] = useState(true);
  const [errorMsg, setErrorMsg] = useState("");

  const load = useCallback(async () => {
    setLoading(true);
    setErrorMsg("");
    // See evaluationCoversSeason above — an evaluation covering this season
    // may be stored under a compound "SeasonA, SeasonB" season_name, which
    // a plain .eq() would miss entirely. Fetch all for the club and filter
    // client-side instead, same fix as Player Evaluations.
    const { data, error: evalErr } = await db
      .from("player_evaluations")
      .select("*")
      .eq("club_id", clubId);
    if (evalErr) { setErrorMsg(evalErr.message); setLoading(false); return; }
    const forThisSeason = (data || [])
      .filter(e => evaluationCoversSeason(e.season_name, seasonName))
      .sort((a, b) => a.player_name.localeCompare(b.player_name));
    setEvaluations(forThisSeason);
    setLoading(false);
  }, [clubId, seasonName]);

  useEffect(() => { load(); }, [load]);

  const fmtPct = (attended, total) => {
    if (!total) return "—";
    return Math.round((attended / total) * 100) + "% (" + attended + "/" + total + ")";
  };
  const fmtEvalDate = (d) => {
    if (!d) return null;
    const parsed = new Date(d);
    return isNaN(parsed.getTime()) ? d : parsed.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  };

  // Coach name and evaluation date live on each row, not on the season as
  // a whole, but in practice a coach evaluates a whole age group in one
  // sitting — so when every row agrees, show it once in the header like
  // the app's exporter does; otherwise leave it off rather than guess
  // which one belongs in a single header line.
  const uniqueCoaches = Array.from(new Set(evaluations.map(e => e.coach_name).filter(Boolean)));
  const uniqueDates = Array.from(new Set(evaluations.map(e => e.evaluation_date).filter(Boolean)));
  const metaExtra = [];
  if (uniqueCoaches.length === 1) metaExtra.push("Coach: " + uniqueCoaches[0]);
  if (uniqueDates.length === 1) metaExtra.push("Evaluated " + fmtEvalDate(uniqueDates[0]));
  const meta = seasonName + (metaExtra.length > 0 ? " · " + metaExtra.join(" · ") : "");

  const evaluationsWithComments = evaluations.filter(ev => (ev.comments || "").trim().length > 0);

  return (
    <div>
      <div className="season-select-row" style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <select className="season-select" value={seasonName} onChange={e => setSeasonName(e.target.value)}>
          {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
        </select>
        {evaluations.length > 0 && <button className="secondary no-print" onClick={() => window.print()}>Print / Save as PDF</button>}
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : (
        <ReportDoc clubSettings={clubSettings}>
          <ReportLetterhead clubSettings={clubSettings} clubName={clubName} reportTitle="Player Evaluations" meta={meta} />

          {evaluations.length === 0 ? (
            <div className="report-empty">No evaluations recorded for this season yet — add some under "Player Evaluations".</div>
          ) : (
            <React.Fragment>
              {/* Matches the app's actual rating scale — 1 = Exceptional,
                  5 = Needs Improvement, i.e. LOWER is better — confirmed
                  against a real app-exported evaluation PDF Sept 2026. */}
              <div className="report-legend">
                <span><span className="dot" style={{ background: "var(--success)" }}></span> 1 Exceptional</span>
                <span><span className="dot" style={{ background: "var(--success)" }}></span> 2 Very Good</span>
                <span><span className="dot" style={{ background: (clubSettings && clubSettings.primary_color) || "var(--accent)" }}></span> 3 Average</span>
                <span><span className="dot" style={{ background: "var(--danger)" }}></span> 4 Poor</span>
                <span><span className="dot" style={{ background: "var(--danger)" }}></span> 5 Needs Improvement</span>
              </div>
              <table className="report-table">
                <thead>
                  <tr>
                    <th>Player</th>
                    <th>Ball Skills</th>
                    <th>Attacking</th>
                    <th>Defense</th>
                    <th>Perception</th>
                    <th>Footwork</th>
                    <th>Training %</th>
                    <th>Games %</th>
                    <th>Skill Level</th>
                    <th>Position(s)</th>
                    <th>Next Season</th>
                  </tr>
                </thead>
                <tbody>
                  {evaluations.map(ev => (
                    <tr key={ev.id}>
                      <td>
                        {ev.player_name}
                        {ev.season_name !== seasonName && (
                          <div className="muted-hint">also covers: {ev.season_name.split(",").map(s => s.trim()).filter(s => s !== seasonName).join(", ")}</div>
                        )}
                        {(uniqueCoaches.length > 1 || uniqueDates.length > 1) && (
                          <div className="muted-hint">
                            {ev.coach_name}{ev.evaluation_date ? " · " + fmtEvalDate(ev.evaluation_date) : ""}
                          </div>
                        )}
                      </td>
                      <td className="rating" style={{ color: ratingColor(ev.ball_skills, clubSettings) }}>{ev.ball_skills}</td>
                      <td className="rating" style={{ color: ratingColor(ev.attacking, clubSettings) }}>{ev.attacking}</td>
                      <td className="rating" style={{ color: ratingColor(ev.defense, clubSettings) }}>{ev.defense}</td>
                      <td className="rating" style={{ color: ratingColor(ev.perception, clubSettings) }}>{ev.perception}</td>
                      <td className="rating" style={{ color: ratingColor(ev.footwork, clubSettings) }}>{ev.footwork}</td>
                      <td>{fmtPct(ev.training_attendance, ev.training_total)}</td>
                      <td>{fmtPct(ev.game_attendance, ev.game_total)}</td>
                      <td>{ev.skill_level}</td>
                      <td>{ev.main_positions}</td>
                      <td>{ev.next_season}</td>
                    </tr>
                  ))}
                </tbody>
              </table>

              {/* Comments were previously a table column, but at 12 columns wide
                  it silently ran off the printed page — the exact "cut off"
                  problem Allan flagged. Shown here in full instead, where they
                  can wrap and always print. */}
              {evaluationsWithComments.length > 0 && (
                <React.Fragment>
                  <div className="report-section-title">Comments</div>
                  {evaluationsWithComments.map(ev => (
                    <div key={ev.id} className="report-comment-block">
                      <div className="name">{ev.player_name}</div>
                      <p>{ev.comments}</p>
                    </div>
                  ))}
                </React.Fragment>
              )}

              <div className="report-section-title">Skill Definitions</div>
              <div className="report-skill-defs">
                <div><strong>Ball Skills:</strong> Catching effectively; passing accurately; using a variety of passes in appropriate situations; using more advanced skills such as baulking; one hand control and passing on either side.</div>
                <div><strong>Attacking:</strong> Moving into or creating space with basic leads; dodges and changes of direction; using a variety/combination of attacking moves; awareness of space; shooting action and accuracy; advanced skills such as double dodge, half and full roll, front cut.</div>
                <div><strong>Defense:</strong> Recovering to 3 feet; getting hands over the ball; shadowing effectively; effective footwork; body control and positioning; defending from front, side and back; defending the shot; anticipating and positioning for intercepts; communicating, switching with and covering teammates.</div>
                <div><strong>Perception/Cognition:</strong> Awareness of space, players, ball and game situations; on-court decision-making; timing of movement and pass release; pass selection; reading the play; concentration; performance under game pressure.</div>
                <div><strong>Footwork:</strong> Balanced landing and moving; demonstrating good body control; changing direction effectively and appropriately.</div>
              </div>
            </React.Fragment>
          )}

          <div className="report-footer">Generated {new Date().toLocaleDateString()} · {clubName}</div>
        </ReportDoc>
      )}
    </div>
  );
}

function ReportsScreen({ clubId, clubName, onBack }) {
  const [tab, setTab] = useState("season");
  const [seasons, setSeasons] = useState([]);
  const [players, setPlayers] = useState([]);
  const [clubSettings, setClubSettings] = useState(null);
  const [loading, setLoading] = useState(true);
  const [errorMsg, setErrorMsg] = useState("");

  useEffect(() => {
    (async () => {
      const [seasonsRes, playersRes, settingsRes] = await Promise.all([
        db.from("seasons").select("*").eq("club_id", clubId).order("name", { ascending: true }),
        db.from("players").select("*").eq("club_id", clubId).order("name", { ascending: true }),
        db.from("club_settings").select("*").eq("club_id", clubId).maybeSingle(),
      ]);
      if (seasonsRes.error) { setErrorMsg(seasonsRes.error.message); setLoading(false); return; }
      if (playersRes.error) { setErrorMsg(playersRes.error.message); setLoading(false); return; }
      // club_settings may not have a row yet (never saved) — that's fine,
      // ReportDoc/ReportLetterhead/pctColor all fall back cleanly to generic colours.
      if (!settingsRes.error) setClubSettings(settingsRes.data || null);
      setSeasons(seasonsRes.data || []);
      setPlayers(playersRes.data || []);
      setLoading(false);
    })();
  }, [clubId]);

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={onBack}>&larr; Back to Home</a>
        <h1 className="page-title">Reports</h1>
      </div>

      <div className="quarter-tabs">
        <button className={"quarter-tab" + (tab === "season" ? " active" : "")} onClick={() => setTab("season")}>Season Report</button>
        <button className={"quarter-tab" + (tab === "game" ? " active" : "")} onClick={() => setTab("game")}>Game Report</button>
        <button className={"quarter-tab" + (tab === "player" ? " active" : "")} onClick={() => setTab("player")}>Player Report</button>
        <button className={"quarter-tab" + (tab === "evaluations" ? " active" : "")} onClick={() => setTab("evaluations")}>Evaluations</button>
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : seasons.length === 0 ? (
        <div className="empty-note">No seasons set up yet — add one under "Load Teams &amp; Players".</div>
      ) : tab === "season" ? (
        <SeasonReportView clubId={clubId} clubName={clubName} seasons={seasons} clubSettings={clubSettings} />
      ) : tab === "game" ? (
        <GameReportView clubId={clubId} clubName={clubName} seasons={seasons} clubSettings={clubSettings} />
      ) : tab === "player" ? (
        <PlayerReportView clubId={clubId} clubName={clubName} seasons={seasons} players={players} clubSettings={clubSettings} />
      ) : (
        <EvaluationReportView clubId={clubId} clubName={clubName} seasons={seasons} clubSettings={clubSettings} />
      )}
    </div>
  );
}

// (Sept 2026, see project notes) rather than guessed: club_name,
// primary_color, button_color, home_background_color,

  const [lightBackgroundColor, setLightBackgroundColor] = useState("#F7F1FA");

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : (
        <div className="session-form" style={{ maxWidth: 560 }}>
          <div className="session-field">
            <label>Club Name</label>

          <div className="session-field">

              <img src={"data:image/jpeg;base64," + logoBase64} alt="Club logo" style={{ maxWidth: 140, borderRadius: 8, display: "block", marginBottom: 8 }} />
            )}
            <input type="file" accept="image/*" disabled={uploadingLogo} onChange={e => handleLogoSelected(e.target.files && e.target.files[0])} />
            {uploadingLogo && <div className="muted-hint">Processing…</div>}
          </div>

          <div className="session-field">
            <label>Primary Colour</label>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <input type="color" value={primaryColor} onChange={e => setPrimaryColor(e.target.value)} style={{ width: 44, height: 32, padding: 0, border: "none" }} />
              <input type="text" value={primaryColor} onChange={e => setPrimaryColor(e.target.value)} style={{ maxWidth: 120 }} />
            </div>

              <input type="text" value={buttonColor} onChange={e => setButtonColor(e.target.value)} style={{ maxWidth: 120 }} />
            </div>
          </div>
          <div className="session-field">
            <label>Home Background Colour</label>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <input type="color" value={homeBackgroundColor} onChange={e => setHomeBackgroundColor(e.target.value)} style={{ width: 44, height: 32, padding: 0, border: "none" }} />
              <input type="text" value={homeBackgroundColor} onChange={e => setHomeBackgroundColor(e.target.value)} style={{ maxWidth: 120 }} />
            </div>

          <div className="session-field">

            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
