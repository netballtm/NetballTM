<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NetballTM Web Hub</title>

<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // Capture the Supabase UMD global immediately, before Babel standalone loads.
  // IMPORTANT: never name a local variable "supabase" anywhere below (see project notes) —
  // Babel standalone's own internals conflict with that global name and silently corrupt output.
  window.__supabaseLib = window.supabase;

<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<style>
  :root {
    --accent: #3F51B5;
    --accent-dark: #2C387E;
    --bg: #F4F5F8;
    --card: #FFFFFF;
    --text: #1C1E21;
    --muted: #6B7280;
    --border: #E2E4E9;
    --danger: #C0392B;
    --danger-bg: #FDEDEC;
    --success: #1E7B4D;
    --success-bg: #EAF7EF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #root { min-height: 100vh; }
  .center-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.05);
  }
  .card h1 {
    font-size: 20px;
    margin: 0 0 4px 0;
    text-align: center;
  }
  .card .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary {
    width: 100%;
    margin-top: 24px;
    padding: 11px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
  button.primary:hover:not(:disabled) { background: var(--accent-dark); }
  .link-row {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    font-size: 13px;
  }
  .link-row a, .link-plain {
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
  }
  .link-row a:hover, .link-plain:hover { text-decoration: underline; }
  .banner {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 16px;
  }
  .banner.error { background: var(--danger-bg); color: var(--danger); }
  .banner.info { background: var(--success-bg); color: var(--success); }

  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .topbar .who { display: flex; flex-direction: column; }
  .topbar .club-name { font-weight: 700; font-size: 15px; }
  .topbar .me { font-size: 12px; color: var(--muted); }
  .role-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 100px;
    background: #EDEEFB;
    color: var(--accent-dark);
    margin-left: 6px;
  }
  button.logout {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  button.logout:hover { background: #F0F1F4; }

  .nav-grid {
    max-width: 900px;
    margin: 28px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }
  .nav-tile {
    background: var(--card);

  .section-label {

  .back-link {

  }
  .back-link:hover { text-decoration: underline; }
  .page-title {
    font-size: 20px;
    font-weight: 700;
    margin: 6px 0 0 0;
  }
  .season-select-row {
    max-width: 900px;
    margin: 14px auto 0 auto;
    padding: 0 20px;
  }
  select.season-select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
  }
  .game-list {
    max-width: 900px;
    margin: 16px auto 40px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .game-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .game-card.bye { opacity: 0.7; }
  .game-card .round-line { font-weight: 700; font-size: 14px; }
  .game-card .meta-line { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .game-card .unavailable-line { color: #B45309; font-size: 12.5px; margin-top: 4px; }
  .result-badge {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .result-badge.win { background: var(--success-bg); color: var(--success); }
  .result-badge.loss { background: var(--danger-bg); color: var(--danger); }
  .result-badge.draw { background: #FFF4E0; color: #B45309; }
  .result-badge.bye { background: #F0F1F4; color: var(--muted); }
  .empty-note {
    max-width: 900px;
    margin: 0 auto;
    color: var(--muted);
    font-size: 14px;
    padding: 30px 20px;
    text-align: center;
  }
  button.secondary {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
    white-space: nowrap;
  }
  button.secondary:hover { background: #F0F1F4; }
  button.secondary:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secondary.danger-text { color: var(--danger); border-color: var(--danger); }
  button.secondary.danger-text:hover { background: var(--danger-bg); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal-card {
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.25);
  }
  .modal-card h2 { margin: 0 0 4px 0; font-size: 17px; }
  .modal-card .modal-subtitle { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }
  .availability-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .availability-row:last-child { border-bottom: none; }

  .toggle-switch { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #ccc;
    transition: 0.15s;
    border-radius: 24px;
  }
  .toggle-slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: 0.15s;
    border-radius: 50%;
  }
  .toggle-switch input:checked + .toggle-slider { background-color: var(--accent); }
  .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }

  .gameday-toolbar {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 20px 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 16px;
  }
  .score-row { display: flex; gap: 12px; align-items: center; }
  .score-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    text-align: center;
    min-width: 90px;
  }
  .score-box .score-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .score-box .score-value { font-size: 22px; font-weight: 700; }
  .score-sep { font-size: 20px; color: var(--muted); font-weight: 700; }
  .quick-stats-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .quick-stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    min-width: 120px;
    text-align: center;
  }
  .quick-stat label {
    display: block;
    font-size: 10.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 0 5px 0;
    font-weight: 600;
  }
  .quick-stat input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    text-align: center;
    font-weight: 700;
  }

  .quarters-grid {
    max-width: 1000px;
    margin: 20px auto 0 auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .quarter-panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .quarter-panel h3 { margin: 0 0 10px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
  .quarter-field { margin-bottom: 10px; }
  .quarter-field label { font-size: 12px; font-weight: 600; margin: 0 0 4px 0; }
  .quarter-field input, .quarter-field textarea {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
  }
  .quarter-field textarea { resize: vertical; }
  .quarter-field .muted-hint { color: var(--muted); font-size: 11.5px; }

  .gameday-actions {
    max-width: 1000px;
    margin: 24px auto 40px auto;
    padding: 0 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .locked-card { max-width: 480px; margin: 60px auto; }

  .page-header-actions {
    max-width: 900px;
    margin: 12px auto 0 auto;
    padding: 0 20px;
    display: flex;
    justify-content: flex-end;
  }

  .quarter-tabs {
    max-width: 1000px;
    margin: 16px auto 0 auto;
    padding: 0 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .quarter-tab {
    padding: 9px 20px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
  }
  .quarter-tab:hover { border-color: var(--accent); }
  .quarter-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .court-wrap {
    max-width: 1000px;
    margin: 18px auto 0 auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .court-zone {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .court-zone h4 {
    margin: 0 0 12px 0;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .court-slots { display: flex; gap: 10px; flex-wrap: wrap; }
  .court-slot {
    flex: 1;
    min-width: 130px;
    background: #F7F8FB;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
  }
  .court-slot:hover { border-color: var(--accent); }
  .court-slot.filled { border-style: solid; background: #fff; }
  .court-slot .slot-code {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-dark);
    letter-spacing: 0.03em;
  }
  .court-slot .slot-player { font-size: 14.5px; font-weight: 600; margin-top: 5px; }
  .court-slot .slot-empty { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .slot-goal { margin-top: 8px; cursor: default; }
  .slot-goal label {
    display: block;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 0 3px 0;
    font-weight: 600;
  }
  .slot-goal input {
    width: 56px;
    padding: 5px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    text-align: center;
    font-weight: 700;
  }

  .bench-wrap { max-width: 1000px; margin: 16px auto 0 auto; padding: 0 20px; }
  .bench-wrap h4 { margin: 0 0 8px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
  .bench-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .bench-chip {
    padding: 9px 16px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 13.5px;
    cursor: pointer;
  }
  .bench-chip:hover { border-color: var(--accent); }
  .bench-chip.nap { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }

  .quarter-panel-single { max-width: 480px; margin: 20px auto 0 auto; padding: 0 20px; }

  .potm-section { max-width: 480px; margin: 20px auto 0 auto; padding: 0 20px; }
  .potm-section h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 0 0 10px 0; }
  .potm-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .potm-checkbox { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .potm-checkbox input { width: auto; }
  .potm-details { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .potm-photo-preview { width: 100%; max-width: 200px; border-radius: 8px; margin-top: 8px; display: block; }

  .status-pill {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 100px;
    margin-left: 8px;
  }
  .status-pill.cancelled { background: var(--danger-bg); color: var(--danger); }
  .status-pill.note { background: #F0F1F4; color: var(--muted); text-transform: none; font-weight: 600; }

  .session-form { max-width: 480px; margin: 20px auto 0 auto; padding: 0 20px; }
  .session-field { margin-bottom: 16px; }
  .session-field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .session-field input[type="text"],
  .session-field input[type="date"],
  .session-field textarea,
  .session-field select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  .session-field textarea { resize: vertical; }
  .session-field .muted-hint { color: var(--muted); font-size: 11.5px; margin-top: 4px; }

  .attendance-section { max-width: 480px; margin: 4px auto 0 auto; padding: 0 20px; }
  .attendance-section h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 20px 0 10px 0; }
  .attendance-block { padding: 9px 0; border-bottom: 1px solid var(--border); }
  .attendance-block:last-child { border-bottom: none; }
  .attendance-toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
  .attendance-reason { margin-top: 8px; }
  .attendance-reason label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .attendance-reason input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12.5px;
    font-family: inherit;
  }

  .session-actions { max-width: 480px; margin: 24px auto 40px auto; padding: 0 20px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  .session-summary-row { max-width: 900px; margin: 16px auto 0 auto; padding: 0 20px; display: flex; gap: 12px; flex-wrap: wrap; }

  /* Base muted-hint rule so it also works standalone (outside a .session-field
     or .quarter-field parent) — used by the Phase 4/5 admin/report screens. */
  .muted-hint { color: var(--muted); font-size: 11.5px; }

  /* Reports (Phase 5) print handling: hide navigational chrome and any
     element explicitly marked .no-print, so "Print / Save as PDF" produces a
     clean page of just the report content. */
  @media print {
    .topbar, .page-header .back-link, .page-header-actions, .quarter-tabs, .season-select-row, .no-print {
      display: none !important;
    }
    body { background: #fff; }
  }
</style>

<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useEffect, useCallback } = React;

const SUPABASE_URL = "https://fkwoiaxmmjfegiltawkg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrd29pYXhtbWpmZWdpbHRhd2tnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjQ3MjAsImV4cCI6MjA5NjY0MDcyMH0.0lAsh7avrfmp7Qy8LVXcanwUwI1IaNvYLfk61UuL734";

// The Supabase client. Deliberately NOT named "supabase" (see the comment
// in <head> — Babel standalone's own global conflicts with that name).
const db = window.__supabaseLib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function generateClubCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no 0/O/1/I to avoid confusion
  let out = "";
  for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

function Banner({ error, info }) {
  if (error) return <div className="banner error">{error}</div>;
  if (info) return <div className="banner info">{info}</div>;
  return null;
}

function AuthShell({ title, subtitle, children }) {
  return (
    <div className="center-screen">
      <div className="card">
        <h1>{title}</h1>
        {subtitle && <div className="subtitle">{subtitle}</div>}
        {children}
      </div>
    </div>
  );
}

function LoginScreen({ onLogin, onGoJoin, onGoCreate, onGoForgot, busy, error, info }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  return (
    <AuthShell title="NetballTM" subtitle="Web Hub login">
      <label>Email</label>
      <input type="email" value={email} onChange={e => setEmail(e.target.value)} autoComplete="username" />
      <label>Password</label>
      <input type="password" value={password} onChange={e => setPassword(e.target.value)} autoComplete="current-password" />
      <Banner error={error} info={info} />
      <button className="primary" disabled={busy || !email || !password} onClick={() => onLogin(email.trim(), password)}>
        {busy ? "Logging in…" : "Log In"}
      </button>
      <div className="link-row">
        <a onClick={onGoForgot}>Forgot password?</a>

function AvailabilityDialog({ game, onClose, onSave, busy }) {
  // Roster comes from the game's own players_snapshot (the season roster
  // captured when the game was created) rather than a live registrations
  // lookup — this matches how the Android app's Availability dialog works
  // and sidesteps needing to resolve registrations.season_index to a season.
  const players = (game.players_snapshot || []).map(p => p.name).sort();

  const initial = {};
  players.forEach(name => {
    // Default is available (true) unless the game row has an explicit
    // false entry for that player — same convention as the rest of the app.
    initial[name] = (game.player_availability || {})[name] !== false;
  });
  const [avail, setAvail] = useState(initial);

  function toggle(name) {
    setAvail(prev => ({ ...prev, [name]: !prev[name] }));
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={e => e.stopPropagation()}>
        <h2>Availability</h2>
        <div className="modal-subtitle">
          Round {game.round}{game.opponent ? " vs " + game.opponent : ""}
        </div>
        {players.length === 0 && (
          <div style={{ color: "var(--muted)", fontSize: 13 }}>
            No players recorded for this game yet.
          </div>
        )}
        {players.map(name => (
          <div className="availability-row" key={name}>
            <span>{name}</span>
            <label className="toggle-switch">
              <input type="checkbox" checked={!!avail[name]} onChange={() => toggle(name)} />
              <span className="toggle-slider"></span>
            </label>
          </div>
        ))}
        <div className="modal-actions">
          <button className="secondary" onClick={onClose} disabled={busy}>Cancel</button>
          <button className="primary" style={{ marginTop: 0, width: "auto" }} disabled={busy} onClick={() => onSave(avail)}>
            {busy ? "Saving…" : "Save"}
          </button>
        </div>
      </div>
    </div>
  );
}

function CreateGameScreen({ clubId, onBack, onCreated }) {
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [seasons, setSeasons] = useState([]);
  const [players, setPlayers] = useState([]);
  const [existingRounds, setExistingRounds] = useState({}); // seasonName -> [round, ...]

  const [seasonName, setSeasonName] = useState("");
  const [round, setRound] = useState("");
  const [opponent, setOpponent] = useState("");
  const [court, setCourt] = useState("");
  const [dateStr, setDateStr] = useState("");
  const [timeStr, setTimeStr] = useState("");
  const [isBye, setIsBye] = useState(false);
  const [selectedPlayers, setSelectedPlayers] = useState({});

  useEffect(() => {
    (async () => {
      const [seasonsRes, playersRes, gamesRes] = await Promise.all([
        db.from("seasons").select("*").eq("club_id", clubId),
        db.from("players").select("*").eq("club_id", clubId).order("name", { ascending: true }),
        db.from("games").select("season_name,round").eq("club_id", clubId),
      ]);
      const firstErr = seasonsRes.error || playersRes.error || gamesRes.error;
      if (firstErr) {
        setErrorMsg(firstErr.message);
        setLoading(false);
        return;
      }
      const seasonRows = seasonsRes.data || [];
      const playerRows = playersRes.data || [];
      const gameRows = gamesRes.data || [];

      setSeasons(seasonRows);
      setPlayers(playerRows);

      const roundsBySeason = {};
      gameRows.forEach(g => {
        if (!roundsBySeason[g.season_name]) roundsBySeason[g.season_name] = [];
        roundsBySeason[g.season_name].push(g.round);
      });
      setExistingRounds(roundsBySeason);

      const initialSeason = (seasonRows[0] && seasonRows[0].name) || "";
      setSeasonName(initialSeason);
      const usedRounds = roundsBySeason[initialSeason] || [];
      setRound(usedRounds.length ? String(Math.max(...usedRounds) + 1) : "1");

      const initialSelected = {};
      playerRows.forEach(p => { initialSelected[p.name] = true; });
      setSelectedPlayers(initialSelected);

      setLoading(false);
    })();
  }, [clubId]);

  function handleSeasonChange(name) {
    setSeasonName(name);
    const usedRounds = existingRounds[name] || [];
    setRound(usedRounds.length ? String(Math.max(...usedRounds) + 1) : "1");
  }

  function togglePlayer(name) {
    setSelectedPlayers(prev => ({ ...prev, [name]: !prev[name] }));
  }

  function formatDisplayDate(iso) {
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return dayNames[d.getDay()] + ", " + d.getDate() + " " + monthNames[d.getMonth()] + " " + d.getFullYear();
  }

  function formatDisplayTime(t) {
    if (!t) return "";
    const parts = t.split(":");
    let h = parseInt(parts[0], 10);
    const m = parts[1];
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12; if (h === 0) h = 12;
    return h + ":" + m + " " + ampm;
  }

  const canSubmit = seasonName && round && (isBye || opponent.trim());
  const usedRoundsForSeason = (existingRounds[seasonName] || []).slice().sort((a, b) => a - b);

  async function handleCreate() {
    setSaving(true);
    setErrorMsg("");

    const rosterNames = isBye ? [] : Object.keys(selectedPlayers).filter(name => selectedPlayers[name]).sort();

    const payload = {
      club_id: clubId,
      season_name: seasonName,
      round: parseInt(round, 10),
      opponent: isBye ? "BYE" : opponent.trim(),
      court: court.trim() || null,
      game_date: formatDisplayDate(dateStr),
      game_time: formatDisplayTime(timeStr),
      is_completed: false,
      is_bye: isBye,
      players_snapshot: rosterNames.map(name => ({ name, wasFillIn: false })),
      positions_by_quarter: {},
      goals_by_quarter: {},
      opponent_goals_by_quarter: {},
      turnovers_by_quarter: {},
      quarter_notes: {},
      player_availability: {},
      players_of_match: [],
      potm_comments: {},
      potm_photos: {},
      our_score: 0,
      opponent_score: 0,
    };

    const { error: insertErr } = await db.from("games").insert(payload);
    setSaving(false);
    if (insertErr) { setErrorMsg(insertErr.message); return; }
    onCreated();
  }

  if (loading) return <div className="empty-note">Loading…</div>;

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={onBack}>&larr; Back to Upcoming Games</a>
        <h1 className="page-title">Create Game</h1>
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      <div className="quarters-grid" style={{ gridTemplateColumns: "1fr", maxWidth: 480 }}>
        <div className="quarter-panel">
          <div className="quarter-field">
            <label>Season</label>
            <select className="season-select" style={{ width: "100%" }} value={seasonName} onChange={e => handleSeasonChange(e.target.value)}>
              {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
            </select>
          </div>
          <div className="quarter-field">
            <label>Round</label>
            <input type="number" min="1" value={round} onChange={e => setRound(e.target.value)} />
            {usedRoundsForSeason.length > 0 && (
              <div className="muted-hint">Rounds already used this season: {usedRoundsForSeason.join(", ")}</div>
            )}
          </div>
          <div className="quarter-field">
            <label>
              <input type="checkbox" checked={isBye} onChange={e => setIsBye(e.target.checked)} style={{ width: "auto", marginRight: 8 }} />
              This round is a BYE
            </label>
          </div>
          {!isBye && (
            <div className="quarter-field">
              <label>Opponent</label>
              <input type="text" value={opponent} onChange={e => setOpponent(e.target.value)} />
            </div>
          )}
          <div className="quarter-field">
            <label>Court</label>
            <input type="text" value={court} onChange={e => setCourt(e.target.value)} />
          </div>
          <div className="quarter-field">
            <label>Date</label>
            <input type="date" value={dateStr} onChange={e => setDateStr(e.target.value)} />
          </div>
          <div className="quarter-field">
            <label>Time</label>
            <input type="time" value={timeStr} onChange={e => setTimeStr(e.target.value)} />
          </div>
        </div>

        {!isBye && (
          <div className="quarter-panel">
            <h3>Roster</h3>
            <RosterToggleList players={players.map(p => p.name)} selected={selectedPlayers} onToggle={togglePlayer} />
          </div>
        )}
      </div>

      <div className="gameday-actions">
        <button className="secondary" onClick={onBack} disabled={saving}>Cancel</button>
        <button className="primary" style={{ marginTop: 0, width: "auto" }} disabled={saving || !canSubmit} onClick={handleCreate}>
          {saving ? "Creating…" : "Create Game"}
        </button>
      </div>
    </div>
  );
}

function PlannedGamesScreen({ clubId, role, onBack, onOpenGameDay, onCreateGame }) {
  const [seasons, setSeasons] = useState([]);
  const [seasonName, setSeasonName] = useState("");
  const [games, setGames] = useState([]);
  const [loading, setLoading] = useState(true);
  const [dialogGame, setDialogGame] = useState(null);
  const [savingAvailability, setSavingAvailability] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [deleting, setDeleting] = useState(false);

  useEffect(() => {
    (async () => {
      const { data, error: seasonsErr } = await db.from("seasons").select("*").eq("club_id", clubId);
      if (seasonsErr) { setErrorMsg(seasonsErr.message); setLoading(false); return; }
      setSeasons(data || []);
      if (data && data.length > 0) setSeasonName(data[0].name);
      else setLoading(false);
    })();
  }, [clubId]);

  const loadGames = useCallback(async () => {
    if (!seasonName) return;
    setLoading(true);
    const { data, error: gamesErr } = await db
      .from("games")
      .select("*")
      .eq("club_id", clubId)
      .eq("season_name", seasonName)
      .eq("is_completed", false)
      .order("round", { ascending: true });
    if (gamesErr) setErrorMsg(gamesErr.message);
    else setGames(data || []);
    setLoading(false);
  }, [clubId, seasonName]);

  useEffect(() => { loadGames(); }, [loadGames]);

  async function saveAvailability(map) {
    setSavingAvailability(true);
    const { error: updateErr } = await db.from("games").update({ player_availability: map }).eq("id", dialogGame.id);
    setSavingAvailability(false);
    if (updateErr) { setErrorMsg(updateErr.message); return; }
    setGames(prev => prev.map(g => g.id === dialogGame.id ? { ...g, player_availability: map } : g));
    setDialogGame(null);
  }

  async function confirmDelete() {
    if (!deleteTarget) return;
    setDeleting(true);
    setErrorMsg("");
    // Clear any lingering edit lock for this game too, so a deleted game
    // never leaves a stale lock row behind.
    await db.from("game_locks")
      .delete()
      .eq("club_id", clubId)
      .eq("season_name", deleteTarget.season_name)
      .eq("round", deleteTarget.round)
      .eq("opponent", deleteTarget.opponent);

    const { error: deleteErr } = await db.from("games").delete().eq("id", deleteTarget.id);
    setDeleting(false);
    if (deleteErr) { setErrorMsg(deleteErr.message); return; }
    setGames(prev => prev.filter(g => g.id !== deleteTarget.id));
    setDeleteTarget(null);
  }

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={onBack}>&larr; Back to Home</a>
        <h1 className="page-title">Upcoming Games</h1>
      </div>

      {role !== "team_manager" && (
        <div className="page-header-actions">
          <button className="secondary" onClick={onCreateGame}>+ Create Game</button>
        </div>
      )}

      {seasons.length > 1 && (
        <div className="season-select-row">
          <select className="season-select" value={seasonName} onChange={e => setSeasonName(e.target.value)}>
            {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
          </select>
        </div>
      )}

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : games.length === 0 ? (
        <div className="empty-note">No upcoming games for this season.</div>
      ) : (
        <div className="game-list">
          {games.map(g => (
            <GameCard
              key={g.id}
              game={g}
              role={role}
              onOpenAvailability={setDialogGame}
              onOpenGameDay={onOpenGameDay}
              onDelete={setDeleteTarget}
            />
          ))}
        </div>
      )}

      {dialogGame && (
        <AvailabilityDialog
          game={dialogGame}
          busy={savingAvailability}
          onClose={() => setDialogGame(null)}
          onSave={saveAvailability}
        />
      )}

      {deleteTarget && (
        <div className="modal-overlay" onClick={() => setDeleteTarget(null)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <h2>Delete this game?</h2>
            <div className="modal-subtitle">
              Round {deleteTarget.round}{deleteTarget.is_bye ? " — BYE" : " vs " + deleteTarget.opponent}
              — this permanently deletes the game and everything recorded on it. This can't be undone.
            </div>
            <div className="modal-actions">
              <button className="secondary" onClick={() => setDeleteTarget(null)} disabled={deleting}>Cancel</button>
              <button
                className="primary"
                style={{ marginTop: 0, width: "auto", background: "var(--danger)" }}
                disabled={deleting}
                onClick={confirmDelete}
              >
                {deleting ? "Deleting…" : "Delete Game"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

      ) : (
        <div className="game-list">
          {games.map(g => (
            <HistoryGameCard key={g.id} game={g} role={role} onOpen={onOpenGameDay} onDelete={setDeleteTarget} />
          ))}
        </div>
      )}

      {deleteTarget && (
        <div className="modal-overlay" onClick={() => setDeleteTarget(null)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <h2>Delete this game?</h2>
            <div className="modal-subtitle">
              Round {deleteTarget.round}{deleteTarget.is_bye ? " — BYE" : " vs " + deleteTarget.opponent}
              — this permanently deletes the game and everything recorded on it. This can't be undone.
            </div>
            <div className="modal-actions">
              <button className="secondary" onClick={() => setDeleteTarget(null)} disabled={deleting}>Cancel</button>
              <button
                className="primary"
                style={{ marginTop: 0, width: "auto", background: "var(--danger)" }}
                disabled={deleting}
                onClick={confirmDelete}
              >
                {deleting ? "Deleting…" : "Delete Game"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const QUARTERS = ["1", "2", "3", "4"];
const COURT_ZONES = [
  { title: "Attack", codes: ["GS", "GA"] },
  { title: "Centre", codes: ["WA", "C", "WD"] },
  { title: "Defence", codes: ["GD", "GK"] },
];
const COURT_CODES = COURT_ZONES.reduce((all, zone) => all.concat(zone.codes), []);
const POSITION_LABELS = {
  GS: "Goal Shooter", GA: "Goal Attack", WA: "Wing Attack", C: "Centre",
  WD: "Wing Defence", GD: "Goal Defence", GK: "Goal Keeper",
};
// Same 2-hour staleness window as the Android app's game lock guard (see
// project notes) — a lock older than this is treated as abandoned.
const LOCK_STALE_MS = 2 * 60 * 60 * 1000;

// Same convention as the Android app's PotmPhotoStorage: shrink to a 1280px
// longest edge and re-encode as JPEG @ 80% before uploading, so a phone
// photo taken straight from the browser's file picker doesn't land in
// Supabase Storage at full multi-MB camera resolution.
function compressPhotoFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read that file."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not read that image."));
      img.onload = () => {
        const maxDim = 1280;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error("Could not process that image."));
        }, "image/jpeg", 0.8);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function PlayerPickerModal({ slotCode, currentPlayer, benchPlayers, onPick, onClear, onClose }) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={e => e.stopPropagation()}>
        <h2>{slotCode} — {POSITION_LABELS[slotCode]}</h2>
        <div className="modal-subtitle">Pick who's playing this position this quarter.</div>
        {currentPlayer && (
          <div className="availability-row">
            <span>{currentPlayer} <span style={{ color: "var(--muted)" }}>(current)</span></span>
            <button className="secondary" onClick={onClear}>Send to bench</button>
          </div>
        )}
        {benchPlayers.length === 0 && !currentPlayer && (
          <div style={{ color: "var(--muted)", fontSize: 13 }}>No one left on the bench to assign.</div>
        )}
        {benchPlayers.map(p => (
          <div className="availability-row" key={p.name}>
            <span>{p.name}{p.status === "NAP" ? <span style={{ color: "var(--danger)" }}> (Not Available)</span> : null}</span>
            <button className="secondary" onClick={() => onPick(p.name)}>Select</button>
          </div>
        ))}
        <div className="modal-actions">
          <button className="secondary" onClick={onClose}>Close</button>
        </div>
      </div>

}

function CourtView({ q, players, positions, goals, onAssign, onClearSlot, onToggleBench, onGoalChange }) {
  const [openSlot, setOpenSlot] = useState(null);
  const qPositions = positions[q] || {};

  const slotAssignments = {};
  COURT_CODES.forEach(code => { slotAssignments[code] = null; });
  players.forEach(name => {
    const code = qPositions[name] || "OFF";
    if (COURT_CODES.indexOf(code) !== -1) slotAssignments[code] = name;
  });

  const benchPlayers = players
    .filter(name => COURT_CODES.indexOf(qPositions[name] || "OFF") === -1)
    .map(name => ({ name, status: qPositions[name] === "NAP" ? "NAP" : "OFF" }));

  return (
    <div>
      <div className="court-wrap">
        {COURT_ZONES.map(zone => (
          <div className="court-zone" key={zone.title}>
            <h4>{zone.title}</h4>
            <div className="court-slots">
              {zone.codes.map(code => {
                const playerName = slotAssignments[code];
                return (
                  <div
                    key={code}
                    className={"court-slot" + (playerName ? " filled" : "")}
                    onClick={() => setOpenSlot(code)}
                  >
                    <div className="slot-code">{code}</div>
                    {playerName ? (
                      <React.Fragment>
                        <div className="slot-player">{playerName}</div>
                        {(code === "GS" || code === "GA") && (
                          <div className="slot-goal" onClick={e => e.stopPropagation()}>
                            <label>Goals</label>
                            <input
                              type="number" min="0"
                              value={(goals[q] && goals[q][playerName]) || 0}
                              onChange={e => onGoalChange(q, playerName, parseInt(e.target.value, 10) || 0)}
                            />
                          </div>
                        )}
                      </React.Fragment>
                    ) : (
                      <div className="slot-empty">Tap to assign</div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>

      <div className="bench-wrap">
        <h4>Bench <span style={{ textTransform: "none", fontWeight: 400 }}>(tap a player to mark Not Available)</span></h4>
        <div className="bench-chips">
          {benchPlayers.length === 0 && <span style={{ color: "var(--muted)", fontSize: 13 }}>Everyone is on court.</span>}
          {benchPlayers.map(p => (
            <div
              key={p.name}
              className={"bench-chip" + (p.status === "NAP" ? " nap" : "")}
              onClick={() => onToggleBench(q, p.name, p.status)}
            >
              {p.name}{p.status === "NAP" ? " · N/A" : ""}
            </div>
          ))}
        </div>
      </div>

      {openSlot && (
        <PlayerPickerModal
          slotCode={openSlot}
          currentPlayer={slotAssignments[openSlot]}
          benchPlayers={benchPlayers}
          onPick={name => { onAssign(q, openSlot, name); setOpenSlot(null); }}
          onClear={() => { onClearSlot(q, slotAssignments[openSlot]); setOpenSlot(null); }}
          onClose={() => setOpenSlot(null)}
        />
      )}
    </div>
  );
}

function QuarterPanel({ q, notes, onNotesChange }) {
  return (
    <div className="quarter-panel">
      <div className="quarter-field">
        <label>Quarter {q} notes (optional)</label>
        <input type="text" value={notes[q] || ""} onChange={e => onNotesChange(q, e.target.value)} />
      </div>
    </div>
  );
}

function GameDayScreen({ gameId, clubId, coachId, role, backLabel, onBack }) {
  const [loading, setLoading] = useState(true);
  const [lockState, setLockState] = useState("checking"); // checking | held | locked-by-other
  const [lockedByName, setLockedByName] = useState("");
  const [errorMsg, setErrorMsg] = useState("");
  const [infoMsg, setInfoMsg] = useState("");
  const [saving, setSaving] = useState(false);

  const [game, setGame] = useState(null);
  const [players, setPlayers] = useState([]);
  const [positions, setPositions] = useState({ "1": {}, "2": {}, "3": {}, "4": {} });
  const [goals, setGoals] = useState({ "1": {}, "2": {}, "3": {}, "4": {} });
  const [oppGoals, setOppGoals] = useState({ "1": 0, "2": 0, "3": 0, "4": 0 });
  const [turnovers, setTurnovers] = useState({ "1": 0, "2": 0, "3": 0, "4": 0 });
  const [notes, setNotes] = useState({ "1": "", "2": "", "3": "", "4": "" });
  const [activeQuarter, setActiveQuarter] = useState("1");

  const [potm, setPotm] = useState([]);
  const [potmComments, setPotmComments] = useState({});
  const [potmPhotos, setPotmPhotos] = useState({});
  const [photoPreviewUrls, setPhotoPreviewUrls] = useState({});
  const [uploadingFor, setUploadingFor] = useState(null);
  const [showSubmitConfirm, setShowSubmitConfirm] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
  const [deleting, setDeleting] = useState(false);

  useEffect(() => {
    let cancelled = false;

    (async () => {
      setLoading(true);
      setErrorMsg("");

      const { data: gameRow, error: gameErr } = await db.from("games").select("*").eq("id", gameId).maybeSingle();
      if (cancelled) return;
      if (gameErr || !gameRow) {
        setErrorMsg("Could not load this game.");
        setLoading(false);
        return;
      }

      const lockKey = { club_id: clubId, season_name: gameRow.season_name, round: gameRow.round, opponent: gameRow.opponent };

      const { data: existingLock } = await db
        .from("game_locks")
        .select("*")
        .eq("club_id", clubId)
        .eq("season_name", gameRow.season_name)
        .eq("round", gameRow.round)
        .eq("opponent", gameRow.opponent)
        .maybeSingle();

      if (cancelled) return;

      let shouldInsertLock = false;

      if (existingLock) {
        const age = Date.now() - Number(existingLock.locked_at);
        if (age > LOCK_STALE_MS) {
          // Stale lock left behind (app minimised/killed mid-edit) — clear it
          // and take over, same as the Android app's 2-hour staleness guard.
          await db.from("game_locks").delete().eq("id", existingLock.id);
          shouldInsertLock = true;
        } else if (existingLock.locked_by !== coachId) {
          const { data: otherCoach } = await db.from("coaches").select("display_name,email").eq("id", existingLock.locked_by).maybeSingle();
          if (cancelled) return;
          setLockedByName((otherCoach && (otherCoach.display_name || otherCoach.email)) || "another coach");
          setLockState("locked-by-other");
          setLoading(false);
          return;
        }
        // else: it's already our own lock (e.g. reopened in another tab) — carry on.
      } else {
        shouldInsertLock = true;
      }

      if (shouldInsertLock) {
        const { error: insertErr } = await db.from("game_locks").insert({ ...lockKey, locked_by: coachId, locked_at: Date.now() });
        if (insertErr) {
          // Another coach grabbed the lock in the same instant — re-check who has it now
          // rather than surfacing a raw unique-constraint error.
          const { data: raceLock } = await db
            .from("game_locks").select("*")
            .eq("club_id", clubId).eq("season_name", gameRow.season_name)
            .eq("round", gameRow.round).eq("opponent", gameRow.opponent)
            .maybeSingle();
          if (cancelled) return;
          if (raceLock && raceLock.locked_by !== coachId) {
            const { data: otherCoach } = await db.from("coaches").select("display_name,email").eq("id", raceLock.locked_by).maybeSingle();
            if (cancelled) return;
            setLockedByName((otherCoach && (otherCoach.display_name || otherCoach.email)) || "another coach");
            setLockState("locked-by-other");
            setLoading(false);
            return;
          }
        }
      }

      if (cancelled) return;

      const snapshotPlayers = (gameRow.players_snapshot || []).map(p => p.name);
      const nextPositions = {};
      const nextGoals = {};
      const nextOppGoals = {};
      const nextTurnovers = {};
      const nextNotes = {};
      QUARTERS.forEach(q => {
        const storedPositions = (gameRow.positions_by_quarter && gameRow.positions_by_quarter[q]) || {};
        const qPositions = {};
        snapshotPlayers.forEach(name => { qPositions[name] = storedPositions[name] || "OFF"; });
        nextPositions[q] = qPositions;
        nextGoals[q] = (gameRow.goals_by_quarter && gameRow.goals_by_quarter[q]) || {};
        nextOppGoals[q] = (gameRow.opponent_goals_by_quarter && gameRow.opponent_goals_by_quarter[q]) || 0;
        nextTurnovers[q] = (gameRow.turnovers_by_quarter && gameRow.turnovers_by_quarter[q]) || 0;
        nextNotes[q] = (gameRow.quarter_notes && gameRow.quarter_notes[q]) || "";
      });

      setGame(gameRow);
      setPlayers(snapshotPlayers);
      setPositions(nextPositions);
      setGoals(nextGoals);
      setOppGoals(nextOppGoals);
      setTurnovers(nextTurnovers);
      setNotes(nextNotes);
      setPotm(gameRow.players_of_match || []);
      setPotmComments(gameRow.potm_comments || {});
      setPotmPhotos(gameRow.potm_photos || {});

      const storedPhotos = gameRow.potm_photos || {};
      const photoEntries = Object.entries(storedPhotos);
      if (photoEntries.length > 0) {
        const urls = {};
        await Promise.all(photoEntries.map(async ([name, path]) => {
          const { data: signed } = await db.storage.from("potm-photos").createSignedUrl(path, 3600);
          if (signed && signed.signedUrl) urls[name] = signed.signedUrl;
        }));
        if (!cancelled) setPhotoPreviewUrls(urls);
      }

      setLockState("held");
      setLoading(false);
    })();

    return () => { cancelled = true; };
  }, [gameId, clubId, coachId]);

  function updatePosition(q, name, code) {
    setPositions(prev => ({ ...prev, [q]: { ...prev[q], [name]: code } }));
  }
  function assignSlot(q, code, name) {
    setPositions(prev => {
      const qMap = { ...prev[q] };
      // Whoever was previously in this slot goes back to the bench.
      Object.keys(qMap).forEach(pname => {
        if (qMap[pname] === code && pname !== name) qMap[pname] = "OFF";
      });
      qMap[name] = code;
      return { ...prev, [q]: qMap };
    });
  }
  function clearSlot(q, name) {
    if (!name) return;
    setPositions(prev => ({ ...prev, [q]: { ...prev[q], [name]: "OFF" } }));
  }
  function toggleBenchStatus(q, name, currentStatus) {
    setPositions(prev => ({ ...prev, [q]: { ...prev[q], [name]: currentStatus === "NAP" ? "OFF" : "NAP" } }));
  }
  function updateGoal(q, name, value) {
    setGoals(prev => ({ ...prev, [q]: { ...prev[q], [name]: value } }));
  }
  function updateOppGoals(q, value) {
    setOppGoals(prev => ({ ...prev, [q]: value }));
  }
  function updateTurnovers(q, value) {
    setTurnovers(prev => ({ ...prev, [q]: value }));
  }
  function updateNotes(q, value) {
    setNotes(prev => ({ ...prev, [q]: value }));
  }

  function togglePotm(name) {
    setPotm(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
  }
  function updatePotmComment(name, text) {
    setPotmComments(prev => ({ ...prev, [name]: text }));
  }
  async function handlePhotoSelected(name, file) {
    if (!file) return;
    setUploadingFor(name);
    setErrorMsg("");
    try {
      const blob = await compressPhotoFile(file);
      const path = "potm/" + Date.now() + "_" + Math.floor(Math.random() * 100000) + ".jpg";
      const { error: uploadErr } = await db.storage.from("potm-photos").upload(path, blob, { contentType: "image/jpeg", upsert: true });
      if (uploadErr) { setErrorMsg(uploadErr.message); setUploadingFor(null); return; }
      setPotmPhotos(prev => ({ ...prev, [name]: path }));
      setPhotoPreviewUrls(prev => ({ ...prev, [name]: URL.createObjectURL(blob) }));
    } catch (e) {
      setErrorMsg((e && e.message) || String(e));
    }
    setUploadingFor(null);
  }

  async function releaseLock() {
    if (!game) return;
    await db.from("game_locks")
      .delete()
      .eq("club_id", clubId)
      .eq("season_name", game.season_name)
      .eq("round", game.round)
      .eq("opponent", game.opponent)
      .eq("locked_by", coachId);
  }

  async function handleBack() {
    await releaseLock();
    onBack();
  }

  function buildSavePayload(extra) {
    let ourScore = 0;
    let opponentScore = 0;
    const cleanGoals = {};
    const cleanOppGoals = {};
    const cleanTurnovers = {};
    const cleanNotes = {};

    QUARTERS.forEach(q => {
      const qGoals = {};
      Object.entries(goals[q] || {}).forEach(([name, val]) => {
        const n = Number(val) || 0;
        if (n > 0) { qGoals[name] = n; ourScore += n; }
      });
      cleanGoals[q] = qGoals;
      cleanOppGoals[q] = Number(oppGoals[q]) || 0;
      opponentScore += cleanOppGoals[q];
      cleanTurnovers[q] = Number(turnovers[q]) || 0;
      if (notes[q] && notes[q].trim()) cleanNotes[q] = notes[q].trim();
    });

    return Object.assign({
      positions_by_quarter: positions,
      goals_by_quarter: cleanGoals,
      opponent_goals_by_quarter: cleanOppGoals,
      turnovers_by_quarter: cleanTurnovers,
      quarter_notes: cleanNotes,
      players_of_match: potm,
      potm_comments: potmComments,
      potm_photos: potmPhotos,
      our_score: ourScore,
      opponent_score: opponentScore,
    }, extra || {});
  }

  async function handleSaveDraft() {
    setSaving(true);
    setErrorMsg("");
    setInfoMsg("");

    const { error: updateErr } = await db.from("games").update(buildSavePayload()).eq("id", gameId);

    setSaving(false);
    if (updateErr) { setErrorMsg(updateErr.message); return; }
    setInfoMsg("Saved.");
  }

  async function handleSubmit() {
    setSubmitting(true);
    setErrorMsg("");

    const { error: updateErr } = await db.from("games").update(buildSavePayload({ is_completed: true })).eq("id", gameId);
    if (updateErr) { setErrorMsg(updateErr.message); setSubmitting(false); return; }

    await releaseLock();
    setSubmitting(false);
    onBack();
  }

  async function handleDelete() {
    setDeleting(true);
    setErrorMsg("");
    await releaseLock();
    const { error: deleteErr } = await db.from("games").delete().eq("id", gameId);
    setDeleting(false);
    if (deleteErr) { setErrorMsg(deleteErr.message); return; }
    onBack();
  }

  if (loading) {
    return <div className="empty-note">Loading…</div>;
  }

  if (lockState === "locked-by-other") {
    return (
      <div className="center-screen">
        <div className="card locked-card">
          <h1>Game In Use</h1>
          <div className="subtitle">This game is currently being edited by {lockedByName}. Try again shortly.</div>
          <button className="primary" onClick={onBack}>Back</button>
        </div>
      </div>
    );
  }

  if (!game) {
    return (
      <div className="empty-note">
        {errorMsg || "Could not load this game."}
        <div style={{ marginTop: 14 }}><a className="back-link" onClick={onBack}>&larr; Back</a></div>
      </div>
    );
  }

  const ourScoreLive = QUARTERS.reduce((sum, q) => sum + Object.values(goals[q] || {}).reduce((s, v) => s + (Number(v) || 0), 0), 0);
  const oppScoreLive = QUARTERS.reduce((sum, q) => sum + (Number(oppGoals[q]) || 0), 0);

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={handleBack}>&larr; Back to {backLabel || "Upcoming Games"}</a>
        <h1 className="page-title">Round {game.round} vs {game.opponent}</h1>
      </div>

      <div className="gameday-toolbar">
        <div className="score-row">
          <div className="score-box">
            <div className="score-label">Us</div>
            <div className="score-value">{ourScoreLive}</div>
          </div>
          <div className="score-sep">-</div>
          <div className="score-box">
            <div className="score-label">{game.opponent}</div>
            <div className="score-value">{oppScoreLive}</div>
          </div>
        </div>
        <div className="quick-stats-row">
          <div className="quick-stat">
            <label>Opp Goals · Q{activeQuarter}</label>
            <input
              type="number" min="0"
              value={oppGoals[activeQuarter] || 0}
              onChange={e => updateOppGoals(activeQuarter, parseInt(e.target.value, 10) || 0)}
            />
          </div>
          <div className="quick-stat">
            <label>Turnovers · Q{activeQuarter}</label>
            <input
              type="number" min="0"
              value={turnovers[activeQuarter] || 0}
              onChange={e => updateTurnovers(activeQuarter, parseInt(e.target.value, 10) || 0)}
            />
          </div>
        </div>
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 1000, margin: "14px auto 0 auto" }}>{errorMsg}</div>}
      {infoMsg && <div className="banner info" style={{ maxWidth: 1000, margin: "14px auto 0 auto" }}>{infoMsg}</div>}

      <div className="quarter-tabs">
        {QUARTERS.map(q => (
          <button
            key={q}
            className={"quarter-tab" + (activeQuarter === q ? " active" : "")}
            onClick={() => setActiveQuarter(q)}
          >
            Quarter {q}
          </button>
        ))}
      </div>

      <CourtView
        q={activeQuarter}
        players={players}
        positions={positions}
        goals={goals}
        onAssign={assignSlot}
        onClearSlot={clearSlot}
        onToggleBench={toggleBenchStatus}
        onGoalChange={updateGoal}
      />

      <div className="quarter-panel-single">
        <QuarterPanel
          q={activeQuarter}
          notes={notes}
          onNotesChange={updateNotes}
        />
      </div>

      <div className="potm-section">
        <h3>Player of the Match</h3>
        {players.map(name => {
          const isSelected = potm.indexOf(name) !== -1;
          return (
            <div className="potm-row" key={name}>
              <label className="potm-checkbox">
                <input type="checkbox" checked={isSelected} onChange={() => togglePotm(name)} />
                <span>{name}</span>
              </label>
              {isSelected && (
                <div className="potm-details">
                  <div className="quarter-field">
                    <label>Comment</label>
                    <textarea
                      rows={3}
                      value={potmComments[name] || ""}
                      onChange={e => updatePotmComment(name, e.target.value)}
                    />
                  </div>
                  <div className="quarter-field">
                    <label>Photo</label>
                    <input
                      type="file" accept="image/*"
                      disabled={uploadingFor === name}
                      onChange={e => handlePhotoSelected(name, e.target.files && e.target.files[0])}
                    />
                    {uploadingFor === name && <div className="muted-hint">Uploading…</div>}
                    {photoPreviewUrls[name] && (
                      <img src={photoPreviewUrls[name]} alt={name + " photo"} className="potm-photo-preview" />
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div className="gameday-actions">
        <button className="secondary" onClick={handleBack} disabled={saving || submitting}>Back</button>
        <button className="primary" style={{ marginTop: 0, width: "auto" }} disabled={saving || submitting} onClick={handleSaveDraft}>
          {saving ? "Saving…" : "Save"}
        </button>
        {game.is_completed ? (
          <span style={{ color: "var(--success)", fontWeight: 600, fontSize: 13.5, alignSelf: "center" }}>
            ✓ Completed
          </span>
        ) : (
          <button
            className="primary"
            style={{ marginTop: 0, width: "auto", background: "var(--success)" }}
            disabled={saving || submitting}
            onClick={() => setShowSubmitConfirm(true)}
          >
            Submit Game
          </button>
        )}
        {role !== "team_manager" && (
          <button
            className="secondary danger-text"
            style={{ marginLeft: "auto" }}
            disabled={saving || submitting || deleting}
            onClick={() => setShowDeleteConfirm(true)}
          >
            Delete Game
          </button>
        )}
      </div>

      {showDeleteConfirm && (
        <div className="modal-overlay" onClick={() => setShowDeleteConfirm(false)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <h2>Delete this game?</h2>
            <div className="modal-subtitle">
              This permanently deletes Round {game.round} vs {game.opponent} and everything recorded on it
              (positions, scores, POTM). This can't be undone.
            </div>
            <div className="modal-actions">
              <button className="secondary" onClick={() => setShowDeleteConfirm(false)} disabled={deleting}>Cancel</button>
              <button
                className="primary"
                style={{ marginTop: 0, width: "auto", background: "var(--danger)" }}
                disabled={deleting}
                onClick={() => { setShowDeleteConfirm(false); handleDelete(); }}
              >
                {deleting ? "Deleting…" : "Delete Game"}
              </button>
            </div>
          </div>
        </div>
      )}

      {showSubmitConfirm && (
        <div className="modal-overlay" onClick={() => setShowSubmitConfirm(false)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <h2>Submit this game?</h2>
            <div className="modal-subtitle">
              This marks the game as complete and takes it off Upcoming Games. Game History (to review or
              re-edit a completed game from the web hub) isn't built yet — for now, use the Android app if
              you need to change anything after submitting.
            </div>
            <div className="modal-actions">
              <button className="secondary" onClick={() => setShowSubmitConfirm(false)}>Cancel</button>
              <button
                className="primary"
                style={{ marginTop: 0, width: "auto" }}
                disabled={submitting}
                onClick={() => { setShowSubmitConfirm(false); handleSubmit(); }}
              >
                {submitting ? "Submitting…" : "Submit Game"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function NavTile({ label, enabled, onClick }) {
  return (
    <div className={"nav-tile " + (enabled ? "enabled" : "disabled")} onClick={enabled ? onClick : undefined}>
      {label}
      {!enabled && <span className="soon">Coming soon</span>}
    </div>
  );
}

function formatSessionDate(millis) {
  return new Date(millis).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}

// Builds a YYYY-MM-DD string from LOCAL date components (never toISOString,
// which converts to UTC first — for a club in Australia that silently rolls
// the displayed date back a day for part of the evening/early morning).
function toDateInputValue(millis) {
  const d = new Date(millis);
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${mm}-${dd}`;
}

function AttendanceRow({ name, present, reason, onToggle, onReasonChange }) {
  return (
    <div className="attendance-block">
      <div className="attendance-toggle-row">
        <span>{name}</span>
        <label className="toggle-switch">
          <input type="checkbox" checked={!!present} onChange={onToggle} />
          <span className="toggle-slider"></span>
        </label>
      </div>
      {!present && (
        <div className="attendance-reason">
          <label>Reason (optional)</label>
          <input
            type="text"
            value={reason || ""}
            onChange={e => onReasonChange(e.target.value)}
            placeholder="e.g. Unavailable, injured, other commitment"
          />
        </div>
      )}
    </div>
  );
}

function TrainingSessionCard({ session, role, onOpen, onDelete }) {
  const canManage = role !== "team_manager";
  const attendanceEntries = Object.entries(session.attendance || {});
  const presentCount = attendanceEntries.filter(([, v]) => v === true).length;
  const totalCount = attendanceEntries.length;

  return (
    <div className={"game-card" + (session.is_cancelled ? " bye" : "")}>
      <div>
        <div className="round-line">
          {formatSessionDate(session.date_millis)}
          {session.is_cancelled && <span className="status-pill cancelled">Cancelled</span>}
          {session.notes && session.notes.trim() && <span className="status-pill note">Note</span>}
        </div>
        {session.is_cancelled ? (
          <div className="meta-line">{session.cancellation_reason || "No reason given"}</div>
        ) : (
          <div className="meta-line">
            {totalCount > 0 ? `${presentCount}/${totalCount} present` : "Attendance not recorded yet"}
          </div>
        )}
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <button className="secondary" onClick={() => onOpen(session)}>View / Edit</button>
        {canManage && (
          <button className="secondary danger-text" onClick={() => onDelete(session)}>Delete</button>
        )}
      </div>
    </div>
  );
}

function TrainingHistoryScreen({ clubId, role, onBack, onNewSession, onOpenSession }) {
  const [seasons, setSeasons] = useState([]);
  const [seasonName, setSeasonName] = useState("");
  const [sessions, setSessions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [errorMsg, setErrorMsg] = useState("");
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [deleting, setDeleting] = useState(false);

  useEffect(() => {
    (async () => {
      const { data, error: seasonsErr } = await db.from("seasons").select("*").eq("club_id", clubId);
      if (seasonsErr) { setErrorMsg(seasonsErr.message); setLoading(false); return; }
      setSeasons(data || []);
      if (data && data.length > 0) setSeasonName(data[0].name);
      else setLoading(false);
    })();
  }, [clubId]);

  const loadSessions = useCallback(async () => {
    if (!seasonName) return;
    setLoading(true);
    const { data, error: sessionsErr } = await db
      .from("training_sessions")
      .select("*")
      .eq("club_id", clubId)
      .eq("season", seasonName)
      .order("date_millis", { ascending: false });
    if (sessionsErr) setErrorMsg(sessionsErr.message);
    else setSessions(data || []);
    setLoading(false);
  }, [clubId, seasonName]);

  useEffect(() => { loadSessions(); }, [loadSessions]);

  async function confirmDelete() {
    if (!deleteTarget) return;
    setDeleting(true);
    setErrorMsg("");
    const { error: deleteErr } = await db.from("training_sessions").delete().eq("id", deleteTarget.id);
    setDeleting(false);
    if (deleteErr) { setErrorMsg(deleteErr.message); return; }
    setSessions(prev => prev.filter(s => s.id !== deleteTarget.id));
    setDeleteTarget(null);
  }

  const activeSessions = sessions.filter(s => !s.is_cancelled);
  const cancelledCount = sessions.length - activeSessions.length;
  const avgAttendance = (() => {
    const rates = activeSessions
      .map(s => {
        const entries = Object.entries(s.attendance || {});
        if (entries.length === 0) return null;
        const present = entries.filter(([, v]) => v === true).length;
        return present / entries.length;
      })
      .filter(r => r !== null);
    if (rates.length === 0) return null;
    return Math.round((rates.reduce((a, b) => a + b, 0) / rates.length) * 100);
  })();

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={onBack}>&larr; Back to Home</a>
        <h1 className="page-title">Training History</h1>
      </div>

      {role !== "team_manager" && (
        <div className="page-header-actions">
          <button className="secondary" onClick={onNewSession}>+ New Session</button>
        </div>
      )}

      {seasons.length > 1 && (
        <div className="season-select-row">
          <select className="season-select" value={seasonName} onChange={e => setSeasonName(e.target.value)}>
            {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
          </select>
        </div>
      )}

      {!loading && sessions.length > 0 && (
        <div className="session-summary-row">
          <div className="quick-stat"><label>Sessions</label>{sessions.length}</div>
          <div className="quick-stat"><label>Cancelled</label>{cancelledCount}</div>
          <div className="quick-stat"><label>Avg Attendance</label>{avgAttendance === null ? "—" : avgAttendance + "%"}</div>
        </div>
      )}

      {errorMsg && <div className="banner error" style={{ maxWidth: 900, margin: "14px auto 0 auto" }}>{errorMsg}</div>}

      {loading ? (
        <div className="empty-note">Loading…</div>
      ) : sessions.length === 0 ? (
        <div className="empty-note">No training sessions recorded yet.</div>
      ) : (
        <div className="game-list">
          {sessions.map(s => (
            <TrainingSessionCard
              key={s.id}
              session={s}
              role={role}
              onOpen={onOpenSession}
              onDelete={setDeleteTarget}
            />
          ))}
        </div>
      )}

      {deleteTarget && (
        <div className="modal-overlay" onClick={() => setDeleteTarget(null)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <h2>Delete this session?</h2>
            <div className="modal-subtitle">
              {formatSessionDate(deleteTarget.date_millis)} — this permanently deletes the session and its attendance record. This can't be undone.
            </div>
            <div className="modal-actions">
              <button className="secondary" onClick={() => setDeleteTarget(null)} disabled={deleting}>Cancel</button>
              <button
                className="primary"
                style={{ marginTop: 0, width: "auto", background: "var(--danger)" }}
                disabled={deleting}
                onClick={confirmDelete}
              >
                {deleting ? "Deleting…" : "Delete Session"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function TrainingSessionScreen({ sessionId, clubId, role, backLabel, onBack }) {
  const [loading, setLoading] = useState(true);
  const [seasons, setSeasons] = useState([]);
  const [seasonName, setSeasonName] = useState("");
  const [players, setPlayers] = useState([]);
  const [date, setDate] = useState(() => toDateInputValue(Date.now()));
  const [isCancelled, setIsCancelled] = useState(false);
  const [cancellationReason, setCancellationReason] = useState("");
  const [notes, setNotes] = useState("");
  const [attendance, setAttendance] = useState({});
  const [absenceReasons, setAbsenceReasons] = useState({});
  const [errorMsg, setErrorMsg] = useState("");
  const [infoMsg, setInfoMsg] = useState("");
  const [saving, setSaving] = useState(false);
  const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const [isNew, setIsNew] = useState(!sessionId);

  useEffect(() => {
    (async () => {
      setErrorMsg("");
      const [{ data: seasonsData, error: seasonsErr }, { data: playersData, error: playersErr }] = await Promise.all([
        db.from("seasons").select("*").eq("club_id", clubId),
        db.from("players").select("*").eq("club_id", clubId).order("name", { ascending: true }),
      ]);
      if (seasonsErr) { setErrorMsg(seasonsErr.message); setLoading(false); return; }
      if (playersErr) { setErrorMsg(playersErr.message); setLoading(false); return; }
      setSeasons(seasonsData || []);
      const rosterNames = (playersData || []).map(p => p.name);
      setPlayers(rosterNames);

      if (sessionId) {
        const { data: session, error: sessionErr } = await db.from("training_sessions").select("*").eq("id", sessionId).maybeSingle();
        if (sessionErr || !session) {
          setErrorMsg(sessionErr ? sessionErr.message : "Could not find this session.");
          setLoading(false);
          return;
        }
        setSeasonName(session.season);
        setDate(toDateInputValue(session.date_millis));
        setIsCancelled(!!session.is_cancelled);
        setCancellationReason(session.cancellation_reason || "");
        setNotes(session.notes || "");
        const initialAttendance = {};
        rosterNames.forEach(name => {
          initialAttendance[name] = (session.attendance || {})[name] !== false;
        });
        setAttendance(initialAttendance);
        setAbsenceReasons(session.absence_reasons || {});
      } else {
        if (seasonsData && seasonsData.length > 0) setSeasonName(seasonsData[0].name);
        const initialAttendance = {};
        rosterNames.forEach(name => { initialAttendance[name] = true; });
        setAttendance(initialAttendance);
      }
      setLoading(false);
    })();
  }, [clubId, sessionId]);

  function toggleAttendance(name) {
    setAttendance(prev => {
      const nextVal = !prev[name];
      const nextAttendance = { ...prev, [name]: nextVal };
      if (!nextVal) {
        setAbsenceReasons(r => ({ ...r, [name]: r[name] || "Unavailable" }));
      } else {
        setAbsenceReasons(r => {
          const next = { ...r };
          delete next[name];
          return next;
        });
      }
      return nextAttendance;
    });
  }

  function updateAbsenceReason(name, text) {
    setAbsenceReasons(prev => ({ ...prev, [name]: text }));
  }

  async function handleSave() {
    setErrorMsg(""); setInfoMsg("");
    if (isCancelled && !cancellationReason.trim()) {
      setErrorMsg("Please give a reason for cancelling this session.");
      return;
    }
    setSaving(true);
    const dateMillis = new Date(date + "T00:00:00").getTime();
    const payload = {
      club_id: clubId,
      season: seasonName,
      date_millis: dateMillis,
      is_cancelled: isCancelled,
      cancellation_reason: isCancelled ? cancellationReason.trim() : "",
      attendance: isCancelled ? {} : attendance,
      absence_reasons: isCancelled ? {} : absenceReasons,
      notes: notes,
    };

    if (sessionId) {
      const { error: updateErr } = await db.from("training_sessions").update(payload).eq("id", sessionId);
      setSaving(false);
      if (updateErr) { setErrorMsg(updateErr.message); return; }
      setInfoMsg("Saved.");
    } else {
      const { error: insertErr } = await db.from("training_sessions").insert(payload).select().single();
      setSaving(false);
      if (insertErr) {
        setErrorMsg(insertErr.message.includes("duplicate")
          ? "A training session already exists for this date and season."
          : insertErr.message);
        return;
      }
      setIsNew(false);
      onBack();
      return;
    }
  }

  async function handleDelete() {
    setDeleting(true);
    setErrorMsg("");
    const { error: deleteErr } = await db.from("training_sessions").delete().eq("id", sessionId);
    setDeleting(false);
    if (deleteErr) { setErrorMsg(deleteErr.message); return; }
    onBack();
  }

  if (loading) {
    return <div className="center-screen"><span className="spinner-text">Loading…</span></div>;
  }

  const canManage = role !== "team_manager";

  return (
    <div>
      <div className="page-header">
        <a className="back-link" onClick={onBack}>&larr; Back to {backLabel}</a>
        <h1 className="page-title">{isNew ? "New Training Session" : "Training Session"}</h1>
      </div>

      {errorMsg && <div className="banner error" style={{ maxWidth: 480, margin: "14px auto 0 auto" }}>{errorMsg}</div>}
      {infoMsg && <div className="banner info" style={{ maxWidth: 480, margin: "14px auto 0 auto" }}>{infoMsg}</div>}

      <div className="session-form">
        <div className="session-field">
          <label>Season</label>
          {seasons.length > 1 ? (
            <select value={seasonName} onChange={e => setSeasonName(e.target.value)}>
              {seasons.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
            </select>
          ) : (
            <div className="muted-hint">{seasonName || "—"}</div>
          )}
        </div>

        <div className="session-field">
          <label>Date</label>
          <input type="date" value={date} onChange={e => setDate(e.target.value)} />
        </div>

        <div className="session-field">
          <div className="attendance-toggle-row">
            <label style={{ margin: 0 }}>Cancel this session</label>
            <label className="toggle-switch">
              <input type="checkbox" checked={isCancelled} onChange={() => setIsCancelled(v => !v)} />
              <span className="toggle-slider"></span>
            </label>
          </div>
        </div>

        {isCancelled && (
          <div className="session-field">
            <label>Reason for cancelling</label>
            <input type="text" value={cancellationReason} onChange={e => setCancellationReason(e.target.value)} placeholder="e.g. Rain/Wet weather" />
          </div>
        )}

        <div className="session-field">
          <label>Notes (optional)</label>
          <textarea rows={3} value={notes} onChange={e => setNotes(e.target.value)} placeholder="e.g. Focused on shooting drills, court was wet in patches" />
        </div>
      </div>

      {!isCancelled && (
        <div className="attendance-section">
          <h3>Attendance</h3>
          {players.length === 0 ? (
            <div className="empty-note">No players recorded for this club yet.</div>
          ) : (
            players.map(name => (
              <AttendanceRow
                key={name}
                name={name}
                present={attendance[name]}
                reason={absenceReasons[name]}
                onToggle={() => toggleAttendance(name)}
                onReasonChange={text => updateAbsenceReason(name, text)}
              />
            ))
          )}
        </div>
      )}

      <div className="session-actions">
        {!isNew && canManage && (
          <button className="secondary danger-text" onClick={() => setShowDeleteConfirm(true)} disabled={saving || deleting}>
            Delete Session
          </button>
        )}
        <button className="primary" style={{ marginTop: 0, width: "auto" }} onClick={handleSave} disabled={saving || deleting}>
          {saving ? "Saving…" : "Save"}
        </button>
      </div>

      {showDeleteConfirm && (
        <div className="modal-overlay" onClick={() => setShowDeleteConfirm(false)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <h2>Delete this session?</h2>
            <div className="modal-subtitle">
              This permanently deletes the session and its attendance record. This can't be undone.
            </div>
            <div className="modal-actions">
              <button className="secondary" onClick={() => setShowDeleteConfirm(false)} disabled={deleting}>Cancel</button>
              <button
                className="primary"
                style={{ marginTop: 0, width: "auto", background: "var(--danger)" }}
                disabled={deleting}
                onClick={() => { setShowDeleteConfirm(false); handleDelete(); }}
              >
                {deleting ? "Deleting…" : "Delete Session"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
